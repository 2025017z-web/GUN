<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人間×AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #050510; font-family: sans-serif; user-select: none; }
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    .nametag { position: absolute; color: #ffffff; font-weight: bold; font-size: 13px; text-shadow: 0 0 4px #000; pointer-events: none; transform: translate(-50%, -100%); background: rgba(0,0,0,0.65); padding: 3px 10px; border-radius: 6px; display: none; border: 1px solid rgba(255,255,255,0.2); z-index: 999; }
    #loot-prompt { position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%); color: #ffd700; font-weight: bold; font-size: 20px; text-shadow: 0 0 10px #000; display: none; pointer-events: none; background: rgba(0,0,0,0.75); padding: 8px 20px; border-radius: 20px; border: 2px solid #ffd700; z-index: 9999; }
    #glider-prompt { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); color: #00f5d4; font-size: 22px; font-weight: bold; text-shadow: 0 0 8px #000; display: none; pointer-events: none; background: rgba(0,0,0,0.75); padding: 10px 24px; border-radius: 20px; border: 2px solid #00f5d4; z-index: 9999; }
    
    /* 武器スロットUI (右下に配置) */
    #weapon-inventory-bar {
      position: absolute; bottom: 30px; right: 30px; left: auto; transform: none;
      display: none; gap: 8px; z-index: 9999; pointer-events: none;
    }
    .inventory-slot {
      width: 70px; height: 50px; background: rgba(10, 10, 25, 0.88); border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 11px; font-weight: bold; backdrop-filter: blur(6px); transition: all 0.15s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .inventory-slot.active {
      border-color: #ffd700; background: rgba(255, 215, 0, 0.3); transform: scale(1.08); box-shadow: 0 0 15px #ffd700;
    }
    .slot-key { font-size: 11px; color: #00f5d4; margin-bottom: 2px; font-weight: 900; }

    /* フォートナイト風クロスヘア */
    #crosshair {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      pointer-events: none; z-index: 99999; display: none; width: 30px; height: 30px;
    }
    .ch-line { position: absolute; background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(0,0,0,0.8); }
    .ch-top { top: 0px; left: 14px; width: 2px; height: 8px; }
    .ch-bottom { bottom: 0px; left: 14px; width: 2px; height: 8px; }
    .ch-left { left: 0px; top: 14px; width: 8px; height: 2px; }
    .ch-right { right: 0px; top: 14px; width: 8px; height: 2px; }
    .ch-dot { position: absolute; top: 13px; left: 13px; width: 4px; height: 4px; background: #00f5d4; border-radius: 50%; border: 1px solid #000; }
  </style>
</head>
<body>

  <div id="canvas-container"></div>
  <div id="loot-prompt">プレス [E] で宝箱を開ける</div>
  <div id="glider-prompt">🪂 [SPACE] でグライダーを展開！（展開しないと落下死）</div>
  
  <div id="weapon-inventory-bar"></div>

  <div id="crosshair">
    <div class="ch-line ch-top"></div>
    <div class="ch-line ch-bottom"></div>
    <div class="ch-line ch-left"></div>
    <div class="ch-line ch-right"></div>
    <div class="ch-dot"></div>
  </div>

  <script>
    (function() {
      let socket = io();
      let container = document.getElementById('canvas-container');
      let lootPrompt = document.getElementById('loot-prompt');
      let gliderPrompt = document.getElementById('glider-prompt');
      let inventoryBar = document.getElementById('weapon-inventory-bar');
      let crosshair = document.getElementById('crosshair');

      let damageOverlay = document.createElement('div');
      damageOverlay.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;box-shadow:inset 0 0 100px rgba(255,0,0,0);pointer-events:none;z-index:99999;transition:box-shadow 0.1s ease-out;';
      container.appendChild(damageOverlay);

      function triggerDamageFlash() {
        damageOverlay.style.transition = 'none';
        damageOverlay.style.boxShadow = 'inset 0 0 80px rgba(255, 0, 0, 0.8)';
        setTimeout(() => {
          damageOverlay.style.transition = 'box-shadow 0.4s ease-out';
          damageOverlay.style.boxShadow = 'inset 0 0 100px rgba(255,0,0,0)';
        }, 50);
      }

      let scene = new THREE.Scene();
      let camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);
      
      let renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      let playerPhys = { x: 0, y: 0, z: 0, radius: 0.8, height: 2.2, vy: 0, isGrounded: true, isSkyDiving: false, isGliding: false };
      let yaw = 0, pitch = 0;
      let targetFov = 70;
      let cameraDist = 5.5; 
      let isAiming = false; 
      let isFirstPerson = false;

      let ambientLight = new THREE.AmbientLight(0xffffff, 0.65); 
      scene.add(ambientLight);

      let dirLight = new THREE.DirectionalLight(0xffffff, 1.25);
      dirLight.position.set(150, 250, 100);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 1024;
      dirLight.shadow.mapSize.height = 1024;
      dirLight.shadow.camera.near = 0.5;
      dirLight.shadow.camera.far = 350;
      let d = 140;
      dirLight.shadow.camera.left = -d; dirLight.shadow.camera.right = d;
      dirLight.shadow.camera.top = d; dirLight.shadow.camera.bottom = -d;
      scene.add(dirLight);

      const MAP_SIZE = 700;

      function getTerrainHeight(x, z) {
        if (selectedMode !== 'BR') return 0;
        if (Math.abs(x) > MAP_SIZE / 2 || Math.abs(z) > MAP_SIZE / 2) return 0;
        
        let townCenters = [
          { x: 0, z: 0, r: 90 },
          { x: -200, z: -200, r: 80 },
          { x: 200, z: 200, r: 80 },
          { x: -200, z: 200, r: 80 },
          { x: 200, z: -200, r: 80 },
          { x: 0, z: -250, r: 80 },
          { x: 0, z: 250, r: 80 }
        ];

        for (let t of townCenters) {
          let dist = Math.hypot(x - t.x, z - t.z);
          if (dist < t.r) {
            return 0;
          } else if (dist < t.r + 30) {
            let rawY = Math.sin(x * 0.02) * Math.cos(z * 0.02) * 16.0 + Math.sin(x * 0.06) * 5.0;
            let factor = (dist - t.r) / 30;
            return rawY * factor;
          }
        }

        let y = Math.sin(x * 0.02) * Math.cos(z * 0.02) * 16.0 + Math.sin(x * 0.06) * 5.0;
        return y;
      }

      function generateBrickTexture() {
        let cv = document.createElement('canvas'); cv.width = 256; cv.height = 256;
        let ctx = cv.getContext('2d');
        ctx.fillStyle = '#8b3a2b'; ctx.fillRect(0,0,256,256);
        ctx.strokeStyle = '#5a2319'; ctx.lineWidth = 4;
        for(let y=0; y<256; y+=32) {
          ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(256,y); ctx.stroke();
          let offset = (y/32)%2 === 0 ? 0 : 32;
          for(let x=offset; x<256; x+=64) {
            ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+32); ctx.stroke();
          }
        }
        return new THREE.CanvasTexture(cv);
      }

      function generateWoodTexture() {
        let cv = document.createElement('canvas'); cv.width = 256; cv.height = 256;
        let ctx = cv.getContext('2d');
        ctx.fillStyle = '#a0522d'; ctx.fillRect(0,0,256,256);
        ctx.fillStyle = '#8b4513';
        for(let i=0; i<30; i++) {
          ctx.fillRect(0, Math.random()*256, 256, Math.random()*4+1);
        }
        return new THREE.CanvasTexture(cv);
      }

      function generateGrassTexture() {
        let cv = document.createElement('canvas'); cv.width = 512; cv.height = 512;
        let ctx = cv.getContext('2d');
        ctx.fillStyle = '#2e8b57'; ctx.fillRect(0,0,512,512);
        for(let i=0; i<5000; i++) {
          ctx.fillStyle = Math.random() > 0.5 ? '#3cb371' : '#1e5631';
          ctx.fillRect(Math.random()*512, Math.random()*512, 2, 6);
        }
        return new THREE.CanvasTexture(cv);
      }

      let texBrick = generateBrickTexture(); texBrick.wrapS = THREE.RepeatWrapping; texBrick.wrapT = THREE.RepeatWrapping;
      let texWood = generateWoodTexture(); texWood.wrapS = THREE.RepeatWrapping; texWood.wrapT = THREE.RepeatWrapping;
      let texGrass = generateGrassTexture(); texGrass.wrapS = THREE.RepeatWrapping; texGrass.wrapT = THREE.RepeatWrapping; texGrass.repeat.set(80, 80);

      let saveData = {
        playerName: '',
        coins: 500, 
        unlocked: { laser: true, revolver: true, shotgun: true, flame: false, sniper: true, plasma: false, bow: false, blizzard: false, minigun: true, voidray: false },
        equipped: 'laser',
        keyMap: { forward: 'KeyW', left: 'KeyA', backward: 'KeyS', right: 'KeyD', jump: 'Space', reload: 'KeyR', switchView: 'KeyV', dash: 'KeyQ', interact: 'KeyE' }
      };
      
      let localSave = localStorage.getItem('fps_zombie_horizontal_v6');
      if (localSave) {
        try { 
          let parsed = JSON.parse(localSave);
          saveData = Object.assign(saveData, parsed);
          if (parsed.keyMap) saveData.keyMap = Object.assign(saveData.keyMap, parsed.keyMap);
        } catch(e){}
      }
      function save() { localStorage.setItem('fps_zombie_horizontal_v6', JSON.stringify(saveData)); }

      let weaponStats = {
        laser: { name: '⚡ 初期レーザー', cost: 0, maxAmmo: 30, dmg: 1.1, reloadTime: 60, color: 0x00ffff, size: 0.05, speed: 2.2, shootInterval: 12 },
        revolver: { name: '💥 ヘビーマグナム', cost: 150, maxAmmo: 6, dmg: 4.5, reloadTime: 80, color: 0xffaa00, size: 0.09, speed: 2.8, shootInterval: 35 },
        shotgun: { name: '🌊 三連ショットガン', cost: 300, maxAmmo: 10, dmg: 1.6, reloadTime: 90, color: 0xff00ff, size: 0.06, speed: 1.8, shootInterval: 42 },
        flame: { name: '🔥 焼夷レジスタンス', cost: 2500, maxAmmo: 180, dmg: 0.4, reloadTime: 100, color: 0xff4500, size: 0.35, speed: 0.9, shootInterval: 2 }, 
        sniper: { name: '🎯 スナイパーライフル', cost: 1000, maxAmmo: 5, dmg: 9.5, reloadTime: 120, color: 0xffffff, size: 0.04, speed: 5.0, shootInterval: 55 },
        plasma: { name: '🌀 プラズマランチャー', cost: 1500, maxAmmo: 8, dmg: 6.5, reloadTime: 130, color: 0x00ff55, size: 0.45, speed: 1.1, shootInterval: 48 },
        bow: { name: '🏹 デーモンクロスボウ', cost: 2000, maxAmmo: 12, dmg: 5.0, reloadTime: 70, color: 0xff0055, size: 0.08, speed: 1.6, shootInterval: 25, isPierce: true },
        blizzard: { name: '❄️ ブリザードカノン', cost: 3000, maxAmmo: 15, dmg: 0.5, reloadTime: 100, color: 0x88ccff, size: 0.5, speed: 1.1, shootInterval: 30 },
        minigun: { name: '⚡️ インフィニティミニガン', cost: 5000, maxAmmo: 500, dmg: 0.6, reloadTime: 200, color: 0xffff00, size: 0.04, speed: 2.5, shootInterval: 1 },
        voidray: { name: '🔮 ヴォイド・レイ', cost: 10000, maxAmmo: 60, dmg: 2.5, reloadTime: 80, color: 0x9900ff, size: 0.15, speed: 2.2, shootInterval: 6 }
      };

      let playerSlots = ['laser'];
      let currentSlotIndex = 0;

      function switchWeaponSlot(index) {
        if (selectedMode === '1V1') { index = 0; saveData.equipped = 'laser'; }
        if (index < 0 || index >= playerSlots.length) return;
        currentSlotIndex = index;
        saveData.equipped = playerSlots[currentSlotIndex];
        let currentW = weaponStats[saveData.equipped];
        player.maxAmmo = currentW.maxAmmo;
        player.ammo = player.maxAmmo;
        player.isReloading = false;
        playerModel.equipWeaponVisual(saveData.equipped, currentW.color);
        updateInventoryUI();
        updateHUD();
      }

      function updateInventoryUI() {
        if (gameState !== 'PLAYING') {
          inventoryBar.style.display = 'none';
          return;
        }
        inventoryBar.style.display = 'flex';
        inventoryBar.innerHTML = '';
        for (let i = 0; i < 5; i++) {
          let slotEl = document.createElement('div');
          slotEl.className = `inventory-slot ${i === currentSlotIndex ? 'active' : ''}`;
          if (i < playerSlots.length) {
            let w = weaponStats[playerSlots[i]];
            slotEl.innerHTML = `<span class="slot-key">[${i+1}]</span><span>${w.name.split(' ')[1] || w.name}</span>`;
          } else {
            slotEl.innerHTML = `<span class="slot-key">[${i+1}]</span><span style="color:#666;">- 空き -</span>`;
          }
          inventoryBar.appendChild(slotEl);
        }
      }

      let player = { hp: 100, maxHp: 100, shield: 100, maxShield: 100, ammo: 30, maxAmmo: 30, isReloading: false, reloadTimer: 0, shootCooldownTimer: 0 };
      let isMouseDown = false; 

      let gameState = 'NAME_INPUT'; 
      let selectedMode = 'BR'; 
      let duelSubMode = 'BOT';
      let zombieSubMode = 'SOLO';
      let currentRoomId = null;
      let isRoundEnding = false;

      let isZombieHost = false;

      let currentWave = 0;
      let totalKills = 0;
      let meleeDamageTimer = 0; 
      let playerBullets = [];
      let enemies = [];
      let chests = [];
      let destructibles = [];

      let duelRound = 1;
      let playerWins = 0;
      let rivalWins = 0;
      let rival = null; 

      let currentGrid = null;
      let stageProps = [];
      let walls = [];
      let terrainMesh = null;

      function createGliderMesh() {
        let gliderGroup = new THREE.Group();
        let wingGeo = new THREE.ConeGeometry(1.2, 0.8, 4);
        let wingMat = new THREE.MeshLambertMaterial({ color: 0xff0055, side: THREE.DoubleSide });
        let wing = new THREE.Mesh(wingGeo, wingMat);
        wing.rotation.x = Math.PI / 2;
        wing.scale.set(1.2, 0.15, 0.8);
        gliderGroup.add(wing);

        let barGeo = new THREE.CylinderGeometry(0.04, 0.04, 1.2);
        let barMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
        let bar = new THREE.Mesh(barGeo, barMat);
        bar.rotation.z = Math.PI / 2;
        bar.position.set(0, -0.4, 0.1);
        gliderGroup.add(bar);

        gliderGroup.position.set(0, 2.2, 0);
        gliderGroup.visible = false;
        return gliderGroup;
      }

      function buildGunMesh(weaponKey, colorHex) {
        let gunGroup = new THREE.Group();
        let mainMat = new THREE.MeshLambertMaterial({ color: 0x1f1f1f });
        let accentMat = new THREE.MeshLambertMaterial({ color: colorHex });
        let dBody = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.6), mainMat); dBody.position.set(0, 0.1, -0.2);
        let dBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.4), accentMat); dBarrel.rotation.x = Math.PI/2; dBarrel.position.set(0, 0.1, -0.5); dBody.add(dBarrel);
        gunGroup.add(dBody);
        return gunGroup;
      }

      function createRobloxModel(colorHex, isEnemy = false, isZombie = false) {
        let rootGroup = new THREE.Group();
        let mat = new THREE.MeshLambertMaterial({ color: colorHex });
        let head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), mat); head.position.y = 2.4; head.castShadow = true; rootGroup.add(head);
        let torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.4, 0.6), mat); torso.position.y = 1.3; torso.castShadow = true; rootGroup.add(torso);
        let leftLegPivot = new THREE.Group(); leftLegPivot.position.set(-0.35, 0.7, 0);
        let leftLegMesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.2, 0.5), mat); leftLegMesh.position.y = -0.6; leftLegMesh.castShadow = true; leftLegPivot.add(leftLegMesh); rootGroup.add(leftLegPivot);
        let rightLegPivot = new THREE.Group(); rightLegPivot.position.set(0.35, 0.7, 0);
        let rightLegMesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.2, 0.5), mat); rightLegMesh.position.y = -0.6; rightLegMesh.castShadow = true; rightLegPivot.add(rightLegMesh); rootGroup.add(rightLegPivot);
        let leftArmGroup = new THREE.Group(); leftArmGroup.position.set(-0.8, 1.4, 0);
        let leftArmMesh = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.2, 0.4), mat); leftArmMesh.position.y = -0.5; leftArmMesh.castShadow = true; leftArmGroup.add(leftArmMesh); rootGroup.add(leftArmGroup);
        let rightArmGroup = new THREE.Group(); rightArmGroup.position.set(0.8, 1.4, 0);
        let rightArmMesh = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 1.0), mat); rightArmMesh.position.set(0, 0, -0.5); rightArmMesh.castShadow = true; rightArmGroup.add(rightArmMesh); 
        rootGroup.add(rightArmGroup);

        let gliderMesh = createGliderMesh();
        rootGroup.add(gliderMesh);

        let currentGun = null;
        function equipWeaponVisual(weaponKey, accentColor) {
          if (currentGun) rightArmGroup.remove(currentGun);
          if (!isZombie) {
            currentGun = buildGunMesh(weaponKey, accentColor);
            currentGun.position.set(0, 0, -1.0);
            rightArmGroup.add(currentGun);
          }
        }
        if(!isEnemy) equipWeaponVisual(saveData.equipped, weaponStats[saveData.equipped].color);
        else if(!isZombie) equipWeaponVisual('revolver', 0xff0000); 

        return { 
          mesh: rootGroup, head: head, leftLeg: leftLegPivot, rightLeg: rightLegPivot, leftArmGroup: leftArmGroup, rightArmGroup: rightArmGroup,
          gliderMesh: gliderMesh, equipWeaponVisual: equipWeaponVisual, getGun: () => currentGun, isZombie: isZombie
        };
      }

      let playerModel = createRobloxModel(0x2a9d8f, false);
      scene.add(playerModel.mesh);

      let opponentNametag = document.createElement('div');
      opponentNametag.className = 'nametag';
      container.appendChild(opponentNametag);

      let remoteNametags = {};

      let hud = document.createElement('div');
      hud.style.cssText = 'position:absolute;bottom:30px;left:30px;color:#fff;font-family:"Arial Black", Impact, sans-serif;width:380px;background:rgba(10,10,20,0.85);backdrop-filter:blur(8px);padding:14px 22px;border-radius:24px;pointer-events:none;border:1px solid rgba(255,255,255,0.15);box-shadow:0 8px 32px rgba(0,0,0,0.6);display:none;z-index:9999;';
      container.appendChild(hud);

      let viewIndicator = document.createElement('div');
      viewIndicator.style.cssText = 'position:absolute;top:20px;left:20px;color:rgba(255,255,255,0.8);font-size:13px;font-family:sans-serif;background:rgba(0,0,0,0.5);padding:6px 14px;border-radius:15px;pointer-events:none;display:none; border: 1px solid rgba(255,255,255,0.1);z-index:9999;';
      container.appendChild(viewIndicator);

      let menuOverlay = document.createElement('div');
      menuOverlay.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(10,10,25,0.98);display:flex;flex-direction:column;justify-flex-start;align-items:center;color:#fff;text-align:center;overflow-y:auto;padding:30px 20px;box-sizing:border-box; z-index:999990;';
      container.appendChild(menuOverlay);

      let centralMessage = document.createElement('div');
      centralMessage.style.cssText = 'position:absolute;top:35%;left:50%;transform:translate(-50%,-50%);font-family:"Permanent Marker", cursive;font-size:60px;font-weight:900;pointer-events:none;z-index:999999;transition:opacity 0.4s ease;opacity:0;text-align:center;width:100%;';
      container.appendChild(centralMessage);

      function showCentralMessage(text, color, duration = 2000) {
        centralMessage.innerText = text; centralMessage.style.color = color;
        centralMessage.style.textShadow = `0 0 25px ${color}`; centralMessage.style.opacity = '1';
        setTimeout(() => { centralMessage.style.opacity = '0'; }, duration);
      }

      let damageTexts = [];
      function createFortniteDamageText(amount, worldPos, isHeadshot) {
        let vector = worldPos.clone().project(camera);
        let x = (vector.x * .5 + .5) * window.innerWidth;
        let y = (-(vector.y * .5) + .5) * window.innerHeight;
        let el = document.createElement('div');
        let color = isHeadshot ? '#ffd700' : '#ff7700'; 
        el.style.cssText = `position: absolute; left: ${x}px; top: ${y}px; color: ${color}; font-family: 'Arial Black', Impact, sans-serif; font-size: ${isHeadshot ? '42px' : '28px'}; font-weight: 900; text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000; pointer-events: none; z-index: 99999; transform: translate(-50%, -50%);`;
        el.innerText = Math.ceil(amount * (isHeadshot ? 20 : 10));
        container.appendChild(el);
        damageTexts.push({ element: el, pos: worldPos.clone(), vx: (Math.random() - 0.5) * 60, vy: -120, age: 0, maxAge: 30 });
      }

      function updateDamageTexts(dt) {
        for (let i = damageTexts.length - 1; i >= 0; i--) {
          let t = damageTexts[i]; t.age++; t.vy += 350 * dt; t.pos.y -= (t.vy * 0.0002);
          let vector = t.pos.clone().project(camera);
          t.element.style.left = `${(vector.x * .5 + .5) * window.innerWidth}px`;
          t.element.style.top = `${(-(vector.y * .5) + .5) * window.innerHeight}px`;
          if (t.age > 15) t.element.style.opacity = (30 - t.age) / 15;
          if (t.age >= 30) { t.element.remove(); damageTexts.splice(i, 1); }
        }
      }

      let floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshLambertMaterial());
      floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

      function createWall(w, h, d, x, z, yPos = null, isDestructible = false, tex = null) {
        let gY = yPos !== null ? yPos : (getTerrainHeight(x, z) + h/2);
        let mat = tex ? new THREE.MeshLambertMaterial({ map: tex }) : new THREE.MeshLambertMaterial({ color: 0x0d1121 });
        let mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
        mesh.position.set(x, gY, z); mesh.castShadow = true; mesh.receiveShadow = true;
        scene.add(mesh); stageProps.push(mesh);
        
        let wallData = { mesh: mesh, x: x, y: gY, z: z, w: w, h: h, d: d, hp: 5.0, maxHp: 5.0, isDestructible: isDestructible };
        walls.push(wallData);
        if (isDestructible) destructibles.push(wallData);
        return mesh;
      }

      function createSubdividedWall(w, h, d, cx, cz, yPos, isDestructible = true, tex = null) {
        if (selectedMode !== 'BR') isDestructible = false;
        let subSize = 3.5; 
        let numX = Math.max(1, Math.round(w / subSize));
        let numY = Math.max(1, Math.round(h / subSize));
        let numZ = Math.max(1, Math.round(d / subSize));

        let blockW = w / numX;
        let blockH = h / numY;
        let blockD = d / numZ;

        let startX = cx - w / 2 + blockW / 2;
        let startY = yPos - h / 2 + blockH / 2;
        let startZ = cz - d / 2 + blockD / 2;

        for (let ix = 0; ix < numX; ix++) {
          for (let iy = 0; iy < numY; iy++) {
            for (let iz = 0; iz < numZ; iz++) {
              let bx = startX + ix * blockW;
              let by = startY + iy * blockH;
              let bz = startZ + iz * blockD;
              createWall(blockW, blockH, blockD, bx, by, bz, isDestructible, tex);
            }
          }
        }
      }

      function createTallBuilding(cx, cz) {
        let baseFloorY = getTerrainHeight(cx, cz);
        let floorHeight = 8.5; 
        let totalFloors = 4;
        let isDest = (selectedMode === 'BR');

        for (let f = 0; f < totalFloors; f++) {
          let currentY = baseFloorY + f * floorHeight;
          createWall(16, 0.5, 16, cx, cz, currentY, false, texWood);

          createSubdividedWall(16, floorHeight, 1, cx, cz - 8, currentY + floorHeight/2, isDest, texBrick);
          createSubdividedWall(16, floorHeight, 1, cx, cz + 8, currentY + floorHeight/2, isDest, texBrick);
          createSubdividedWall(1, floorHeight, 16, cx - 8, cz, currentY + floorHeight/2, isDest, texBrick);
          createSubdividedWall(1, floorHeight, 16, cx + 8, cz, currentY + floorHeight/2, isDest, texBrick);

          if (f > 0 && selectedMode === 'BR') {
            spawnChest(cx + (Math.random()*6-3), currentY + 0.2, cz + (Math.random()*6-3));
          }
        }
        let roofY = baseFloorY + totalFloors * floorHeight;
        createWall(18, 0.6, 18, cx, cz, roofY, false, texWood);
        if (selectedMode === 'BR') spawnChest(cx, roofY + 0.3, cz);
      }

      function createWideHouse(cx, cz) {
        let baseFloorY = getTerrainHeight(cx, cz);
        let floorHeight = 8.0;
        let isDest = (selectedMode === 'BR');

        createWall(26, 0.5, 20, cx, cz, baseFloorY, false, texWood);
        createSubdividedWall(26, floorHeight, 1, cx, cz - 10, baseFloorY + floorHeight/2, isDest, texBrick);
        createSubdividedWall(26, floorHeight, 1, cx, cz + 10, baseFloorY + floorHeight/2, isDest, texBrick);
        createSubdividedWall(1, floorHeight, 20, cx - 13, cz, baseFloorY + floorHeight/2, isDest, texBrick);
        createSubdividedWall(1, floorHeight, 20, cx + 13, cz, baseFloorY + floorHeight/2, isDest, texBrick);
        if (selectedMode === 'BR') spawnChest(cx - 8, baseFloorY + 0.2, cz - 5);

        let floor2Y = baseFloorY + floorHeight;
        createWall(26, 0.5, 20, cx, cz, floor2Y, false, texWood);
        createSubdividedWall(26, floorHeight, 1, cx, cz - 10, floor2Y + floorHeight/2, isDest, texBrick);
        createSubdividedWall(26, floorHeight, 1, cx, cz + 10, floor2Y + floorHeight/2, isDest, texBrick);
        createSubdividedWall(1, floorHeight, 20, cx - 13, cz, floor2Y + floorHeight/2, isDest, texBrick);
        createSubdividedWall(1, floorHeight, 20, cx + 13, cz, floor2Y + floorHeight/2, isDest, texBrick);

        createSubdividedWall(1, floorHeight, 10, cx, cz - 5, floor2Y + floorHeight/2, isDest, texWood);
        if (selectedMode === 'BR') {
          spawnChest(cx + 6, floor2Y + 0.2, cz + 4);
          spawnChest(cx - 6, floor2Y + 0.2, cz - 4);
        }

        let roofY = floor2Y + floorHeight;
        createWall(28, 0.6, 22, cx, cz, roofY, false, texWood);
        if (selectedMode === 'BR') spawnChest(cx, roofY + 0.3, cz);
      }

      function createBRTerrainAndTowns() {
        let geo = new THREE.PlaneGeometry(MAP_SIZE, MAP_SIZE, 100, 100);
        geo.rotateX(-Math.PI / 2);
        let pos = geo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          let x = pos.getX(i);
          let z = pos.getZ(i);
          let y = getTerrainHeight(x, z);
          pos.setY(i, y);
        }
        geo.computeVertexNormals();

        let mat = new THREE.MeshStandardMaterial({ map: texGrass, roughness: 0.8 });
        terrainMesh = new THREE.Mesh(geo, mat);
        terrainMesh.receiveShadow = true;
        scene.add(terrainMesh);
        stageProps.push(terrainMesh);

        let b = MAP_SIZE / 2;
        walls.push(
          { x: 0, y: 50, z: b, w: MAP_SIZE, h: 200, d: 4, isDestructible: false },
          { x: 0, y: 50, z: -b, w: MAP_SIZE, h: 200, d: 4, isDestructible: false },
          { x: b, y: 50, z: 0, w: 4, h: 200, d: MAP_SIZE, isDestructible: false },
          { x: -b, y: 50, z: 0, w: 4, h: 200, d: MAP_SIZE, isDestructible: false }
        );

        let towns = [
          { cx: 0, cz: 0, type: 'CAPITAL' },
          { cx: -200, cz: -200, type: 'TOWERS' },
          { cx: 200, cz: 200, type: 'HOUSES' },
          { cx: -200, cz: 200, type: 'TOWERS' },
          { cx: 200, cz: -200, type: 'HOUSES' },
          { cx: 0, cz: -250, type: 'HOUSES' },
          { cx: 0, cz: 250, type: 'TOWERS' }
        ];

        towns.forEach(t => {
          if (t.type === 'CAPITAL') {
            createTallBuilding(t.cx - 20, t.cz - 20);
            createTallBuilding(t.cx + 20, t.cz + 20);
            createWideHouse(t.cx + 25, t.cz - 25);
            createWideHouse(t.cx - 25, t.cz + 25);
          } else if (t.type === 'TOWERS') {
            createTallBuilding(t.cx, t.cz);
            createWideHouse(t.cx + 30, t.cz);
          } else {
            createWideHouse(t.cx, t.cz);
            createWideHouse(t.cx - 30, t.cz + 20);
          }
        });

        for (let i = 0; i < 20; i++) {
          let rx = (Math.random() - 0.5) * (MAP_SIZE - 100);
          let rz = (Math.random() - 0.5) * (MAP_SIZE - 100);
          let ry = getTerrainHeight(rx, rz);
          spawnChest(rx, ry + 0.2, rz);
        }
      }

      function spawnChest(x, y, z) {
        let boxGeo = new THREE.BoxGeometry(2, 1.5, 1.5);
        let boxMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 });
        let mesh = new THREE.Mesh(boxGeo, boxMat);
        mesh.position.set(x, y + 0.75, z);
        mesh.castShadow = true;
        scene.add(mesh);
        stageProps.push(mesh);
        chests.push({ mesh: mesh, x: x, y: y, z: z, opened: false });
      }

      function rebuildStage(mode) {
        stageProps.forEach(p => scene.remove(p)); stageProps = []; walls = []; destructibles = []; chests = [];
        if (currentGrid) scene.remove(currentGrid);
        if (terrainMesh) { scene.remove(terrainMesh); terrainMesh = null; }

        if (mode === 'BR') {
          createBRTerrainAndTowns();
          scene.fog = new THREE.FogExp2(0x87ceeb, 0.0035);
          renderer.setClearColor(0x87ceeb);
        } else if (mode === 'ZOMBIE') {
          floor.material.color.setHex(0x0a0505); 
          currentGrid = new THREE.GridHelper(120, 40, 0xff0000, 0x330000); 
          scene.fog = new THREE.FogExp2(0x1a0a0a, 0.02); 
          renderer.setClearColor(0x1a0a0a);

          let zb = 50;
          createWall(100, 10, 2, 0, zb, null, false, texBrick);
          createWall(100, 10, 2, 0, -zb, null, false, texBrick);
          createWall(2, 10, 100, zb, 0, null, false, texBrick);
          createWall(2, 10, 100, -zb, 0, null, false, texBrick);

          let innerWalls = [
            {x: -18, z: -18}, {x: 18, z: 18}, {x: -18, z: 18}, {x: 18, z: -18},
            {x: 0, z: -15}, {x: 0, z: 15}, {x: -15, z: 0}, {x: 15, z: 0}
          ];
          innerWalls.forEach(p => { createWall(8, 6, 8, p.x, p.z, null, false, texBrick); });

          currentGrid.position.y = 0.01; scene.add(currentGrid);
        } else {
          floor.material.color.setHex(0x050a15); 
          currentGrid = new THREE.GridHelper(100, 40, 0x00a8ff, 0x002b47); 
          scene.fog = new THREE.FogExp2(0x050812, 0.015); 
          renderer.setClearColor(0x050812);
          
          createWall(4, 10, 4, 0, 0, null, false, texBrick); 
          createWall(10, 5, 2, -15, 5, null, false, texWood); 
          createWall(10, 5, 2, 15, -5, null, false, texWood);
          createWall(2, 8, 20, -25, 0, null, false, texBrick);
          createWall(2, 8, 20, 25, 0, null, false, texBrick);

          currentGrid.position.y = 0.01; scene.add(currentGrid);
        }
      }

      /* 高精度の水平・垂直分離型当たり判定（貫通防止） */
      function checkWallCollision(px, pz, radius, py) {
        let pBottom = py + 0.3;
        let pTop = py + 2.1;

        for (let i = 0; i < walls.length; i++) {
          let w = walls[i];
          let wBottom = w.y - w.h/2;
          let wTop = w.y + w.h/2;

          // 高さが交差している場合のみ水平衝突
          if (pBottom < wTop && pTop > wBottom) {
            let minX = w.x - w.w/2 - radius;
            let maxX = w.x + w.w/2 + radius;
            let minZ = w.z - w.d/2 - radius;
            let maxZ = w.z + w.d/2 + radius;

            if (px > minX && px < maxX && pz > minZ && pz < maxZ) {
              return true;
            }
          }
        }
        return false;
      }

      function getHighestGroundY(px, pz, py, radius) {
        let terrainY = getTerrainHeight(px, pz);
        let highestY = terrainY;

        for (let i = 0; i < walls.length; i++) {
          let w = walls[i];
          let topY = w.y + w.h/2;
          
          if (py >= topY - 0.6) {
            let minX = w.x - w.w/2 - radius;
            let maxX = w.x + w.w/2 + radius;
            let minZ = w.z - w.d/2 - radius;
            let maxZ = w.z + w.d/2 + radius;

            if (px >= minX && px <= maxX && pz >= minZ && pz <= maxZ) {
              if (topY > highestY) {
                highestY = topY;
              }
            }
          }
        }
        return highestY;
      }

      function startZombieGame() {

      function startZombieMultiGameClient(room) {
        currentWave = 0; totalKills = 0; player.hp = 100; player.shield = 100;
        playerSlots = [saveData.equipped]; currentSlotIndex = 0;
        let currentW = weaponStats[saveData.equipped];
        player.maxAmmo = currentW.maxAmmo; player.ammo = player.maxAmmo; player.isReloading = false;

        let myIdx = room.players.findIndex(p => p.id === socket.id);
        let spawnOffsets = [{x:0, z:0}, {x:3, z:3}, {x:-3, z:3}, {x:3, z:-3}];
        let sp = spawnOffsets[myIdx % spawnOffsets.length];

        playerPhys.x = sp.x; playerPhys.y = 0; playerPhys.z = sp.z; playerPhys.vy = 0;
        playerPhys.isSkyDiving = false; playerPhys.isGliding = false;
        playerModel.gliderMesh.visible = false;
        playerModel.mesh.position.set(sp.x, 0, sp.z);
        playerModel.mesh.visible = !isFirstPerson;
        playerModel.equipWeaponVisual(saveData.equipped, currentW.color);

        enemies.forEach(e => scene.remove(e.mesh)); enemies = [];
        playerBullets.forEach(b => scene.remove(b.mesh)); playerBullets = [];

        menuOverlay.style.display = 'none'; hud.style.display = 'block'; crosshair.style.display = 'block'; viewIndicator.style.display='block';
        gameState = 'PLAYING'; renderer.domElement.requestPointerLock();

        if (isZombieHost) {
          startNextZombieWave();
        }

      function startNextZombieWave() {
        currentWave++;
        showCentralMessage(`WAVE ${currentWave}`, "#ff3b30", 2500);

        if (zombieSubMode === 'SOLO' || isZombieHost) {
          let numZombies = 8 + currentWave * 4;
          for (let i = 0; i < numZombies; i++) {
            let angle = Math.random() * Math.PI * 2;
            let dist = 30 + Math.random() * 20;
            let zx = Math.cos(angle) * dist;
            let zz = Math.sin(angle) * dist;

            let m = createRobloxModel(0x2d6a4f, true, true);
            m.mesh.position.set(zx, 0, zz);
            scene.add(m.mesh);

            // ゾンビの体力を大幅増量（以前は弱すぎたのを修正）
            let zombieHp = 60 + currentWave * 30;
            enemies.push({
              id: 'zombie_' + Math.random(), name: 'Zombie', model: m, mesh: m.mesh, radius: 1.0,
              hp: zombieHp, maxHp: zombieHp, shield: 0, maxShield: 0, speed: 0.08 + Math.random() * 0.04,
              isRival: false, isOnline: false, isZombie: true, animTime: Math.random() * 10
            });
          }
        }
        updateHUD();
      }

        gameState = 'ZOMBIE_MENU';
        let weaponHtml = '';
        for (let key in weaponStats) {

          let btnStyle = `padding:8px 12px; font-weight:bold; border-radius:4px; border:none; cursor:pointer; margin-top:10px; width:100%; transition:0.2s;`;
          let btnHtml = isEquipped ? `<button style="${btnStyle} background:#00f5d4; color:#050510;">Equipped</button>` : (isUnlocked ? `<button id="equip-${key}" style="${btnStyle} background:#3a3f58; color:#fff;">Equip</button>` : `<button id="buy-${key}" style="${btnStyle} background:#ffd700; color:#050510;">🔓 ${w.cost}C Buy</button>`);
          weaponHtml += `<div style="background:rgba(255,255,255,0.04); padding:12px; border-radius:8px; width:210px; display:flex; flex-direction:column; justify-content:space-between; border:1px solid rgba(255,255,255,0.06);"><div><div style="font-size:15px; font-weight:bold; color:#00f5d4;">${w.name}</div></div>${btnHtml}</div>`;
        }
        
        menuOverlay.innerHTML = `
          <h1 style="font-size:36px;color:#ff3b30;margin:10px 0 5px;font-family:'Permanent Marker', cursive;">🧟 ZOMBIE SURVIVAL SHOP</h1>

        `;

        for (let key in weaponStats) {
          let buyBtn = document.getElementById(`buy-${key}`);
          let equipBtn = document.getElementById(`equip-${key}`);
          if (buyBtn) {
            buyBtn.addEventListener('click', () => {
              if (saveData.coins >= weaponStats[key].cost) {
                saveData.coins -= weaponStats[key].cost;
                saveData.unlocked[key] = true;
                saveData.equipped = key;
                save();
                showZombieWeaponMenu();
              } else {
                alert("Coinsが足りません！");

          if (equipBtn) {
            equipBtn.addEventListener('click', () => {
              saveData.equipped = key;
              save();
              showZombieWeaponMenu();

        document.getElementById('back-to-zombie-submenu').addEventListener('click', () => {
          showZombieSubMenu();

      function updateHUD() {
        if (gameState !== 'PLAYING') {
          hud.style.display = 'none'; crosshair.style.display = 'none'; viewIndicator.style.display = 'none';

        let shieldPercent = Math.max(0, (player.shield / player.maxShield) * 100);

            <div style="width:100%; height:16px; background:rgba(255,255,255,0.1); border-radius:8px; overflow:hidden;">
              <div style="width:${hpPercent}%; height:100%; background:#39ff14; transition:width 0.15s ease;"></div>
            </div>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
              <div style="font-size:18px; color:#00f5d4;">${currentW.name}</div>
              <div style="font-size:13px; color:#aaa;">AMMO: ${player.ammo} / ${player.maxAmmo}${reloadText}</div>
            </div>
            <div style="text-align:right;">
              ${selectedMode === 'ZOMBIE' ? `<div style="font-size:16px; color:#ff3b30;">WAVE ${currentWave}</div><div style="font-size:12px; color:#aaa;">KILLS: ${totalKills}</div>` : ''}
              ${selectedMode === '1V1' ? `<div style="font-size:16px; color:#ffd700;">SCORE: ${playerWins} - ${rivalWins}</div>` : ''}
            </div>
          </div>
        `;
      }

      /* 入力リスナー & ポインターロック設定 */
      let keys = {};
      window.addEventListener('keydown', (e) => {
        keys[e.code] = true;
        if (gameState === 'PLAYING') {
          if (e.code === 'Digit1') switchWeaponSlot(0);
          if (e.code === 'Digit2') switchWeaponSlot(1);
          if (e.code === 'Digit3') switchWeaponSlot(2);
          if (e.code === 'Digit4') switchWeaponSlot(3);
          if (e.code === 'Digit5') switchWeaponSlot(4);

          if (e.code === saveData.keyMap.switchView) {
            isFirstPerson = !isFirstPerson;
            playerModel.mesh.visible = !isFirstPerson;
            updateHUD();
          }

          if (e.code === saveData.keyMap.reload && !player.isReloading && player.ammo < player.maxAmmo) {
            player.isReloading = true;
            player.reloadTimer = weaponStats[saveData.equipped].reloadTime;
          }

          if (e.code === saveData.keyMap.interact && selectedMode === 'BR') {
            chests.forEach(c => {
              if (!c.opened) {
                let dist = Math.hypot(playerPhys.x - c.x, playerPhys.z - c.z);
                if (dist < 3.5 && Math.abs(playerPhys.y - c.y) < 3.0) {
                  c.opened = true;
                  scene.remove(c.mesh);
                  showCentralMessage("宝箱を獲得！", "#ffd700", 1500);
                  let available = Object.keys(weaponStats).filter(k => !playerSlots.includes(k));
                  if (available.length > 0) {
                    let randW = available[Math.floor(Math.random() * available.length)];
                    addWeaponToInventory(randW);
                  }
                }
              }
            });
          }
        }
      });

      function addWeaponToInventory(weaponKey) {
        if (selectedMode === '1V1') return;
        if (!playerSlots.includes(weaponKey)) {
          if (playerSlots.length < 5) {
            playerSlots.push(weaponKey);
            switchWeaponSlot(playerSlots.length - 1);
          } else {
            playerSlots[currentSlotIndex] = weaponKey;
            switchWeaponSlot(currentSlotIndex);
          }
        } else {
          let existingIdx = playerSlots.indexOf(weaponKey);
          switchWeaponSlot(existingIdx);
        }
      }

      window.addEventListener('keyup', (e) => { keys[e.code] = false; });

      window.addEventListener('mousedown', (e) => {
        if (gameState === 'PLAYING') {
          if (document.pointerLockElement !== renderer.domElement) {
            renderer.domElement.requestPointerLock();
          }
          if (e.button === 0) isMouseDown = true;
          if (e.button === 2) isAiming = true; // 右クリックでエイム(ADS)
        }
      });

      window.addEventListener('mouseup', (e) => {
        if (e.button === 0) isMouseDown = false;
        if (e.button === 2) isAiming = false;
      });

      window.addEventListener('contextmenu', e => e.preventDefault());

      window.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement === renderer.domElement && gameState === 'PLAYING') {
          let sens = isAiming ? 0.0012 : 0.0022;
          yaw -= e.movementX * sens;
          pitch -= e.movementY * sens;
          pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
        }
      });

      /* ダメージ処理関数（シールド優先減算） */
      function applyDamageToTarget(target, dmg, isHeadshot) {
        let finalDmg = dmg * (isHeadshot ? 2.0 : 1.0);
        if (target.shield > 0) {
          if (target.shield >= finalDmg) {
            target.shield -= finalDmg;
          } else {
            let overflow = finalDmg - target.shield;
            target.shield = 0;
            target.hp = Math.max(0, target.hp - overflow);
          }
        } else {
          target.hp = Math.max(0, target.hp - finalDmg);
        }
        return finalDmg;
      }

      function shootWeapon() {
        if (player.isReloading || player.ammo <= 0) return;
        let w = weaponStats[saveData.equipped];
        player.ammo--;
        player.shootCooldownTimer = w.shootInterval;

        let spawnPos = camera.position.clone().add(camera.getWorldDirection(new THREE.Vector3()).multiplyScalar(1.2));
        let dir = new THREE.Vector3();
        
        // 照準(クロスヘア)方向へレイキャスト射撃
        let raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
        let intersects = raycaster.intersectObjects(stageProps, true);
        if (intersects.length > 0) {
          dir.subVectors(intersects[0].point, spawnPos).normalize();
        } else {
          dir = raycaster.ray.direction.clone();
        }

        let bGeo = new THREE.SphereGeometry(w.size, 8, 8);
        let bMat = new THREE.MeshBasicMaterial({ color: w.color });
        let mesh = new THREE.Mesh(bGeo, bMat);
        mesh.position.copy(spawnPos);
        scene.add(mesh);

        playerBullets.push({
          mesh: mesh, dir: dir, speed: w.speed, dmg: w.dmg, isPierce: w.isPierce || false, age: 0, maxAge: 120
        });

        updateHUD();
      }

      /* ゲームループ & アニメーション */
      let clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        let dt = Math.min(clock.getDelta(), 0.1);

        if (gameState === 'PLAYING') {
          // リロードと射撃タイマー
          if (player.isReloading) {
            player.reloadTimer--;
            if (player.reloadTimer <= 0) {
              player.isReloading = false;
              player.ammo = player.maxAmmo;
              updateHUD();
            }
          }
          if (player.shootCooldownTimer > 0) player.shootCooldownTimer--;
          if (isMouseDown && player.shootCooldownTimer <= 0 && !player.isReloading) {
            shootWeapon();
          }

          // プレイヤー移動処理
          let moveSpeed = (keys[saveData.keyMap.dash] ? 12 : 7.5) * dt;
          let moveX = 0, moveZ = 0;
          if (keys[saveData.keyMap.forward]) moveZ -= 1;
          if (keys[saveData.keyMap.backward]) moveZ += 1;
          if (keys[saveData.keyMap.left]) moveX -= 1;
          if (keys[saveData.keyMap.right]) moveX += 1;

          let isMoving = moveX !== 0 || moveZ !== 0;

          if (isMoving) {
            let moveVector = new THREE.Vector3(moveX, 0, moveZ).normalize();
            let rotMatrix = new THREE.Matrix4().makeRotationY(yaw);
            moveVector.applyMatrix4(rotMatrix);

            // 水平移動衝突チェック (X軸・Z軸分離)
            let nextX = playerPhys.x + moveVector.x * moveSpeed;
            if (!checkWallCollision(nextX, playerPhys.z, playerPhys.radius, playerPhys.y)) {
              playerPhys.x = nextX;
            }
            let nextZ = playerPhys.z + moveVector.z * moveSpeed;
            if (!checkWallCollision(playerPhys.x, nextZ, playerPhys.radius, playerPhys.y)) {
              playerPhys.z = nextZ;
            }
          }

          // 物理・着地・跳躍・貫通防止処理
          let highestGroundY = getHighestGroundY(playerPhys.x, playerPhys.z, playerPhys.y, playerPhys.radius);

          if (playerPhys.isSkyDiving) {
            gliderPrompt.style.display = 'block';
            if (keys[saveData.keyMap.jump] && !playerPhys.isGliding) {
              playerPhys.isGliding = true;
              playerModel.gliderMesh.visible = true;
            }
            playerPhys.vy = playerPhys.isGliding ? -8 : -35;
            playerPhys.y += playerPhys.vy * dt;

            if (playerPhys.y <= highestGroundY) {
              playerPhys.y = highestGroundY;
              playerPhys.vy = 0;
              playerPhys.isSkyDiving = false;
              playerPhys.isGliding = false;
              playerPhys.isGrounded = true;
              playerModel.gliderMesh.visible = false;
              gliderPrompt.style.display = 'none';
            }
          } else {
            gliderPrompt.style.display = 'none';
            if (keys[saveData.keyMap.jump] && playerPhys.isGrounded) {
              playerPhys.vy = 9.5;
              playerPhys.isGrounded = false;
            }

            playerPhys.vy -= 24 * dt; // 重力
            playerPhys.y += playerPhys.vy * dt;

            if (playerPhys.y <= highestGroundY) {
              playerPhys.y = highestGroundY;
              playerPhys.vy = 0;
              playerPhys.isGrounded = true;
            } else {
              playerPhys.isGrounded = false;
            }
          }

          playerModel.mesh.position.set(playerPhys.x, playerPhys.y, playerPhys.z);
          playerModel.mesh.rotation.y = yaw;

          // プレイヤー歩行アニメーション
          if (isMoving && playerPhys.isGrounded) {
            let animTime = Date.now() * 0.012;
            let swing = Math.sin(animTime) * 0.6;
            playerModel.leftLeg.rotation.x = swing;
            playerModel.rightLeg.rotation.x = -swing;
            playerModel.leftArmGroup.rotation.x = -swing;
          } else {
            playerModel.leftLeg.rotation.x = 0;
            playerModel.rightLeg.rotation.x = 0;
            playerModel.leftArmGroup.rotation.x = 0;
          }

          // フォートナイト風 サードパーソンカメラ計算
          let cameraRotMatrix = new THREE.Matrix4();
          cameraRotMatrix.makeRotationFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));

          targetFov = isAiming ? 45 : 70;
          camera.fov += (targetFov - camera.fov) * 0.2;
          camera.updateProjectionMatrix();

          let shoulderOffset = isAiming ? new THREE.Vector3(1.0, 1.5, 2.8) : new THREE.Vector3(1.5, 1.8, 5.5);
          shoulderOffset.applyMatrix4(cameraRotMatrix);
          
          let headPos = new THREE.Vector3(playerPhys.x, playerPhys.y + 1.8, playerPhys.z);
          camera.position.copy(headPos).add(shoulderOffset);

          let lookTarget = headPos.clone().add(new THREE.Vector3(0, 0, -10).applyMatrix4(cameraRotMatrix));
          camera.lookAt(lookTarget);

          // 弾丸アニメーション & 判定
          for (let i = playerBullets.length - 1; i >= 0; i--) {
            let b = playerBullets[i];
            b.mesh.position.addScaledVector(b.dir, b.speed);
            b.age++;

            let hit = false;
            // 敵への当たり判定
            for (let j = enemies.length - 1; j >= 0; j--) {
              let e = enemies[j];
              let eHeadPos = e.mesh.position.clone().add(new THREE.Vector3(0, 2.4, 0));
              let eBodyPos = e.mesh.position.clone().add(new THREE.Vector3(0, 1.2, 0));

              let isHead = b.mesh.position.distanceTo(eHeadPos) < 0.7;
              let isBody = b.mesh.position.distanceTo(eBodyPos) < 1.1;

              if (isHead || isBody) {
                hit = true;
                let actualDmg = applyDamageToTarget(e, b.dmg, isHead);
                createFortniteDamageText(actualDmg, e.mesh.position.clone().add(new THREE.Vector3(0, 2, 0)), isHead);

                if (e.hp <= 0) {
                  scene.remove(e.mesh);
                  enemies.splice(j, 1);
                  totalKills++;
                  saveData.coins += 25;
                  save();

                  if (selectedMode === 'ZOMBIE' && enemies.length === 0) {
                    setTimeout(() => startNextZombieWave(), 2000);
                  }
                  if (selectedMode === '1V1' && !isRoundEnding) {
                    isRoundEnding = true;
                    playerWins++;
                    showCentralMessage("ROUND WIN!", "#39ff14", 2000);
                    setTimeout(() => {
                      duelRound++;
                      if (playerWins >= 3) {
                        showCentralMessage("VICTORY!", "#ffd700", 3000);
                        setTimeout(() => showModeSelectMenu(), 3000);
                      } else {
                        reset1v1Round();
                      }
                    }, 2000);
                  }
                }
                break;
              }
            }

            if (hit || b.age >= b.maxAge) {
              scene.remove(b.mesh);
              playerBullets.splice(i, 1);
            }
          }

          // ゾンビ同士の重なり防止（物理押し出し判定）
          for (let i = 0; i < enemies.length; i++) {
            for (let j = i + 1; j < enemies.length; j++) {
              let e1 = enemies[i];
              let e2 = enemies[j];
              let dx = e2.mesh.position.x - e1.mesh.position.x;
              let dz = e2.mesh.position.z - e1.mesh.position.z;
              let dist = Math.hypot(dx, dz);
              let minDist = (e1.radius || 1.0) + (e2.radius || 1.0);
              
              if (dist < minDist && dist > 0.0001) {
                let overlap = (minDist - dist) * 0.5;
                let nx = dx / dist;
                let nz = dz / dist;
                e1.mesh.position.x -= nx * overlap;
                e1.mesh.position.z -= nz * overlap;
                e2.mesh.position.x += nx * overlap;
                e2.mesh.position.z += nz * overlap;
              }
            }
          }

          // 敵のAI動作・歩行アニメーション
          enemies.forEach(e => {
            if (e.isZombie || !e.isOnline) {
              let dx = playerPhys.x - e.mesh.position.x;
              let dz = playerPhys.z - e.mesh.position.z;
              let dist = Math.hypot(dx, dz);

              if (dist > 1.2) {
                let moveX = (dx / dist) * e.speed;
                let moveZ = (dz / dist) * e.speed;

                if (!checkWallCollision(e.mesh.position.x + moveX, e.mesh.position.z, e.radius, e.mesh.position.y)) {
                  e.mesh.position.x += moveX;
                }
                if (!checkWallCollision(e.mesh.position.x, e.mesh.position.z + moveZ, e.radius, e.mesh.position.y)) {
                  e.mesh.position.z += moveZ;
                }
                e.mesh.rotation.y = Math.atan2(dx, dz);

                // ゾンビの歩行アニメーション
                e.animTime = (e.animTime || 0) + dt * 10;
                let swing = Math.sin(e.animTime) * 0.6;
                e.model.leftLeg.rotation.x = swing;
                e.model.rightLeg.rotation.x = -swing;
                if (e.isZombie) {
                  e.model.leftArmGroup.rotation.x = Math.PI * 0.4 + swing * 0.2;
                  e.model.rightArmGroup.rotation.x = Math.PI * 0.4 - swing * 0.2;
                } else {
                  e.model.leftArmGroup.rotation.x = -swing;
                }
              } else if (dist <= 1.5 && e.isZombie) {
                // ゾンビの近接攻撃
                meleeDamageTimer += dt;
                if (meleeDamageTimer > 0.8) {
                  meleeDamageTimer = 0;
                  player.hp -= 15;
                  triggerDamageFlash();
                  updateHUD();
                  if (player.hp <= 0) {
                    showCentralMessage("GAME OVER", "#ff3b30", 3000);
                    setTimeout(() => showModeSelectMenu(), 3000);
                  }
                }
              }
            }
          });

          // 宝箱表示更新
          if (selectedMode === 'BR') {
            let nearChest = false;
            chests.forEach(c => {
              if (!c.opened) {
                let dist = Math.hypot(playerPhys.x - c.x, playerPhys.z - c.z);
                if (dist < 3.5 && Math.abs(playerPhys.y - c.y) < 3.0) nearChest = true;
              }
            });
            lootPrompt.style.display = nearChest ? 'block' : 'none';
          } else {
            lootPrompt.style.display = 'none';
          }

          // オンライン位置同期送信
          if (currentRoomId) {
            socket.emit('player_movement', {
              roomId: currentRoomId,
              x: playerPhys.x, y: playerPhys.y, z: playerPhys.z,
              yaw: yaw, pitch: pitch, hp: player.hp, shield: player.shield
            });
          }

          updateDamageTexts(dt);
        }

        renderer.render(scene, camera);
      }

      showNameInputMenu();
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    })();
  </script>
</body>
</html>
