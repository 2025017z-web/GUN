<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D FPS - Multi Mode</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; user-select: none; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; border: 2px solid rgba(255,255,255,0.8); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; }
        #hud { position: absolute; top: 20px; left: 20px; color: #fff; font-size: 18px; font-weight: bold; text-shadow: 2px 2px 4px #000; z-index: 10; pointer-events: none; }
        #menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; z-index: 20; }
        button { padding: 12px 28px; margin: 10px; font-size: 18px; font-weight: bold; cursor: pointer; background: #222; color: #fff; border: 2px solid #555; border-radius: 6px; transition: 0.2s; }
        button:hover { background: #444; border-color: #888; }
        #status-msg { margin-top: 15px; color: #ffcc00; font-size: 16px; }
    </style>
</head>
<body>
    <div id="crosshair"></div>
    <div id="hud">
        HP: <span id="hp-val">100</span> | 
        Weapon: <span id="weapon-val">Pistol</span> | 
        Score: <span id="score-val">0 - 0</span> | 
        <span id="mode-info">Wave 1</span>
    </div>

    <div id="menu">
        <h1>3D FPS SHOWDOWN</h1>
        <button onclick="startGame('zombie')">ZOMBIE SURVIVAL</button>
        <button onclick="startGame('1v1')">ONLINE 1v1 DUEL</button>
        <div id="status-msg"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        let scene, camera, renderer, socket;
        let gameMode = null; // 'zombie' or '1v1'
        let isGameActive = false;

        // プレイヤー変数
        let player = {
            hp: 100,
            score: 0,
            pos: new THREE.Vector3(0, 1.6, 0),
            rot: { x: 0, y: 0 },
            speed: 0.12,
            isDead: false
        };

        // 1v1 相手プレイヤー
        let opponent = {
            id: null,
            mesh: null,
            hp: 100,
            isDead: false,
            score: 0,
            targetPos: new THREE.Vector3(0, 1.6, 0)
        };

        // ゾンビ & マップ構造物
        let zombies = [];
        let wallBoxes = [];
        let keys = {};
        let mouseLook = { x: 0, y: 0 };
        let lastShotTime = 0;

        // 武器設定
        const WEAPONS = {
            pistol: { name: 'Pistol', damage: 25, fireRate: 300, pellets: 1, spread: 0.02 },
            shotgun: { name: 'Shotgun', damage: 15, fireRate: 800, pellets: 8, spread: 0.1 }
        };
        let currentWeapon = WEAPONS.shotgun;

        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111115);
            scene.fog = new THREE.FogExp2(0x111115, 0.03);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // 照明
            const ambient = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambient);

            const sun = new THREE.DirectionalLight(0xffffff, 0.8);
            sun.position.set(10, 20, 10);
            sun.castShadow = true;
            scene.add(sun);

            createMap();
            setupControls();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // マップ作成（外壁＋内壁）
        function createMap() {
            const floorGeo = new THREE.PlaneGeometry(50, 50);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x222225 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            wallBoxes = [];
            
            // 外壁作成
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x444455 });
            const addWall = (w, h, d, x, y, z) => {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
                mesh.position.set(x, y, z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);
                wallBoxes.push(new THREE.Box3().setFromObject(mesh));
            };

            addWall(50, 6, 2, 0, 3, -25);
            addWall(50, 6, 2, 0, 3, 25);
            addWall(2, 6, 50, -25, 3, 0);
            addWall(2, 6, 50, 25, 3, 0);

            // 障害物
            addWall(8, 4, 2, -8, 2, -5);
            addWall(8, 4, 2, 8, 2, 5);
        }

        // 操作設定
        function setupControls() {
            document.addEventListener('keydown', (e) => keys[e.code] = true);
            document.addEventListener('keyup', (e) => keys[e.code] = false);

            document.addEventListener('click', () => {
                if (isGameActive && document.pointerLockElement !== document.body) {
                    document.body.requestPointerLock();
                } else if (isGameActive) {
                    shoot();
                }
            });

            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === document.body) {
                    player.rot.y -= e.movementX * 0.002;
                    player.rot.x -= e.movementY * 0.002;
                    player.rot.x = Math.max(-Math.PI/2.5, Math.min(Math.PI/2.5, player.rot.x));
                }
            });
        }

        // ゾンビ安全スポーン（壁埋まりバグ防止）
        function getSafeZombieSpawnPos() {
            let pos = new THREE.Vector3();
            let valid = false;
            let attempts = 0;

            while (!valid && attempts < 50) {
                attempts++;
                const angle = Math.random() * Math.PI * 2;
                const dist = 10 + Math.random() * 12;
                const x = Math.max(-21, Math.min(21, player.pos.x + Math.cos(angle) * dist));
                const z = Math.max(-21, Math.min(21, player.pos.z + Math.sin(angle) * dist));

                // ゾンビの衝突判定判定用Box
                const zombieTestBox = new THREE.Box3(
                    new THREE.Vector3(x - 0.8, 0, z - 0.8),
                    new THREE.Vector3(x + 0.8, 2, z + 0.8)
                );

                let hitsWall = false;
                for (let wallBox of wallBoxes) {
                    if (wallBox.intersectsBox(zombieTestBox)) {
                        hitsWall = true;
                        break;
                    }
                }

                if (!hitsWall) {
                    pos.set(x, 0, z);
                    valid = true;
                }
            }
            if (!valid) pos.set(0, 0, -15);
            return pos;
        }

        function spawnZombie() {
            const pos = getSafeZombieSpawnPos();
            const geo = new THREE.BoxGeometry(1, 2, 1);
            const mat = new THREE.MeshStandardMaterial({ color: 0x2e8b57 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(pos);
            mesh.position.y = 1;
            mesh.castShadow = true;
            scene.add(mesh);

            zombies.push({ mesh: mesh, hp: 50 });
        }

        function initSocket() {
            if (socket) return;
            socket = io();

            socket.on('waiting_for_match', () => {
                document.getElementById('status-msg').innerText = "対戦相手を探しています...";
            });

            socket.on('match_found', (data) => {
                document.getElementById('status-msg').innerText = "対戦相手が見つかりました！";
                document.getElementById('menu').style.display = 'none';
                isGameActive = true;

                // 相手プレイヤーのメッシュ作成
                const geo = new THREE.CapsuleGeometry(0.5, 1, 4, 8);
                const mat = new THREE.MeshStandardMaterial({ color: 0xff3333 });
                opponent.mesh = new THREE.Mesh(geo, mat);
                scene.add(opponent.mesh);

                for (let id in data.players) {
                    if (id !== socket.id) {
                        opponent.id = id;
                        opponent.mesh.position.copy(data.players[id].pos);
                    } else {
                        player.pos.copy(data.players[id].pos);
                    }
                }
                document.body.requestPointerLock();
            });

            socket.on('opponent_update', (data) => {
                if (opponent.mesh) {
                    opponent.targetPos.copy(data.pos);
                    opponent.mesh.rotation.y = data.rot.y;
                }
            });

            socket.on('hp_update', (data) => {
                if (data.playerId === socket.id) {
                    player.hp = data.hp;
                    document.getElementById('hp-val').innerText = player.hp;
                }
            });

            socket.on('player_killed', (data) => {
                const scores = data.scores;
                const myScore = scores[socket.id] || 0;
                const oppScore = scores[opponent.id] || 0;
                document.getElementById('score-val').innerText = `${myScore} - ${oppScore}`;

                if (data.victimId === socket.id) {
                    player.isDead = true;
                    document.getElementById('status-msg').innerText = "倒されました！リスポーン中...";
                } else {
                    document.getElementById('status-msg').innerText = "相手を倒しました！";
                }
            });

            socket.on('player_respawn', (data) => {
                if (data.playerId === socket.id) {
                    player.hp = 100;
                    player.isDead = false;
                    player.pos.copy(data.pos);
                    document.getElementById('hp-val').innerText = 100;
                    document.getElementById('status-msg').innerText = "";
                } else if (data.playerId === opponent.id) {
                    opponent.isDead = false;
                }
            });
        }

        function startGame(mode) {
            gameMode = mode;
            if (!scene) initScene();

            if (mode === 'zombie') {
                document.getElementById('menu').style.display = 'none';
                isGameActive = true;
                document.body.requestPointerLock();
                for (let i = 0; i < 5; i++) spawnZombie();
            } else if (mode === '1v1') {
                initSocket();
                socket.emit('join_game');
            }
        }

        // 射撃処理（強武器多重ヒットバグ制御付き）
        function shoot() {
            const now = Date.now();
            if (now - lastShotTime < currentWeapon.fireRate || player.isDead) return;
            lastShotTime = now;

            let hitRegistered = false; // 1回の射撃で撃破が重複カウントされるのを防ぐローカルフラグ

            for (let i = 0; i < currentWeapon.pellets; i++) {
                const raycaster = new THREE.Raycaster();
                const spreadDir = camera.getWorldDirection(new THREE.Vector3());
                spreadDir.x += (Math.random() - 0.5) * currentWeapon.spread;
                spreadDir.y += (Math.random() - 0.5) * currentWeapon.spread;
                spreadDir.z += (Math.random() - 0.5) * currentWeapon.spread;
                spreadDir.normalize();

                raycaster.set(camera.position, spreadDir);

                if (gameMode === 'zombie') {
                    const zombieMeshes = zombies.map(z => z.mesh);
                    const intersects = raycaster.intersectObjects(zombieMeshes);
                    if (intersects.length > 0) {
                        const hitMesh = intersects[0].object;
                        const z = zombies.find(item => item.mesh === hitMesh);
                        if (z) {
                            z.hp -= currentWeapon.damage;
                            if (z.hp <= 0) {
                                scene.remove(z.mesh);
                                zombies = zombies.filter(item => item !== z);
                                player.score += 100;
                                document.getElementById('score-val').innerText = player.score;
                                setTimeout(spawnZombie, 1500);
                            }
                        }
                    }
                } else if (gameMode === '1v1' && opponent.mesh && !opponent.isDead) {
                    const intersects = raycaster.intersectObject(opponent.mesh);
                    if (intersects.length > 0 && !hitRegistered) {
                        // 重複数値送信を遮断
                        socket.emit('deal_damage', {
                            targetId: opponent.id,
                            damage: currentWeapon.damage
                        });
                        hitRegistered = true; // この1発のトリガー内では判定完了
                    }
                }
            }
        }

        // メインフレーム更新
        function animate() {
            requestAnimationFrame(animate);
            if (!isGameActive) return;

            // プレイヤー移動処理
            if (!player.isDead) {
                const moveVec = new THREE.Vector3();
                if (keys['KeyW']) moveVec.z -= 1;
                if (keys['KeyS']) moveVec.z += 1;
                if (keys['KeyA']) moveVec.x -= 1;
                if (keys['KeyD']) moveVec.x += 1;
                moveVec.normalize();

                const euler = new THREE.Euler(0, player.rot.y, 0, 'YXZ');
                moveVec.applyEuler(euler);

                player.pos.x = Math.max(-23, Math.min(23, player.pos.x + moveVec.x * player.speed));
                player.pos.z = Math.max(-23, Math.min(23, player.pos.z + moveVec.z * player.speed));

                camera.position.copy(player.pos);
                camera.rotation.set(player.rot.x, player.rot.y, 0, 'YXZ');

                if (socket && gameMode === '1v1') {
                    socket.emit('player_update', { pos: player.pos, rot: player.rot });
                }
            }

            // 相手プレイヤーの補間移動 (Lerp)
            if (opponent.mesh) {
                opponent.mesh.position.lerp(opponent.targetPos, 0.2);
            }

            // ゾンビの移動と重なり防止ロジック
            if (gameMode === 'zombie') {
                // 1. ゾンビ同士の押し合い物理（重なって1匹に見える現象を解消）
                for (let i = 0; i < zombies.length; i++) {
                    for (let j = i + 1; j < zombies.length; j++) {
                        const z1 = zombies[i].mesh;
                        const z2 = zombies[j].mesh;
                        const dx = z1.position.x - z2.position.x;
                        const dz = z1.position.z - z2.position.z;
                        const distSq = dx * dx + dz * dz;
                        const minDist = 1.3; // ゾンビ間の最小間隔

                        if (distSq < minDist * minDist && distSq > 0) {
                            const dist = Math.sqrt(distSq);
                            const overlap = (minDist - dist) / 2;
                            const pushX = (dx / dist) * overlap;
                            const pushZ = (dz / dist) * overlap;

                            z1.position.x += pushX;
                            z1.position.z += pushZ;
                            z2.position.x -= pushX;
                            z2.position.z -= pushZ;
                        }
                    }
                }

                // 2. プレイヤーへの追尾
                zombies.forEach(z => {
                    const dir = new THREE.Vector3().subVectors(player.pos, z.mesh.position);
                    dir.y = 0;
                    dir.normalize();
                    z.mesh.position.addScaledVector(dir, 0.04);
                    z.mesh.lookAt(player.pos.x, 1, player.pos.z);
                });
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
