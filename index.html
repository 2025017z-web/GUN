    /* オンライン＆チャットサイドバー UI */

    #social-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 6px; }
    #social-header-title { font-weight: bold; font-size: 14px; color: #00f5d4; }
    #social-collapse-btn { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: #fff; border-radius: 4px; padding: 2px 8px; cursor: pointer; font-size: 12px; }

    #voice-controls { display: flex; gap: 8px; margin-bottom: 12px; }
    .social-btn { flex: 1; padding: 8px; background: #00a8ff; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; }
    .social-btn.active { background: #ff3b30; }
    .social-btn:disabled { background: #555; cursor: not-allowed; }
    
    #user-list-title { font-size: 14px; font-weight: bold; color: #ffd700; margin-bottom: 6px; }
    #user-list { flex: 0.8; overflow-y: auto; background: rgba(0,0,0,0.3); border-radius: 6px; padding: 6px; margin-bottom: 10px; font-size: 13px; }
    .user-item { padding: 4px 8px; margin-bottom: 4px; background: rgba(255,255,255,0.05); border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }

    #chat-title { font-size: 14px; font-weight: bold; color: #00f5d4; margin-bottom: 6px; }
    #chat-box { flex: 1.2; overflow-y: auto; background: rgba(0,0,0,0.3); border-radius: 6px; padding: 6px; margin-bottom: 8px; font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
    .chat-msg { word-break: break-all; }
    .chat-sender { font-weight: bold; color: #00a8ff; }
    #chat-input-container { display: flex; gap: 6px; }
    #chat-input { flex: 1; background: #161b2e; border: 1px solid #333; color: #fff; padding: 6px 10px; border-radius: 4px; outline: none; font-size: 12px; }
    #chat-send-btn { background: #00f5d4; color: #000; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 12px; }
  </style>
</head>
<body>

  <div id="canvas-container"></div>
  <div id="loot-prompt">プレス [E] で宝箱を開ける</div>

  <script>
    (function() {
      let socket = io();
      let container = document.getElementById('canvas-container');
      let lootPrompt = document.getElementById('loot-prompt');
      let gliderPrompt = document.getElementById('glider-prompt');

      let damageOverlay = document.createElement('div');
      damageOverlay.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;box-shadow:inset 0 0 100px rgba(255,0,0,0);pointer-events:none;z-index:99999;transition:box-shadow 0.1s ease-out;';
      container.appendChild(damageOverlay);

      function triggerDamageFlash() {
        damageOverlay.style.transition = 'none';
        damageOverlay.style.boxShadow = 'inset 0 0 80px rgba(255, 0, 0, 0.8)';
        setTimeout(() => {
          damageOverlay.style.transition = 'box-shadow 0.4s ease-out';
          damageOverlay.style.boxShadow = 'inset 0 0 100px rgba(255,0,0,0)';
        }, 50);
      }

      let scene = new THREE.Scene();
      let camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1500);
      
      let renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      let playerPhys = { x: 0, y: 0, z: 0, radius: 1.2, vy: 0, isGrounded: true, isSkyDiving: false, isGliding: false };
      let cameraDist = 6.0; 
      let isAiming = false; 
      let isFirstPerson = false;

      let ambientLight = new THREE.AmbientLight(0xffffff, 0.6); 
      scene.add(ambientLight);

      let dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight.position.set(150, 250, 100);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      dirLight.shadow.camera.near = 0.5;
      dirLight.shadow.camera.far = 1000;
      let d = 400;
      dirLight.shadow.camera.left = -d; dirLight.shadow.camera.right = d;
      dirLight.shadow.camera.top = d; dirLight.shadow.camera.bottom = -d;
      scene.add(dirLight);

      const MAP_SIZE = 700;

      function getTerrainHeight(x, z) {
        if (selectedMode !== 'BR') return 0;
        if (Math.abs(x) > MAP_SIZE / 2 || Math.abs(z) > MAP_SIZE / 2) return 0;
        
        let townCenters = [
          { x: 0, z: 0, r: 90 }, { x: -200, z: -200, r: 80 }, { x: 200, z: 200, r: 80 },
          { x: -200, z: 200, r: 80 }, { x: 200, z: -200, r: 80 }, { x: 0, z: -250, r: 80 }, { x: 0, z: 250, r: 80 }
        ];

        for (let t of townCenters) {
          let dist = Math.hypot(x - t.x, z - t.z);
          if (dist < t.r) return 0;
          else if (dist < t.r + 30) {
            let rawY = Math.sin(x * 0.02) * Math.cos(z * 0.02) * 16.0 + Math.sin(x * 0.06) * 5.0;
            return rawY * ((dist - t.r) / 30);
          }
        }
        return Math.sin(x * 0.02) * Math.cos(z * 0.02) * 16.0 + Math.sin(x * 0.06) * 5.0;
      }

      function generateBrickTexture() {
        let cv = document.createElement('canvas'); cv.width = 256; cv.height = 256;
        let ctx = cv.getContext('2d'); ctx.fillStyle = '#8b3a2b'; ctx.fillRect(0,0,256,256);
        ctx.strokeStyle = '#5a2319'; ctx.lineWidth = 4;
        for(let y=0; y<256; y+=32) {
          ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(256,y); ctx.stroke();
          let offset = (y/32)%2 === 0 ? 0 : 32;
          for(let x=offset; x<256; x+=64) { ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+32); ctx.stroke(); }
        }
        return new THREE.CanvasTexture(cv);
      }

      function generateWoodTexture() {
        let cv = document.createElement('canvas'); cv.width = 256; cv.height = 256;
        let ctx = cv.getContext('2d'); ctx.fillStyle = '#a0522d'; ctx.fillRect(0,0,256,256);
        ctx.fillStyle = '#8b4513';
        for(let i=0; i<30; i++) ctx.fillRect(0, Math.random()*256, 256, Math.random()*4+1);
        return new THREE.CanvasTexture(cv);
      }

      function generateGrassTexture() {
        let cv = document.createElement('canvas'); cv.width = 512; cv.height = 512;
        let ctx = cv.getContext('2d'); ctx.fillStyle = '#2e8b57'; ctx.fillRect(0,0,512,512);
        for(let i=0; i<5000; i++) {
          ctx.fillStyle = Math.random() > 0.5 ? '#3cb371' : '#1e5631';
          ctx.fillRect(Math.random()*512, Math.random()*512, 2, 6);
        }
        return new THREE.CanvasTexture(cv);
      }

      let texBrick = generateBrickTexture(); texBrick.wrapS = THREE.RepeatWrapping; texBrick.wrapT = THREE.RepeatWrapping;
      let texWood = generateWoodTexture(); texWood.wrapS = THREE.RepeatWrapping; texWood.wrapT = THREE.RepeatWrapping;
      let texGrass = generateGrassTexture(); texGrass.wrapS = THREE.RepeatWrapping; texGrass.wrapT = THREE.RepeatWrapping; texGrass.repeat.set(80, 80);

      let saveData = {
        playerName: '',
        coins: 500, 
        unlocked: { laser: true, revolver: true, shotgun: true, flame: false, sniper: true, plasma: false, bow: false, blizzard: false, minigun: true, voidray: false },
        equipped: 'laser',
        keyMap: { forward: 'KeyW', left: 'KeyA', backward: 'KeyS', right: 'KeyD', jump: 'Space', reload: 'KeyR', switchView: 'KeyV', dash: 'KeyQ', interact: 'KeyE' }
      };
      
      let localSave = localStorage.getItem('fps_zombie_horizontal_v5');
      if (localSave) {
        try { 
          let parsed = JSON.parse(localSave);
          saveData = Object.assign(saveData, parsed);
          if (parsed.keyMap) saveData.keyMap = Object.assign(saveData.keyMap, parsed.keyMap);
        } catch(e){}
      }
      function save() { localStorage.setItem('fps_zombie_horizontal_v5', JSON.stringify(saveData)); }

      let weaponStats = {
        laser: { name: '⚡ 初期レーザー', cost: 0, maxAmmo: 30, dmg: 1.1, reloadTime: 60, color: 0x00ffff, size: 0.05, speed: 1.6, shootInterval: 12 },
        revolver: { name: '💥 ヘビーマグナム', cost: 150, maxAmmo: 6, dmg: 4.5, reloadTime: 80, color: 0xffaa00, size: 0.09, speed: 2.2, shootInterval: 35 },
        shotgun: { name: '🌊 三連ショットガン', cost: 300, maxAmmo: 10, dmg: 1.6, reloadTime: 90, color: 0xff00ff, size: 0.06, speed: 1.4, shootInterval: 42 },
        flame: { name: '🔥 焼夷レジスタンス', cost: 2500, maxAmmo: 180, dmg: 0.4, reloadTime: 100, color: 0xff4500, size: 0.35, speed: 0.75, shootInterval: 2 }, 
        sniper: { name: '🎯 スナイパーライフル', cost: 1000, maxAmmo: 5, dmg: 9, reloadTime: 120, color: 0xffffff, size: 0.04, speed: 4.5, shootInterval: 55 },
        plasma: { name: '🌀 プラズマランチャー', cost: 1500, maxAmmo: 8, dmg: 6.5, reloadTime: 130, color: 0x00ff55, size: 0.45, speed: 0.8, shootInterval: 48 },
        bow: { name: '🏹 デーモンクロスボウ', cost: 2000, maxAmmo: 12, dmg: 5.0, reloadTime: 70, color: 0xff0055, size: 0.08, speed: 1.1, shootInterval: 25, isPierce: true },
        blizzard: { name: '❄️ ブリザードカノン', cost: 3000, maxAmmo: 15, dmg: 0.5, reloadTime: 100, color: 0x88ccff, size: 0.5, speed: 0.9, shootInterval: 30 },
        minigun: { name: '⚡️ インフィニティミニガン', cost: 5000, maxAmmo: 500, dmg: 0.6, reloadTime: 200, color: 0xffff00, size: 0.04, speed: 2.0, shootInterval: 1 },
        voidray: { name: '🔮 ヴォイド・レイ', cost: 10000, maxAmmo: 60, dmg: 2.5, reloadTime: 80, color: 0x9900ff, size: 0.15, speed: 1.8, shootInterval: 6 }
      };

      let player = { hp: 100, maxHp: 100, shield: 100, maxShield: 100, ammo: 30, maxAmmo: 30, isReloading: false, reloadTimer: 0, shootCooldownTimer: 0 };
      let isMouseDown = false; 

      let gameState = 'NAME_INPUT'; 
      let selectedMode = 'BR'; 
      let duelSubMode = 'BOT';
      let currentRoomId = null;
      let isZombieHost = false;
      let onlineRole = null;
      let isRoundEnding = false;

      let currentWave = 0;
      let totalKills = 0;
      let meleeDamageTimer = 0; 
      let playerBullets = [];
      let enemies = [];
      let chests = [];
      let destructibles = [];

      let duelRound = 1;
      let playerWins = 0;
      let rivalWins = 0;
      let rival = null; 

      let currentGrid = null;
      let stageProps = [];
      let walls = [];
      let terrainMesh = null;

      // --- WEBRTC & ONLINE SOCIAL ---
      let onlineUsersList = [];
      let localStream = null;
      let peerConnections = {};
      let isVoiceActive = false;
      let isMuted = false;
      const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

      let socialPanel = document.getElementById('social-panel');
      let socialToggleOpen = document.getElementById('social-toggle-open');
      let socialCollapseBtn = document.getElementById('social-collapse-btn');

      socialCollapseBtn.addEventListener('click', () => {
        socialPanel.classList.add('collapsed');
        socialToggleOpen.style.display = 'block';
      });

      socialToggleOpen.addEventListener('click', () => {
        socialPanel.classList.remove('collapsed');
        socialToggleOpen.style.display = 'none';
      });

      let userListEl = document.getElementById('user-list');
      let userCountEl = document.getElementById('user-count');
      let chatBoxEl = document.getElementById('chat-box');
      let chatInputEl = document.getElementById('chat-input');
      let chatSendBtn = document.getElementById('chat-send-btn');
      let voiceToggleBtn = document.getElementById('voice-toggle-btn');
      let muteToggleBtn = document.getElementById('mute-toggle-btn');

      socket.on('online_users_update', (users) => {
        onlineUsersList = users;
        userCountEl.innerText = users.length;
        userListEl.innerHTML = '';
        users.forEach(u => {
          let div = document.createElement('div');
          div.className = 'user-item';
          div.innerHTML = `<span>👤 ${u.name}</span>${u.id === socket.id ? '<span style="color:#00f5d4;font-size:10px;">(YOU)</span>' : ''}`;
          userListEl.appendChild(div);
        });
      });

      chatSendBtn.addEventListener('click', sendChatMessage);
      chatInputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChatMessage(); });

      function sendChatMessage() {
        let msg = chatInputEl.value.trim();
        if (msg) {
          socket.emit('send_chat_msg', { msg: msg });
          chatInputEl.value = '';
        }
      }

      socket.on('receive_chat_msg', (data) => {
        let div = document.createElement('div');
        div.className = 'chat-msg';
        div.innerHTML = `<span class="chat-sender">${data.sender}:</span> ${data.msg}`;
        chatBoxEl.appendChild(div);
        chatBoxEl.scrollTop = chatBoxEl.scrollHeight;
      });

      // Voice Chat System
      voiceToggleBtn.addEventListener('click', async () => {
        if (!isVoiceActive) {
          try {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            isVoiceActive = true;
            voiceToggleBtn.innerText = "🛑 切断";
            voiceToggleBtn.classList.add('active');
            muteToggleBtn.disabled = false;

            onlineUsersList.forEach(u => {
              if (u.id !== socket.id) createPeerConnection(u.id, true);
            });
          } catch(err) {
            alert("マイクの接続に失敗しました。");
          }
        } else {
          stopVoiceChat();
        }
      });

      muteToggleBtn.addEventListener('click', () => {
        if (localStream) {
          isMuted = !isMuted;
          localStream.getAudioTracks()[0].enabled = !isMuted;
          muteToggleBtn.innerText = isMuted ? "🔊 解除" : "🔇 ミュート";
        }
      });

      function stopVoiceChat() {
        if (localStream) {
          localStream.getTracks().forEach(track => track.stop());
          localStream = null;
        }
        for (let id in peerConnections) {
          peerConnections[id].close();
        }
        peerConnections = {};
        isVoiceActive = false;
        voiceToggleBtn.innerText = "🎙️ ボイスON";
        voiceToggleBtn.classList.remove('active');
        muteToggleBtn.disabled = true;
      }

      function createPeerConnection(targetId, isInitiator) {
        if (peerConnections[targetId]) return peerConnections[targetId];

        let pc = new RTCPeerConnection(rtcConfig);
        peerConnections[targetId] = pc;

        if (localStream) {
          localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
        }

        pc.ontrack = (event) => {
          let audio = document.getElementById(`audio_${targetId}`);
          if (!audio) {
            audio = document.createElement('audio');
            audio.id = `audio_${targetId}`;
            audio.autoplay = true;
            document.body.appendChild(audio);
          }
          audio.srcObject = event.streams[0];
        };

        pc.onicecandidate = (event) => {
          if (event.candidate) {
            socket.emit('voice_candidate', { targetId, candidate: event.candidate });
          }
        };

        if (isInitiator) {
          pc.createOffer().then(offer => {
            pc.setLocalDescription(offer);
            socket.emit('voice_offer', { targetId, offer });
          });
        }

        return pc;
      }

      socket.on('voice_offer', async ({ senderId, offer }) => {
        if (!isVoiceActive) return;
        let pc = createPeerConnection(senderId, false);
        await pc.setRemoteDescription(new RTCSessionDescription(offer));
        let answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        socket.emit('voice_answer', { targetId: senderId, answer });
      });

      socket.on('voice_answer', async ({ senderId, answer }) => {
        let pc = peerConnections[senderId];
        if (pc) await pc.setRemoteDescription(new RTCSessionDescription(answer));
      });

      socket.on('voice_candidate', async ({ senderId, candidate }) => {
        let pc = peerConnections[senderId];
        if (pc) await pc.addIceCandidate(new RTCIceCandidate(candidate));
      });

      function createGliderMesh() {
        let gliderGroup = new THREE.Group();
        let wingGeo = new THREE.ConeGeometry(1.2, 0.8, 4);
        let wingMat = new THREE.MeshLambertMaterial({ color: 0xff0055, side: THREE.DoubleSide });
        let wing = new THREE.Mesh(wingGeo, wingMat);
        wing.rotation.x = Math.PI / 2;
        wing.scale.set(1.2, 0.15, 0.8);
        gliderGroup.add(wing);

        let barGeo = new THREE.CylinderGeometry(0.04, 0.04, 1.2);
        let barMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
        let bar = new THREE.Mesh(barGeo, barMat);
        bar.rotation.z = Math.PI / 2;
        bar.position.set(0, -0.4, 0.1);
        gliderGroup.add(bar);

        gliderGroup.position.set(0, 2.2, 0);
        gliderGroup.visible = false;
        return gliderGroup;
      }

      function buildGunMesh(weaponKey, colorHex) {
        let gunGroup = new THREE.Group();
        let mainMat = new THREE.MeshLambertMaterial({ color: 0x1f1f1f });
        let accentMat = new THREE.MeshLambertMaterial({ color: colorHex });
        let dBody = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.6), mainMat); dBody.position.set(0, 0.1, -0.2);
        let dBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.4), accentMat); dBarrel.rotation.x = Math.PI/2; dBarrel.position.set(0, 0.1, -0.5); dBody.add(dBarrel);
        gunGroup.add(dBody);
        return gunGroup;
      }

      function createRobloxModel(colorHex, isEnemy = false) {
        let rootGroup = new THREE.Group();
        let mat = new THREE.MeshLambertMaterial({ color: colorHex });
        let head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), mat); head.position.y = 2.4; head.castShadow = true; rootGroup.add(head);
        let torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.4, 0.6), mat); torso.position.y = 1.3; torso.castShadow = true; rootGroup.add(torso);
        let leftLegPivot = new THREE.Group(); leftLegPivot.position.set(-0.35, 0.7, 0);
        let leftLegMesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.2, 0.5), mat); leftLegMesh.position.y = -0.6; leftLegMesh.castShadow = true; leftLegPivot.add(leftLegMesh); rootGroup.add(leftLegPivot);
        let rightLegPivot = new THREE.Group(); rightLegPivot.position.set(0.35, 0.7, 0);
        let rightLegMesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.2, 0.5), mat); rightLegMesh.position.y = -0.6; rightLegMesh.castShadow = true; rightLegPivot.add(rightLegMesh); rootGroup.add(rightLegPivot);
        let leftArmGroup = new THREE.Group(); leftArmGroup.position.set(-0.8, 1.4, 0);
        let leftArmMesh = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.2, 0.4), mat); leftArmMesh.position.y = -0.5; leftArmMesh.castShadow = true; leftArmGroup.add(leftArmMesh); rootGroup.add(leftArmGroup);
        let rightArmGroup = new THREE.Group(); rightArmGroup.position.set(0.8, 1.4, 0);
        let rightArmMesh = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 1.0), mat); rightArmMesh.position.set(0, 0, -0.5); rightArmMesh.castShadow = true; rightArmGroup.add(rightArmMesh); 
        rootGroup.add(rightArmGroup);

        let gliderMesh = createGliderMesh();
        rootGroup.add(gliderMesh);

        let currentGun = null;

          rightArmGroup.add(currentGun);
        }

        else equipWeaponVisual('revolver', 0xff0000); 

        return { 
          mesh: rootGroup, head: head, leftLeg: leftLegPivot, rightLeg: rightLegPivot, leftArmGroup: leftArmGroup, rightArmGroup: rightArmGroup,

      let centralMessage = document.createElement('div');

      function showCentralMessage(text, color, duration = 2000) {
        centralMessage.innerText = text; centralMessage.style.color = color;
        centralMessage.style.textShadow = `0 0 25px ${color}`; centralMessage.style.opacity = '1';
        setTimeout(() => { centralMessage.style.opacity = '0'; }, duration);

      let damageTexts = [];
      function createFortniteDamageText(amount, worldPos, isHeadshot) {
        let vector = worldPos.clone().project(camera);
        let x = (vector.x * .5 + .5) * window.innerWidth;
        let y = (-(vector.y * .5) + .5) * window.innerHeight;
        let el = document.createElement('div');
        let color = isHeadshot ? '#ffd700' : '#ff7700'; 
        el.style.cssText = `position: absolute; left: ${x}px; top: ${y}px; color: ${color}; font-family: 'Arial Black', Impact, sans-serif; font-size: ${isHeadshot ? '42px' : '28px'}; font-weight: 900; text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000; pointer-events: none; z-index: 99999; transform: translate(-50%, -50%);`;
        el.innerText = Math.ceil(amount * (isHeadshot ? 20 : 10));
        container.appendChild(el);
        damageTexts.push({ element: el, pos: worldPos.clone(), vx: (Math.random() - 0.5) * 60, vy: -120, age: 0, maxAge: 30 });
      }

      function updateDamageTexts(dt) {
        for (let i = damageTexts.length - 1; i >= 0; i--) {
          let t = damageTexts[i]; t.age++; t.vy += 350 * dt; t.pos.y -= (t.vy * 0.0002);
          let vector = t.pos.clone().project(camera);
          t.element.style.left = `${(vector.x * .5 + .5) * window.innerWidth}px`;
          t.element.style.top = `${(-(vector.y * .5) + .5) * window.innerHeight}px`;
          if (t.age > 15) t.element.style.opacity = (30 - t.age) / 15;
          if (t.age >= 30) { t.element.remove(); damageTexts.splice(i, 1); }
        }
      }

      let floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshLambertMaterial());
      floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

      function createWall(w, h, d, x, z, yPos = null, isDestructible = false, tex = null) {
        let gY = yPos !== null ? yPos : (getTerrainHeight(x, z) + h/2);
        let mat = tex ? new THREE.MeshLambertMaterial({ map: tex }) : new THREE.MeshLambertMaterial({ color: 0x0d1121 });
        let mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
        mesh.position.set(x, gY, z); mesh.castShadow = true; mesh.receiveShadow = true;
        scene.add(mesh); stageProps.push(mesh);
        
        let wallData = { mesh: mesh, x: x, y: gY, z: z, w: w, h: h, d: d, hp: 8.0, maxHp: 8.0, isDestructible: isDestructible };
        walls.push(wallData);
        if (isDestructible) destructibles.push(wallData);
        return mesh;
      }

      function createTallBuilding(cx, cz) {
        let baseFloorY = getTerrainHeight(cx, cz);
        let floorHeight = 6.0;
        let totalFloors = 4;

        for (let f = 0; f < totalFloors; f++) {
          let currentY = baseFloorY + f * floorHeight;
          createWall(16, 0.4, 16, cx, cz, currentY, false, texWood);

          createWall(16, floorHeight, 1, cx, cz - 8, currentY + floorHeight/2, true, texBrick);
          createWall(16, floorHeight, 1, cx, cz + 8, currentY + floorHeight/2, true, texBrick);
          createWall(1, floorHeight, 16, cx - 8, cz, currentY + floorHeight/2, true, texBrick);
          createWall(1, floorHeight, 16, cx + 8, cz, currentY + floorHeight/2, true, texBrick);

          if (f > 0) { spawnChest(cx + (Math.random()*6-3), currentY + 0.2, cz + (Math.random()*6-3)); }
        }
        let roofY = baseFloorY + totalFloors * floorHeight;
        createWall(18, 0.5, 18, cx, cz, roofY, false, texWood);
        spawnChest(cx, roofY + 0.25, cz);
      }

      function createWideHouse(cx, cz) {
        let baseFloorY = getTerrainHeight(cx, cz);
        let floorHeight = 5.5;

        createWall(26, 0.4, 20, cx, cz, baseFloorY, false, texWood);
        createWall(26, floorHeight, 1, cx, cz - 10, baseFloorY + floorHeight/2, true, texBrick);
        createWall(26, floorHeight, 1, cx, cz + 10, baseFloorY + floorHeight/2, true, texBrick);
        createWall(1, floorHeight, 20, cx - 13, cz, baseFloorY + floorHeight/2, true, texBrick);
        createWall(1, floorHeight, 20, cx + 13, cz, baseFloorY + floorHeight/2, true, texBrick);
        spawnChest(cx - 8, baseFloorY + 0.2, cz - 5);

        let floor2Y = baseFloorY + floorHeight;
        createWall(26, 0.4, 20, cx, cz, floor2Y, false, texWood);
        createWall(26, floorHeight, 1, cx, cz - 10, floor2Y + floorHeight/2, true, texBrick);
        createWall(26, floorHeight, 1, cx, cz + 10, floor2Y + floorHeight/2, true, texBrick);
        createWall(1, floorHeight, 20, cx - 13, cz, floor2Y + floorHeight/2, true, texBrick);
        createWall(1, floorHeight, 20, cx + 13, cz, floor2Y + floorHeight/2, true, texBrick);

        createWall(1, floorHeight, 10, cx, cz - 5, floor2Y + floorHeight/2, true, texWood);
        spawnChest(cx + 6, floor2Y + 0.2, cz + 4);
        spawnChest(cx - 6, floor2Y + 0.2, cz - 4);

        let roofY = floor2Y + floorHeight;
        createWall(28, 0.5, 22, cx, cz, roofY, false, texWood);
        spawnChest(cx, roofY + 0.25, cz);
      }

      function createBRTerrainAndTowns() {
        let geo = new THREE.PlaneGeometry(MAP_SIZE, MAP_SIZE, 100, 100);
        geo.rotateX(-Math.PI / 2);
        let pos = geo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          let x = pos.getX(i);
          let z = pos.getZ(i);
          pos.setY(i, getTerrainHeight(x, z));
        }
        geo.computeVertexNormals();

        let mat = new THREE.MeshStandardMaterial({ map: texGrass, roughness: 0.8 });
        terrainMesh = new THREE.Mesh(geo, mat);
        terrainMesh.receiveShadow = true;
        scene.add(terrainMesh);
        stageProps.push(terrainMesh);

        let b = MAP_SIZE / 2;
        walls.push(
          { x: 0, y: 50, z: b, w: MAP_SIZE, h: 200, d: 4 },
          { x: 0, y: 50, z: -b, w: MAP_SIZE, h: 200, d: 4 },
          { x: b, y: 50, z: 0, w: 4, h: 200, d: MAP_SIZE },
          { x: -b, y: 50, z: 0, w: 4, h: 200, d: MAP_SIZE }
        );

        let towns = [
          { cx: 0, cz: 0, type: 'CAPITAL' },
          { cx: -200, cz: -200, type: 'TOWERS' },
          { cx: 200, cz: 200, type: 'HOUSES' },
          { cx: -200, cz: 200, type: 'TOWERS' },
          { cx: 200, cz: -200, type: 'HOUSES' },
          { cx: 0, cz: -250, type: 'HOUSES' },
          { cx: 0, cz: 250, type: 'TOWERS' }
        ];

        towns.forEach(t => {
          if (t.type === 'CAPITAL') {
            createTallBuilding(t.cx - 20, t.cz - 20); createTallBuilding(t.cx + 20, t.cz + 20);
            createWideHouse(t.cx + 25, t.cz - 25); createWideHouse(t.cx - 25, t.cz + 25);
          } else if (t.type === 'TOWERS') {
            createTallBuilding(t.cx, t.cz); createWideHouse(t.cx + 30, t.cz);
          } else {
            createWideHouse(t.cx, t.cz); createWideHouse(t.cx - 30, t.cz + 20);
          }
        });

        for (let i = 0; i < 20; i++) {
          let rx = (Math.random() - 0.5) * (MAP_SIZE - 100);
          let rz = (Math.random() - 0.5) * (MAP_SIZE - 100);
          spawnChest(rx, getTerrainHeight(rx, rz) + 0.2, rz);
        }
      }

      function spawnChest(x, y, z) {
        let boxGeo = new THREE.BoxGeometry(2, 1.5, 1.5);
        let boxMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 });
        let mesh = new THREE.Mesh(boxGeo, boxMat);
        mesh.position.set(x, y + 0.75, z); mesh.castShadow = true;
        scene.add(mesh); stageProps.push(mesh);
        chests.push({ mesh: mesh, x: x, y: y, z: z, opened: false });
      }

      function rebuildStage(mode) {
        stageProps.forEach(p => scene.remove(p)); stageProps = []; walls = []; destructibles = []; chests = [];
        if (currentGrid) scene.remove(currentGrid);
        if (terrainMesh) { scene.remove(terrainMesh); terrainMesh = null; }

        if (mode === 'BR') {
          createBRTerrainAndTowns();
          scene.fog = new THREE.FogExp2(0x87ceeb, 0.0015);
          renderer.setClearColor(0x87ceeb);
        } else if (mode === 'ZOMBIE') {
          floor.material.color.setHex(0x0a0505); currentGrid = new THREE.GridHelper(100, 40, 0xff0000, 0x330000); scene.fog = new THREE.FogExp2(0x1a0a0a, 0.025); renderer.setClearColor(0x1a0a0a);
          [{x: -18, z: -18}, {x: 18, z: 18}, {x: -18, z: 18}, {x: 18, z: -18}].forEach(p => { createWall(6, 6, 6, p.x, p.z); });
          currentGrid.position.y = 0.01; scene.add(currentGrid);
        } else {
          floor.material.color.setHex(0x050a15); currentGrid = new THREE.GridHelper(100, 40, 0x00a8ff, 0x002b47); scene.fog = new THREE.FogExp2(0x050812, 0.015); renderer.setClearColor(0x050812);
          createWall(4, 10, 4, 0, 0); createWall(10, 5, 2, -15, 5); createWall(10, 5, 2, 15, -5);
          currentGrid.position.y = 0.01; scene.add(currentGrid);
        }
      }

      function checkCollision(px, pz, radius, py = 0) {
        for (let i = 0; i < walls.length; i++) {
          let w = walls[i];
          if (py >= w.y - w.h/2 - 0.2 && py < w.y + w.h/2 - 0.4) {
            if (px > w.x - w.w/2 - radius && px < w.x + w.w/2 + radius && pz > w.z - w.d/2 - radius && pz < w.z + w.d/2 + radius) return true;
          }
        }
        return false;
      }

      function startZombieMultiGame(startData) {
        let currentW = weaponStats[saveData.equipped];
        player.hp = 100; player.shield = 100; player.maxAmmo = currentW.maxAmmo; player.ammo = player.maxAmmo; player.isReloading = false; player.shootCooldownTimer = 0;
        currentWave = 0; totalKills = 0; meleeDamageTimer = 0;
        
        let startPosOffset = (Math.random() - 0.5) * 6;
        playerPhys.x = startPosOffset; playerPhys.y = 0; playerPhys.z = 20; playerPhys.vy = 0; playerPhys.isSkyDiving = false; playerPhys.isGliding = false;
        playerModel.gliderMesh.visible = false;
        playerModel.mesh.position.set(playerPhys.x, playerPhys.y, playerPhys.z);
        playerModel.mesh.visible = !isFirstPerson; 
        playerModel.equipWeaponVisual(saveData.equipped, currentW.color);

        playerBullets.forEach(b => scene.remove(b.mesh)); enemies.forEach(e => scene.remove(e.mesh));
        playerBullets = []; enemies = [];

        startData.players.forEach(p => {
          if (p.id !== socket.id) {
            let m = createRobloxModel(0x00a8ff, false);
            m.mesh.position.set((Math.random()-0.5)*6, 0, 20);
            m.equipWeaponVisual(p.weapon || 'laser', weaponStats[p.weapon || 'laser'] ? weaponStats[p.weapon || 'laser'].color : 0x00ffff);
            scene.add(m.mesh);
            enemies.push({
              id: p.id, name: p.name, model: m, mesh: m.mesh, radius: 1.0,
              isHumanTeammate: true, isOnline: true,
              targetPosition: m.mesh.position.clone(), targetYaw: 0, targetPitch: 0
            });
          }
        });

        menuOverlay.style.display = 'none'; hud.style.display = 'block'; crosshair.style.display = 'block'; viewIndicator.style.display='block';
        gameState = 'PLAYING'; renderer.domElement.requestPointerLock();

        if (isZombieHost) {
          startNextZombieWave();
        }
      }

      function startNextZombieWave() {
        if (gameState !== 'PLAYING') return;
        currentWave++;
        socket.emit('zombie_wave_start_sync', { roomId: currentRoomId, wave: currentWave });
      }

      socket.on('zombie_wave_start_sync', (data) => {
        currentWave = data.wave;
        showCentralMessage(`WAVE ${currentWave} START!`, "#ff3b30", 2000);
        if (isZombieHost) {
          let count = Math.round(4 + currentWave * 2);
          for(let i = 0; i < count; i++) {
            let zombieId = `z_${Date.now()}_${i}_${Math.floor(Math.random()*1000)}`;
            let ex = (Math.random() - 0.5) * 60;
            let ez = -30 + (Math.random() - 0.5) * 20;
            let hp = 4 + currentWave * 1.5;
            let speed = 0.06 + Math.random() * 0.04;

            spawnZombieLocal(zombieId, ex, ez, hp, speed);
            socket.emit('zombie_spawn_sync', { roomId: currentRoomId, id: zombieId, x: ex, z: ez, hp: hp, speed: speed });
          }
        }
        updateHUD();
      });

      socket.on('zombie_spawn_sync', (data) => {
        if (!isZombieHost) {
          spawnZombieLocal(data.id, data.x, data.z, data.hp, data.speed);
        }
      });

      function spawnZombieLocal(id, ex, ez, hp, speed) {
        let modelData = createRobloxModel(0x2d6a4f, true); 
        modelData.mesh.position.set(ex, 0, ez); scene.add(modelData.mesh);
        enemies.push({ 
          zombieId: id, model: modelData, mesh: modelData.mesh, radius: 1.0, hp: hp, 
          speed: speed, damage: 10, isZombie: true
        });
      }

      socket.on('zombie_damage_sync', (data) => {
        let z = enemies.find(e => e.zombieId === data.zombieId);
        if (z) {
          z.hp -= data.dmg;
          if (z.hp <= 0) {
            scene.remove(z.mesh);
            enemies = enemies.filter(e => e.zombieId !== data.zombieId);
            totalKills++;
            saveData.coins += 12;
            player.shield = Math.min(player.maxShield, player.shield + 4);
            updateHUD();

            let remainingZombies = enemies.filter(e => e.isZombie).length;
            if (remainingZombies === 0 && isZombieHost) {
              setTimeout(() => { startNextZombieWave(); }, 2000);
            }
          }
        }
      });

      function start1v1Game() { playerWins = 0; rivalWins = 0; duelRound = 1; setup1v1Round(); }

      function setup1v1Round() {
        isRoundEnding = false; player.hp = 100; player.shield = 100;
        let currentW = weaponStats[saveData.equipped];
        player.maxAmmo = currentW.maxAmmo; player.ammo = player.maxAmmo; player.isReloading = false;
        playerPhys.x = 0; playerPhys.y = 0; playerPhys.z = 30; playerPhys.vy = 0; playerPhys.isSkyDiving = false; playerPhys.isGliding = false;
        playerModel.gliderMesh.visible = false;
        playerModel.mesh.position.set(playerPhys.x, playerPhys.y, playerPhys.z);
        playerModel.mesh.visible = !isFirstPerson;
        playerModel.equipWeaponVisual(saveData.equipped, currentW.color);

        if (rival) { scene.remove(rival.mesh); }
        playerBullets.forEach(b => scene.remove(b.mesh)); playerBullets = [];
        enemies.forEach(e => scene.remove(e.mesh)); enemies = [];

        let rivalModel = createRobloxModel(0xd62828, true); rivalModel.mesh.position.set(0, 0, -30); scene.add(rivalModel.mesh);
        rival = { name: 'BOT Rival', model: rivalModel, mesh: rivalModel.mesh, radius: 1.0, hp: 40, maxHp: 40, speed: 0.15, isRival: true, shootTimer: 0, vx: 0, vz: 0, dirChangeTimer: 0 };
        enemies.push(rival);

        menuOverlay.style.display = 'none'; hud.style.display = 'block'; crosshair.style.display = 'block'; viewIndicator.style.display='block';
        gameState = 'PLAYING'; renderer.domElement.requestPointerLock();
        showCentralMessage(`ROUND ${duelRound}`, "#00a8ff", 2000);
        updateHUD();
      }

      function startOnlineMatchmaking() {
        menuOverlay.innerHTML = `
          <h2 style="font-size:36px; color:#39ff14; font-family:'Permanent Marker', cursive; margin-top:80px;">🌐 SEARCHING FOR OPPONENT...</h2>
          <button id="cancel-online-btn" style="margin-top:40px; padding:12px 30px; background:#ff3b30; color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">Cancel</button>
        `;
        document.getElementById('cancel-online-btn').addEventListener('click', () => { socket.emit('cancel_matchmaking'); show1v1SubMenu(); });
        socket.emit('join_matchmaking', { name: saveData.playerName, weapon: saveData.equipped });
      }

      socket.on('match_found', (data) => {
        currentRoomId = data.roomId; onlineRole = data.role; playerWins = 0; rivalWins = 0; duelRound = 1;
        setupOnlineRound(data);
      });

      function setupOnlineRound(data) {
        isRoundEnding = false; player.hp = 100; player.shield = 100;
        let currentW = weaponStats[saveData.equipped]; player.maxAmmo = currentW.maxAmmo; player.ammo = player.maxAmmo; player.isReloading = false;
        let startPos = data ? data.startPos : (onlineRole === 'player1' ? {x:0, y:0, z:30} : {x:0, y:0, z:-30});
        playerPhys.x = startPos.x; playerPhys.y = startPos.y; playerPhys.z = startPos.z; playerPhys.vy = 0; playerPhys.isSkyDiving = false; playerPhys.isGliding = false;
        playerModel.gliderMesh.visible = false;
        playerModel.mesh.position.set(playerPhys.x, playerPhys.y, playerPhys.z);
        playerModel.mesh.visible = !isFirstPerson;
        playerModel.equipWeaponVisual(saveData.equipped, currentW.color);

        if (rival) scene.remove(rival.mesh);
        playerBullets.forEach(b => scene.remove(b.mesh)); playerBullets = [];
        enemies.forEach(e => scene.remove(e.mesh)); enemies = [];

        let rivalModel = createRobloxModel(0x00a8ff, true); 
        let rivalStartPos = onlineRole === 'player1' ? { x: 0, y: 0, z: -30 } : { x: 0, y: 0, z: 30 };
        rivalModel.mesh.position.set(rivalStartPos.x, rivalStartPos.y, rivalStartPos.z);
        scene.add(rivalModel.mesh);
        rival = { name: data.opponentName || 'Online Rival', model: rivalModel, mesh: rivalModel.mesh, radius: 1.0, hp: 100, maxHp: 100, isRival: true, isOnline: true };
        enemies.push(rival);

        menuOverlay.style.display = 'none'; hud.style.display = 'block'; crosshair.style.display = 'block'; viewIndicator.style.display='block';
        gameState = 'PLAYING'; renderer.domElement.requestPointerLock();
        showCentralMessage(`1v1 MATCH START!`, "#00a8ff", 2000);
        updateHUD();
      }

      showNameInputMenu();
    })();
  </script>
</body>
</html>
