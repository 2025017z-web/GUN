
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人間×AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #050510; font-family: sans-serif; user-select: none; }
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    .nametag { position: absolute; color: #ffffff; font-weight: bold; font-size: 13px; text-shadow: 0 0 4px #000; pointer-events: none; transform: translate(-50%, -100%); background: rgba(0,0,0,0.65); padding: 3px 10px; border-radius: 6px; display: none; border: 1px solid rgba(255,255,255,0.2); }
    #loot-prompt { position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%); color: #ffd700; font-weight: bold; font-size: 20px; text-shadow: 0 0 10px #000; display: none; pointer-events: none; background: rgba(0,0,0,0.75); padding: 8px 20px; border-radius: 20px; border: 2px solid #ffd700; }
    #glider-prompt { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); color: #00f5d4; font-size: 22px; font-weight: bold; text-shadow: 0 0 8px #000; display: none; pointer-events: none; background: rgba(0,0,0,0.75); padding: 10px 24px; border-radius: 20px; border: 2px solid #00f5d4; z-index: 9999; }
    
    /* 武器スロットUI */
    #weapon-inventory-bar {
      position: absolute; bottom: 105px; left: 50%; transform: translateX(-50%);
      display: none; gap: 8px; z-index: 9999; pointer-events: none;
    }
    .inventory-slot {
      width: 65px; height: 45px; background: rgba(10, 10, 25, 0.85); border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 11px; font-weight: bold; backdrop-filter: blur(4px); transition: all 0.15s ease;
    }
    .inventory-slot.active {
      border-color: #ffd700; background: rgba(255, 215, 0, 0.25); transform: scale(1.08); box-shadow: 0 0 12px #ffd700;
    }
    .slot-key { font-size: 10px; color: #00f5d4; margin-bottom: 2px; }
  </style>
</head>
<body>

  <div id="canvas-container"></div>
  <div id="loot-prompt">プレス [E] で宝箱を開ける</div>
  <div id="glider-prompt">🪂 [SPACE] でグライダーを展開！（展開しないと落下死）</div>
  
  <div id="weapon-inventory-bar"></div>

  <script>
    (function() {
      let socket = io();
      let container = document.getElementById('canvas-container');
      let lootPrompt = document.getElementById('loot-prompt');
      let gliderPrompt = document.getElementById('glider-prompt');
      let inventoryBar = document.getElementById('weapon-inventory-bar');

      let damageOverlay = document.createElement('div');
      damageOverlay.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;box-shadow:inset 0 0 100px rgba(255,0,0,0);pointer-events:none;z-index:99999;transition:box-shadow 0.1s ease-out;';
      container.appendChild(damageOverlay);

      function triggerDamageFlash() {
        damageOverlay.style.transition = 'none';
        damageOverlay.style.boxShadow = 'inset 0 0 80px rgba(255, 0, 0, 0.8)';
        setTimeout(() => {
          damageOverlay.style.transition = 'box-shadow 0.4s ease-out';
          damageOverlay.style.boxShadow = 'inset 0 0 100px rgba(255,0,0,0)';
        }, 50);
      }

      let scene = new THREE.Scene();
      let camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 400);
      
      let renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      let playerPhys = { x: 0, y: 0, z: 0, radius: 0.9, vy: 0, isGrounded: true, isSkyDiving: false, isGliding: false };
      let cameraDist = 6.0; 
      let isAiming = false; 
      let isFirstPerson = false;

      let ambientLight = new THREE.AmbientLight(0xffffff, 0.6); 
      scene.add(ambientLight);

      let dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight.position.set(150, 250, 100);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 1024;
      dirLight.shadow.mapSize.height = 1024;
      dirLight.shadow.camera.near = 0.5;
      dirLight.shadow.camera.far = 300;
      let d = 120;
      dirLight.shadow.camera.left = -d; dirLight.shadow.camera.right = d;
      dirLight.shadow.camera.top = d; dirLight.shadow.camera.bottom = -d;
      scene.add(dirLight);

      const MAP_SIZE = 700;

      function getTerrainHeight(x, z) {
        if (selectedMode !== 'BR') return 0;
        if (Math.abs(x) > MAP_SIZE / 2 || Math.abs(z) > MAP_SIZE / 2) return 0;
        
        let townCenters = [
          { x: 0, z: 0, r: 90 },
          { x: -200, z: -200, r: 80 },
          { x: 200, z: 200, r: 80 },
          { x: -200, z: 200, r: 80 },
          { x: 200, z: -200, r: 80 },
          { x: 0, z: -250, r: 80 },
          { x: 0, z: 250, r: 80 }
        ];

        for (let t of townCenters) {
          let dist = Math.hypot(x - t.x, z - t.z);
          if (dist < t.r) {
            return 0;
          } else if (dist < t.r + 30) {
            let rawY = Math.sin(x * 0.02) * Math.cos(z * 0.02) * 16.0 + Math.sin(x * 0.06) * 5.0;
            let factor = (dist - t.r) / 30;
            return rawY * factor;
          }
        }

        let y = Math.sin(x * 0.02) * Math.cos(z * 0.02) * 16.0 + Math.sin(x * 0.06) * 5.0;
        return y;
      }

      function generateBrickTexture() {
        let cv = document.createElement('canvas'); cv.width = 256; cv.height = 256;
        let ctx = cv.getContext('2d');
        ctx.fillStyle = '#8b3a2b'; ctx.fillRect(0,0,256,256);
        ctx.strokeStyle = '#5a2319'; ctx.lineWidth = 4;
        for(let y=0; y<256; y+=32) {
          ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(256,y); ctx.stroke();
          let offset = (y/32)%2 === 0 ? 0 : 32;
          for(let x=offset; x<256; x+=64) {
            ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+32); ctx.stroke();
          }
        }
        return new THREE.CanvasTexture(cv);
      }

      function generateWoodTexture() {
        let cv = document.createElement('canvas'); cv.width = 256; cv.height = 256;
        let ctx = cv.getContext('2d');
        ctx.fillStyle = '#a0522d'; ctx.fillRect(0,0,256,256);
        ctx.fillStyle = '#8b4513';
        for(let i=0; i<30; i++) {
          ctx.fillRect(0, Math.random()*256, 256, Math.random()*4+1);
        }
        return new THREE.CanvasTexture(cv);
      }

      function generateGrassTexture() {
        let cv = document.createElement('canvas'); cv.width = 512; cv.height = 512;
        let ctx = cv.getContext('2d');
        ctx.fillStyle = '#2e8b57'; ctx.fillRect(0,0,512,512);
        for(let i=0; i<5000; i++) {
          ctx.fillStyle = Math.random() > 0.5 ? '#3cb371' : '#1e5631';
          ctx.fillRect(Math.random()*512, Math.random()*512, 2, 6);
        }
        return new THREE.CanvasTexture(cv);
      }

      let texBrick = generateBrickTexture(); texBrick.wrapS = THREE.RepeatWrapping; texBrick.wrapT = THREE.RepeatWrapping;
      let texWood = generateWoodTexture(); texWood.wrapS = THREE.RepeatWrapping; texWood.wrapT = THREE.RepeatWrapping;
      let texGrass = generateGrassTexture(); texGrass.wrapS = THREE.RepeatWrapping; texGrass.wrapT = THREE.RepeatWrapping; texGrass.repeat.set(80, 80);

      let saveData = {
        playerName: '',
        coins: 500, 
        unlocked: { laser: true, revolver: true, shotgun: true, flame: false, sniper: true, plasma: false, bow: false, blizzard: false, minigun: true, voidray: false },
        equipped: 'laser',
        keyMap: { forward: 'KeyW', left: 'KeyA', backward: 'KeyS', right: 'KeyD', jump: 'Space', reload: 'KeyR', switchView: 'KeyV', dash: 'KeyQ', interact: 'KeyE' }
      };
      
      let localSave = localStorage.getItem('fps_zombie_horizontal_v6');
      if (localSave) {
        try { 
          let parsed = JSON.parse(localSave);
          saveData = Object.assign(saveData, parsed);
          if (parsed.keyMap) saveData.keyMap = Object.assign(saveData.keyMap, parsed.keyMap);
        } catch(e){}
      }
      function save() { localStorage.setItem('fps_zombie_horizontal_v6', JSON.stringify(saveData)); }

      let weaponStats = {
        laser: { name: '⚡ 初期レーザー', cost: 0, maxAmmo: 30, dmg: 1.1, reloadTime: 60, color: 0x00ffff, size: 0.05, speed: 1.8, shootInterval: 12 },
        revolver: { name: '💥 ヘビーマグナム', cost: 150, maxAmmo: 6, dmg: 4.5, reloadTime: 80, color: 0xffaa00, size: 0.09, speed: 2.5, shootInterval: 35 },
        shotgun: { name: '🌊 三連ショットガン', cost: 300, maxAmmo: 10, dmg: 1.6, reloadTime: 90, color: 0xff00ff, size: 0.06, speed: 1.6, shootInterval: 42 },
        flame: { name: '🔥 焼夷レジスタンス', cost: 2500, maxAmmo: 180, dmg: 0.4, reloadTime: 100, color: 0xff4500, size: 0.35, speed: 0.85, shootInterval: 2 }, 
        sniper: { name: '🎯 スナイパーライフル', cost: 1000, maxAmmo: 5, dmg: 9, reloadTime: 120, color: 0xffffff, size: 0.04, speed: 4.5, shootInterval: 55 },
        plasma: { name: '🌀 プラズマランチャー', cost: 1500, maxAmmo: 8, dmg: 6.5, reloadTime: 130, color: 0x00ff55, size: 0.45, speed: 0.9, shootInterval: 48 },
        bow: { name: '🏹 デーモンクロスボウ', cost: 2000, maxAmmo: 12, dmg: 5.0, reloadTime: 70, color: 0xff0055, size: 0.08, speed: 1.4, shootInterval: 25, isPierce: true },
        blizzard: { name: '❄️ ブリザードカノン', cost: 3000, maxAmmo: 15, dmg: 0.5, reloadTime: 100, color: 0x88ccff, size: 0.5, speed: 1.0, shootInterval: 30 },
        minigun: { name: '⚡️ インフィニティミニガン', cost: 5000, maxAmmo: 500, dmg: 0.6, reloadTime: 200, color: 0xffff00, size: 0.04, speed: 2.2, shootInterval: 1 },
        voidray: { name: '🔮 ヴォイド・レイ', cost: 10000, maxAmmo: 60, dmg: 2.5, reloadTime: 80, color: 0x9900ff, size: 0.15, speed: 2.0, shootInterval: 6 }
      };

      let playerSlots = ['laser'];
      let currentSlotIndex = 0;

      function switchWeaponSlot(index) {
        if (selectedMode === '1V1') { index = 0; saveData.equipped = 'laser'; }
        if (index < 0 || index >= playerSlots.length) return;
        currentSlotIndex = index;
        saveData.equipped = playerSlots[currentSlotIndex];
        let currentW = weaponStats[saveData.equipped];
        player.maxAmmo = currentW.maxAmmo;
        player.ammo = player.maxAmmo;
        player.isReloading = false;
        playerModel.equipWeaponVisual(saveData.equipped, currentW.color);
        updateInventoryUI();
        updateHUD();
      }

      function addWeaponToInventory(weaponKey) {
        if (selectedMode === '1V1') return;
        if (!playerSlots.includes(weaponKey)) {
          if (playerSlots.length < 5) {
            playerSlots.push(weaponKey);
            switchWeaponSlot(playerSlots.length - 1);
          } else {
            playerSlots[currentSlotIndex] = weaponKey;
            switchWeaponSlot(currentSlotIndex);
          }
        } else {
          let existingIdx = playerSlots.indexOf(weaponKey);
          switchWeaponSlot(existingIdx);
        }
      }

      function updateInventoryUI() {
        if (gameState !== 'PLAYING') {
          inventoryBar.style.display = 'none';
          return;
        }
        inventoryBar.style.display = 'flex';
        inventoryBar.innerHTML = '';
        for (let i = 0; i < 5; i++) {
          let slotEl = document.createElement('div');
          slotEl.className = `inventory-slot ${i === currentSlotIndex ? 'active' : ''}`;
          if (i < playerSlots.length) {
            let w = weaponStats[playerSlots[i]];
            slotEl.innerHTML = `<span class="slot-key">[${i+1}]</span><span>${w.name.split(' ')[1] || w.name}</span>`;
          } else {
            slotEl.innerHTML = `<span class="slot-key">[${i+1}]</span><span style="color:#666;">- 空き -</span>`;
          }
          inventoryBar.appendChild(slotEl);
        }
      }

      let player = { hp: 100, maxHp: 100, shield: 100, maxShield: 100, ammo: 30, maxAmmo: 30, isReloading: false, reloadTimer: 0, shootCooldownTimer: 0 };
      let isMouseDown = false; 

      let gameState = 'NAME_INPUT'; 
      let selectedMode = 'BR'; 
      let duelSubMode = 'BOT';
      let zombieSubMode = 'SOLO'; // 'SOLO' or 'ONLINE'
      let currentRoomId = null;
      let onlineRole = null;
      let isRoundEnding = false;

      let isZombieHost = false;
      let zombieMultiPlayers = [];

      let currentWave = 0;
      let totalKills = 0;
      let meleeDamageTimer = 0; 
      let playerBullets = [];
      let enemies = [];
      let chests = [];
      let destructibles = [];

      let duelRound = 1;
      let playerWins = 0;
      let rivalWins = 0;
      let rival = null; 

      let currentGrid = null;
      let stageProps = [];
      let walls = [];
      let terrainMesh = null;

      function createGliderMesh() {
        let gliderGroup = new THREE.Group();
        let wingGeo = new THREE.ConeGeometry(1.2, 0.8, 4);
        let wingMat = new THREE.MeshLambertMaterial({ color: 0xff0055, side: THREE.DoubleSide });
        let wing = new THREE.Mesh(wingGeo, wingMat);
        wing.rotation.x = Math.PI / 2;
        wing.scale.set(1.2, 0.15, 0.8);
        gliderGroup.add(wing);

        let barGeo = new THREE.CylinderGeometry(0.04, 0.04, 1.2);
        let barMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
        let bar = new THREE.Mesh(barGeo, barMat);
        bar.rotation.z = Math.PI / 2;
        bar.position.set(0, -0.4, 0.1);
        gliderGroup.add(bar);

        gliderGroup.position.set(0, 2.2, 0);
        gliderGroup.visible = false;
        return gliderGroup;
      }

      function buildGunMesh(weaponKey, colorHex) {
        let gunGroup = new THREE.Group();
        let mainMat = new THREE.MeshLambertMaterial({ color: 0x1f1f1f });
        let accentMat = new THREE.MeshLambertMaterial({ color: colorHex });
        let dBody = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.6), mainMat); dBody.position.set(0, 0.1, -0.2);
        let dBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.4), accentMat); dBarrel.rotation.x = Math.PI/2; dBarrel.position.set(0, 0.1, -0.5); dBody.add(dBarrel);
        gunGroup.add(dBody);
        return gunGroup;
      }

      function createRobloxModel(colorHex, isEnemy = false) {
        let rootGroup = new THREE.Group();
        let mat = new THREE.MeshLambertMaterial({ color: colorHex });
        let head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), mat); head.position.y = 2.4; head.castShadow = true; rootGroup.add(head);
        let torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.4, 0.6), mat); torso.position.y = 1.3; torso.castShadow = true; rootGroup.add(torso);
        let leftLegPivot = new THREE.Group(); leftLegPivot.position.set(-0.35, 0.7, 0);
        let leftLegMesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.2, 0.5), mat); leftLegMesh.position.y = -0.6; leftLegMesh.castShadow = true; leftLegPivot.add(leftLegMesh); rootGroup.add(leftLegPivot);
        let rightLegPivot = new THREE.Group(); rightLegPivot.position.set(0.35, 0.7, 0);
        let rightLegMesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.2, 0.5), mat); rightLegMesh.position.y = -0.6; rightLegMesh.castShadow = true; rightLegPivot.add(rightLegMesh); rootGroup.add(rightLegPivot);
        let leftArmGroup = new THREE.Group(); leftArmGroup.position.set(-0.8, 1.4, 0);
        let leftArmMesh = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.2, 0.4), mat); leftArmMesh.position.y = -0.5; leftArmMesh.castShadow = true; leftArmGroup.add(leftArmMesh); rootGroup.add(leftArmGroup);
        let rightArmGroup = new THREE.Group(); rightArmGroup.position.set(0.8, 1.4, 0);
        let rightArmMesh = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 1.0), mat); rightArmMesh.position.set(0, 0, -0.5); rightArmMesh.castShadow = true; rightArmGroup.add(rightArmMesh); 
        rootGroup.add(rightArmGroup);

        let gliderMesh = createGliderMesh();
        rootGroup.add(gliderMesh);

        let currentGun = null;
        function equipWeaponVisual(weaponKey, accentColor) {
          if (currentGun) rightArmGroup.remove(currentGun);
          currentGun = buildGunMesh(weaponKey, accentColor);
          currentGun.position.set(0, 0, -1.0);
          rightArmGroup.add(currentGun);
        }
        if(!isEnemy) equipWeaponVisual(saveData.equipped, weaponStats[saveData.equipped].color);
        else equipWeaponVisual('revolver', 0xff0000); 

        return { 
          mesh: rootGroup, head: head, leftLeg: leftLegPivot, rightLeg: rightLegPivot, leftArmGroup: leftArmGroup, rightArmGroup: rightArmGroup,
          gliderMesh: gliderMesh, equipWeaponVisual: equipWeaponVisual, getGun: () => currentGun
        };
      }

      let playerModel = createRobloxModel(0x2a9d8f, false);
      scene.add(playerModel.mesh);

      let opponentNametag = document.createElement('div');
      opponentNametag.className = 'nametag';
      container.appendChild(opponentNametag);

      let remoteNametags = {};

      let hud = document.createElement('div');
      hud.style.cssText = 'position:absolute;bottom:35px;left:50%;transform:translateX(-50%);color:#fff;font-family:"Arial Black", Impact, sans-serif;width:380px;background:rgba(10,10,20,0.85);backdrop-filter:blur(8px);padding:12px 20px;border-radius:30px;pointer-events:none;border:1px solid rgba(255,255,255,0.15);box-shadow:0 8px 32px rgba(0,0,0,0.6);display:none;';
      container.appendChild(hud);

      let viewIndicator = document.createElement('div');
      viewIndicator.style.cssText = 'position:absolute;top:20px;left:20px;color:rgba(255,255,255,0.8);font-size:13px;font-family:sans-serif;background:rgba(0,0,0,0.5);padding:6px 14px;border-radius:15px;pointer-events:none;display:none; border: 1px solid rgba(255,255,255,0.1);';
      container.appendChild(viewIndicator);

      let crosshair = document.createElement('div');
      crosshair.style.cssText = 'position:absolute;top:50%;left:50%;width:12px;height:12px;border:2px solid rgba(255,255,255,0.8);transform:translate(-50%,-50%);pointer-events:none;display:none;border-radius:50%;';
      container.appendChild(crosshair);

      let menuOverlay = document.createElement('div');
      menuOverlay.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(10,10,25,0.98);display:flex;flex-direction:column;justify-flex-start;align-items:center;color:#fff;text-align:center;overflow-y:auto;padding:30px 20px;box-sizing:border-box; z-index:999990;';
      container.appendChild(menuOverlay);

      let centralMessage = document.createElement('div');
      centralMessage.style.cssText = 'position:absolute;top:35%;left:50%;transform:translate(-50%,-50%);font-family:"Permanent Marker", cursive;font-size:60px;font-weight:900;pointer-events:none;z-index:999999;transition:opacity 0.4s ease;opacity:0;text-align:center;width:100%;';
      container.appendChild(centralMessage);

      function showCentralMessage(text, color, duration = 2000) {
        centralMessage.innerText = text; centralMessage.style.color = color;
        centralMessage.style.textShadow = `0 0 25px ${color}`; centralMessage.style.opacity = '1';
        setTimeout(() => { centralMessage.style.opacity = '0'; }, duration);
      }

      let damageTexts = [];
      function createFortniteDamageText(amount, worldPos, isHeadshot) {
        let vector = worldPos.clone().project(camera);
        let x = (vector.x * .5 + .5) * window.innerWidth;
        let y = (-(vector.y * .5) + .5) * window.innerHeight;
        let el = document.createElement('div');
        let color = isHeadshot ? '#ffd700' : '#ff7700'; 
        el.style.cssText = `position: absolute; left: ${x}px; top: ${y}px; color: ${color}; font-family: 'Arial Black', Impact, sans-serif; font-size: ${isHeadshot ? '42px' : '28px'}; font-weight: 900; text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000; pointer-events: none; z-index: 99999; transform: translate(-50%, -50%);`;
        el.innerText = Math.ceil(amount * (isHeadshot ? 20 : 10));
        container.appendChild(el);
        damageTexts.push({ element: el, pos: worldPos.clone(), vx: (Math.random() - 0.5) * 60, vy: -120, age: 0, maxAge: 30 });
      }

      function updateDamageTexts(dt) {
        for (let i = damageTexts.length - 1; i >= 0; i--) {
          let t = damageTexts[i]; t.age++; t.vy += 350 * dt; t.pos.y -= (t.vy * 0.0002);
          let vector = t.pos.clone().project(camera);
          t.element.style.left = `${(vector.x * .5 + .5) * window.innerWidth}px`;
          t.element.style.top = `${(-(vector.y * .5) + .5) * window.innerHeight}px`;
          if (t.age > 15) t.element.style.opacity = (30 - t.age) / 15;
          if (t.age >= 30) { t.element.remove(); damageTexts.splice(i, 1); }
        }
      }

      let floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshLambertMaterial());
      floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

      function createWall(w, h, d, x, z, yPos = null, isDestructible = false, tex = null) {
        let gY = yPos !== null ? yPos : (getTerrainHeight(x, z) + h/2);
        let mat = tex ? new THREE.MeshLambertMaterial({ map: tex }) : new THREE.MeshLambertMaterial({ color: 0x0d1121 });
        let mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
        mesh.position.set(x, gY, z); mesh.castShadow = true; mesh.receiveShadow = true;
        scene.add(mesh); stageProps.push(mesh);
        
        let wallData = { mesh: mesh, x: x, y: gY, z: z, w: w, h: h, d: d, hp: 5.0, maxHp: 5.0, isDestructible: isDestructible };
        walls.push(wallData);
        if (isDestructible) destructibles.push(wallData);
        return mesh;
      }

      function createSubdividedWall(w, h, d, cx, cz, yPos, isDestructible = true, tex = null) {
        if (selectedMode !== 'BR') isDestructible = false; // BR以外では絶対壊れない
        let subSize = 3.5; 
        let numX = Math.max(1, Math.round(w / subSize));
        let numY = Math.max(1, Math.round(h / subSize));
        let numZ = Math.max(1, Math.round(d / subSize));

        let blockW = w / numX;
        let blockH = h / numY;
        let blockD = d / numZ;

        let startX = cx - w / 2 + blockW / 2;
        let startY = yPos - h / 2 + blockH / 2;
        let startZ = cz - d / 2 + blockD / 2;

        for (let ix = 0; ix < numX; ix++) {
          for (let iy = 0; iy < numY; iy++) {
            for (let iz = 0; iz < numZ; iz++) {
              let bx = startX + ix * blockW;
              let by = startY + iy * blockH;
              let bz = startZ + iz * blockD;
              createWall(blockW, blockH, blockD, bx, by, bz, isDestructible, tex);
            }
          }
        }
      }

      function createTallBuilding(cx, cz) {
        let baseFloorY = getTerrainHeight(cx, cz);
        let floorHeight = 8.5; 
        let totalFloors = 4;
        let isDest = (selectedMode === 'BR');

        for (let f = 0; f < totalFloors; f++) {
          let currentY = baseFloorY + f * floorHeight;
          createWall(16, 0.5, 16, cx, cz, currentY, false, texWood);

          createSubdividedWall(16, floorHeight, 1, cx, cz - 8, currentY + floorHeight/2, isDest, texBrick);
          createSubdividedWall(16, floorHeight, 1, cx, cz + 8, currentY + floorHeight/2, isDest, texBrick);
          createSubdividedWall(1, floorHeight, 16, cx - 8, cz, currentY + floorHeight/2, isDest, texBrick);
          createSubdividedWall(1, floorHeight, 16, cx + 8, cz, currentY + floorHeight/2, isDest, texBrick);

          if (f > 0 && selectedMode === 'BR') {
            spawnChest(cx + (Math.random()*6-3), currentY + 0.2, cz + (Math.random()*6-3));
          }
        }
        let roofY = baseFloorY + totalFloors * floorHeight;
        createWall(18, 0.6, 18, cx, cz, roofY, false, texWood);
        if (selectedMode === 'BR') spawnChest(cx, roofY + 0.3, cz);
      }

      function createWideHouse(cx, cz) {
        let baseFloorY = getTerrainHeight(cx, cz);
        let floorHeight = 8.0;
        let isDest = (selectedMode === 'BR');

        createWall(26, 0.5, 20, cx, cz, baseFloorY, false, texWood);
        createSubdividedWall(26, floorHeight, 1, cx, cz - 10, baseFloorY + floorHeight/2, isDest, texBrick);
        createSubdividedWall(26, floorHeight, 1, cx, cz + 10, baseFloorY + floorHeight/2, isDest, texBrick);
        createSubdividedWall(1, floorHeight, 20, cx - 13, cz, baseFloorY + floorHeight/2, isDest, texBrick);
        createSubdividedWall(1, floorHeight, 20, cx + 13, cz, baseFloorY + floorHeight/2, isDest, texBrick);
        if (selectedMode === 'BR') spawnChest(cx - 8, baseFloorY + 0.2, cz - 5);

        let floor2Y = baseFloorY + floorHeight;
        createWall(26, 0.5, 20, cx, cz, floor2Y, false, texWood);
        createSubdividedWall(26, floorHeight, 1, cx, cz - 10, floor2Y + floorHeight/2, isDest, texBrick);
        createSubdividedWall(26, floorHeight, 1, cx, cz + 10, floor2Y + floorHeight/2, isDest, texBrick);
        createSubdividedWall(1, floorHeight, 20, cx - 13, cz, floor2Y + floorHeight/2, isDest, texBrick);
        createSubdividedWall(1, floorHeight, 20, cx + 13, cz, floor2Y + floorHeight/2, isDest, texBrick);

        createSubdividedWall(1, floorHeight, 10, cx, cz - 5, floor2Y + floorHeight/2, isDest, texWood);
        if (selectedMode === 'BR') {
          spawnChest(cx + 6, floor2Y + 0.2, cz + 4);
          spawnChest(cx - 6, floor2Y + 0.2, cz - 4);
        }

        let roofY = floor2Y + floorHeight;
        createWall(28, 0.6, 22, cx, cz, roofY, false, texWood);
        if (selectedMode === 'BR') spawnChest(cx, roofY + 0.3, cz);
      }

      function createBRTerrainAndTowns() {
        let geo = new THREE.PlaneGeometry(MAP_SIZE, MAP_SIZE, 100, 100);
        geo.rotateX(-Math.PI / 2);
        let pos = geo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          let x = pos.getX(i);
          let z = pos.getZ(i);
          let y = getTerrainHeight(x, z);
          pos.setY(i, y);
        }
        geo.computeVertexNormals();

        let mat = new THREE.MeshStandardMaterial({ map: texGrass, roughness: 0.8 });
        terrainMesh = new THREE.Mesh(geo, mat);
        terrainMesh.receiveShadow = true;
        scene.add(terrainMesh);
        stageProps.push(terrainMesh);

        let b = MAP_SIZE / 2;
        walls.push(
          { x: 0, y: 50, z: b, w: MAP_SIZE, h: 200, d: 4, isDestructible: false },
          { x: 0, y: 50, z: -b, w: MAP_SIZE, h: 200, d: 4, isDestructible: false },
          { x: b, y: 50, z: 0, w: 4, h: 200, d: MAP_SIZE, isDestructible: false },
          { x: -b, y: 50, z: 0, w: 4, h: 200, d: MAP_SIZE, isDestructible: false }
        );

        let towns = [
          { cx: 0, cz: 0, type: 'CAPITAL' },
          { cx: -200, cz: -200, type: 'TOWERS' },
          { cx: 200, cz: 200, type: 'HOUSES' },
          { cx: -200, cz: 200, type: 'TOWERS' },
          { cx: 200, cz: -200, type: 'HOUSES' },
          { cx: 0, cz: -250, type: 'HOUSES' },
          { cx: 0, cz: 250, type: 'TOWERS' }
        ];

        towns.forEach(t => {
          if (t.type === 'CAPITAL') {
            createTallBuilding(t.cx - 20, t.cz - 20);
            createTallBuilding(t.cx + 20, t.cz + 20);
            createWideHouse(t.cx + 25, t.cz - 25);
            createWideHouse(t.cx - 25, t.cz + 25);
          } else if (t.type === 'TOWERS') {
            createTallBuilding(t.cx, t.cz);
            createWideHouse(t.cx + 30, t.cz);
          } else {
            createWideHouse(t.cx, t.cz);
            createWideHouse(t.cx - 30, t.cz + 20);
          }
        });

        for (let i = 0; i < 20; i++) {
          let rx = (Math.random() - 0.5) * (MAP_SIZE - 100);
          let rz = (Math.random() - 0.5) * (MAP_SIZE - 100);
          let ry = getTerrainHeight(rx, rz);
          spawnChest(rx, ry + 0.2, rz);
        }
      }

      function spawnChest(x, y, z) {
        let boxGeo = new THREE.BoxGeometry(2, 1.5, 1.5);
        let boxMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 });
        let mesh = new THREE.Mesh(boxGeo, boxMat);
        mesh.position.set(x, y + 0.75, z);
        mesh.castShadow = true;
        scene.add(mesh);
        stageProps.push(mesh);
        chests.push({ mesh: mesh, x: x, y: y, z: z, opened: false });
      }

      function rebuildStage(mode) {
        stageProps.forEach(p => scene.remove(p)); stageProps = []; walls = []; destructibles = []; chests = [];
        if (currentGrid) scene.remove(currentGrid);
        if (terrainMesh) { scene.remove(terrainMesh); terrainMesh = null; }

        if (mode === 'BR') {
          createBRTerrainAndTowns();
          scene.fog = new THREE.FogExp2(0x87ceeb, 0.0035);
          renderer.setClearColor(0x87ceeb);
        } else if (mode === 'ZOMBIE') {
          floor.material.color.setHex(0x0a0505); 
          currentGrid = new THREE.GridHelper(120, 40, 0xff0000, 0x330000); 
          scene.fog = new THREE.FogExp2(0x1a0a0a, 0.02); 
          renderer.setClearColor(0x1a0a0a);

          // ゾンビモードの要塞（すべて非破壊：isDestructible = false）
          let zb = 50;
          createWall(100, 10, 2, 0, zb, null, false, texBrick);
          createWall(100, 10, 2, 0, -zb, null, false, texBrick);
          createWall(2, 10, 100, zb, 0, null, false, texBrick);
          createWall(2, 10, 100, -zb, 0, null, false, texBrick);

          let innerWalls = [
            {x: -18, z: -18}, {x: 18, z: 18}, {x: -18, z: 18}, {x: 18, z: -18},
            {x: 0, z: -15}, {x: 0, z: 15}, {x: -15, z: 0}, {x: 15, z: 0}
          ];
          innerWalls.forEach(p => { createWall(8, 6, 8, p.x, p.z, null, false, texBrick); });

          currentGrid.position.y = 0.01; scene.add(currentGrid);
        } else {
          floor.material.color.setHex(0x050a15); 
          currentGrid = new THREE.GridHelper(100, 40, 0x00a8ff, 0x002b47); 
          scene.fog = new THREE.FogExp2(0x050812, 0.015); 
          renderer.setClearColor(0x050812);
          
          // 1v1モードの構造物（すべて非破壊：isDestructible = false）
          createWall(4, 10, 4, 0, 0, null, false, texBrick); 
          createWall(10, 5, 2, -15, 5, null, false, texWood); 
          createWall(10, 5, 2, 15, -5, null, false, texWood);
          createWall(2, 8, 20, -25, 0, null, false, texBrick);
          createWall(2, 8, 20, 25, 0, null, false, texBrick);

          currentGrid.position.y = 0.01; scene.add(currentGrid);
        }
      }

      // 修正後の超精密な障害物当たり判定（プレイヤー胴体高度に基づく判定で建築物歩行を完全保証）
      function checkCollision(px, pz, radius, py = 0) {
        let pBottom = py + 0.4;
        let pTop = py + 2.2;

        for (let i = 0; i < walls.length; i++) {
          let w = walls[i];
          let wBottom = w.y - w.h/2;
          let wTop = w.y + w.h/2;

          // 胴体の高さが壁の高さ範囲内にある時のみ横衝突を検出！
          if (pTop <= wBottom || pBottom >= wTop - 0.05) {
            continue;
          }

          let minX = w.x - w.w/2 - radius;
          let maxX = w.x + w.w/2 + radius;
          let minZ = w.z - w.d/2 - radius;
          let maxZ = w.z + w.d/2 + radius;

          if (px > minX && px < maxX && pz > minZ && pz < maxZ) {
            return true;
          }
        }
        return false;
      }

      function startZombieMultiGameClient(room) {
        zombieSubMode = 'ONLINE';
        playerSlots = [saveData.equipped];
        currentSlotIndex = 0;
        let currentW = weaponStats[saveData.equipped];
        player.hp = 100; player.shield = 100; player.maxAmmo = currentW.maxAmmo; player.ammo = player.maxAmmo; player.isReloading = false; player.shootCooldownTimer = 0;
        currentWave = 0; totalKills = 0; meleeDamageTimer = 0;
        
        let myData = room.players.find(p => p.id === socket.id);
        let startPos = myData && myData.startPos ? myData.startPos : { x: 0, y: 0, z: 15 };
        
        playerPhys.x = startPos.x; playerPhys.y = startPos.y; playerPhys.z = startPos.z; playerPhys.vy = 0; playerPhys.isSkyDiving = false; playerPhys.isGliding = false;
        playerModel.gliderMesh.visible = false;
        playerModel.mesh.position.set(playerPhys.x, playerPhys.y, playerPhys.z);
        playerModel.mesh.visible = !isFirstPerson; 
        playerModel.equipWeaponVisual(saveData.equipped, currentW.color);

        playerBullets.forEach(b => scene.remove(b.mesh)); enemies.forEach(e => scene.remove(e.mesh));
        playerBullets = []; enemies = [];
        clearRemoteNametags();
        zombieMultiPlayers = [];

        room.players.forEach(p => {
          if (p.id !== socket.id) {
            let m = createRobloxModel(0x00f5d4, false);
            let pPos = p.startPos || { x: 0, y: 0, z: 15 };
            m.mesh.position.set(pPos.x, pPos.y, pPos.z);
            scene.add(m.mesh);

            let tag = document.createElement('div');
            tag.className = 'nametag';
            tag.innerText = p.name;
            container.appendChild(tag);

            let pWeapon = p.weapon || 'laser';
            m.equipWeaponVisual(pWeapon, weaponStats[pWeapon] ? weaponStats[pWeapon].color : 0x00ffff);

            zombieMultiPlayers.push({
              id: p.id, name: p.name, model: m, mesh: m.mesh, tagEl: tag,
              targetPosition: m.mesh.position.clone(), targetYaw: 0, targetPitch: 0
            });
          }
        });

        menuOverlay.style.display = 'none'; hud.style.display = 'block'; crosshair.style.display = 'block'; viewIndicator.style.display='block';
        gameState = 'PLAYING'; renderer.domElement.requestPointerLock();
        updateInventoryUI();

        if (isZombieHost) {
          startNextWave();
        }
      }

      function clearRemoteNametags() {
        zombieMultiPlayers.forEach(p => {
          if (p.tagEl) p.tagEl.remove();
          if (p.mesh) scene.remove(p.mesh);
        });
        zombieMultiPlayers = [];
      }

      function startNextWave() {
        if (gameState !== 'PLAYING') return;
        currentWave++;
        showCentralMessage(`WAVE ${currentWave} START!`, "#ff3b30", 2000);
        
        if (selectedMode === 'ZOMBIE' && zombieSubMode === 'ONLINE' && isZombieHost) {
          socket.emit('zombie_wave_change', { roomId: currentRoomId, wave: currentWave });
        }

        let count = Math.round(4 + currentWave * 2.5);
        for(let i = 0; i < count; i++) { spawnZombie(); }
        updateHUD();
      }

      function spawnZombie() {
        let ex = 0, ez = -20;
        for (let i = 0; i < 50; i++) {
          let candX = (Math.random() - 0.5) * 70;
          let candZ = (Math.random() - 0.5) * 70;
          if (Math.hypot(candX - playerPhys.x, candZ - playerPhys.z) > 15 && !checkCollision(candX, candZ, 1.2, 0)) {
            ex = candX; ez = candZ; break;
          }
        }
        let modelData = createRobloxModel(0x2d6a4f, true); 
        modelData.mesh.position.set(ex, 0, ez); scene.add(modelData.mesh);
        enemies.push({ 
          id: 'zombie_' + Math.random().toString(36).substr(2, 9),
          model: modelData, mesh: modelData.mesh, radius: 1.1, hp: 4 + currentWave * 1.5, maxHp: 4 + currentWave * 1.5,
          speed: 0.06 + Math.random() * 0.04, damage: 10, isRival: false
        });
      }

      function start1v1Game() { 
        saveData.equipped = 'laser'; // 1v1強制初期レーザー

      function startOnlineMatchmaking() {
        saveData.equipped = 'laser'; // 1v1強制初期レーザー
        menuOverlay.innerHTML = `
          <h2 style="font-size:36px; color:#39ff14; font-family:'Permanent Marker', cursive; margin-top:80px;">🌐 SEARCHING FOR OPPONENT...</h2>

      function setupOnlineRound(data) {

      socket.on('opponent_update', (data) => {

              id: socket.id, roomId: currentRoomId, x: playerPhys.x, y: playerPhys.y, z: playerPhys.z, yaw: yaw, pitch: pitch, moving: moving, hp: player.hp, shield: player.shield
            });

            });

      socket.on('zombie_remote_player_update', (data) => {
        let teammate = zombieMultiPlayers.find(p => p.id === data.id);
        if (teammate) {

      socket.on('zombie_remote_player_shoot', (data) => {
        let bGeo = new THREE.CylinderGeometry(0.06, 0.06, 1.2, 4);

      });

      socket.on('zombie_client_state_update', (data) => {
        if (!isZombieHost && selectedMode === 'ZOMBIE') {
          data.zombies.forEach(z => {
            let existing = enemies.find(e => e.id === z.id);
            if (existing) {

              existing.hp = z.hp;
            } else {
              let modelData = createRobloxModel(0x2d6a4f, true); 
              modelData.mesh.position.set(z.x, z.y, z.z); scene.add(modelData.mesh);
              enemies.push({ id: z.id, model: modelData, mesh: modelData.mesh, radius: 1.1, hp: z.hp, maxHp: z.maxHp, speed: 0.06, isRival: false });
            }
          });
        }
      });

      socket.on('zombie_take_damage', (data) => {
        let z = enemies.find(e => e.id === data.zombieId);
        if (z) {
          z.hp -= data.dmg;
          createFortniteDamageText(data.dmg, new THREE.Vector3(data.hitPos.x, data.hitPos.y, data.hitPos.z), data.isHeadshot);
          if (z.hp <= 0) {
            scene.remove(z.mesh);
            enemies = enemies.filter(e => e !== z);
            totalKills++; saveData.coins += 12; updateHUD();
            if (enemies.length === 0 && isZombieHost) startNextWave();
          }
        }
      });

      socket.on('zombie_new_wave', (data) => {
        if (!isZombieHost) {
          currentWave = data.wave;
          showCentralMessage(`WAVE ${currentWave} START!`, "#ff3b30", 2000);
          updateHUD();
        }
      });

      socket.on('opponent_shoot', (data) => {
        let bGeo = new THREE.CylinderGeometry(0.06, 0.06, 1.2, 4);
        let rbMesh = new THREE.Mesh(bGeo, new THREE.MeshBasicMaterial({ color: data.color || 0xff0000 }));
        rbMesh.position.set(data.pos.x, data.pos.y, data.pos.z);
        rbMesh.rotation.set(data.rot.x, data.rot.y, data.rot.z);
        scene.add(rbMesh);
        playerBullets.push({ mesh: rbMesh, direction: new THREE.Vector3(data.dir.x, data.dir.y, data.dir.z), dmg: data.dmg, speed: data.speed, life: 60, shooterId: 'online_opponent' });
      });

      socket.on('take_damage', (data) => {
        if (isRoundEnding) return;
        triggerDamageFlash();
        let dAmount = data.dmg * 10;
        if (player.shield > 0) { player.shield -= dAmount; if (player.shield < 0) { player.hp += player.shield; player.shield = 0; } } 
        else { player.hp -= dAmount; }
        updateHUD();

        if (player.hp <= 0 && !isRoundEnding) {
          isRoundEnding = true;
          if (selectedMode === 'BR') showGameOverMenu();
          else socket.emit('round_win', { roomId: currentRoomId });
        }
      });

      socket.on('building_damaged', (data) => {
        if (selectedMode !== 'BR') return; // BR以外は壊れない
        let w = destructibles[data.index];
        if (w) {
          w.hp -= data.dmg;
          if (w.hp <= 0) {
            scene.remove(w.mesh);
            walls = walls.filter(item => item !== w);
            destructibles = destructibles.filter(item => item !== w);
          }
        }
      });

      socket.on('chest_opened', (data) => {
        let c = chests[data.index];
        if (c && !c.opened) {
          c.opened = true;
          c.mesh.material.color.setHex(0x444444);
        }
      });

      socket.on('round_complete', (data) => {
        if (data.winnerId === socket.id) playerWins++; else rivalWins++;
        if (playerWins >= 3 || rivalWins >= 3) showGameOverMenu();
        else { duelRound = data.nextRound; setupOnlineRound(null); }
      });

      socket.on('opponent_disconnected', () => {
        if (gameState === 'PLAYING' && selectedMode !== 'BR') { alert('対戦相手が切断しました。'); showModeSelectMenu(); }
      });

      function handlePlayerShooting() {
        if (!isMouseDown || player.isReloading || player.ammo <= 0 || player.shootCooldownTimer > 0) return;
        let currentW = weaponStats[saveData.equipped];
        player.ammo--; player.shootCooldownTimer = currentW.shootInterval; updateHUD();
        
        let camDir = new THREE.Vector3(); camera.getWorldDirection(camDir);
        let targetPoint = new THREE.Vector3().copy(camera.position).addScaledVector(camDir, 60);
        let muzzleWorldPos = new THREE.Vector3(); playerModel.rightArmGroup.getWorldPosition(muzzleWorldPos);

        let bGeo = (saveData.equipped === 'plasma' || saveData.equipped === 'blizzard') ? new THREE.SphereGeometry(currentW.size, 8, 8) : new THREE.CylinderGeometry(currentW.size, currentW.size, 1.5, 4);
        let bulletDirection = new THREE.Vector3().subVectors(targetPoint, muzzleWorldPos).normalize();

        if (saveData.equipped === 'flame') {
          for(let k=0; k<2; k++) {
            let bMesh = new THREE.Mesh(new THREE.SphereGeometry(currentW.size, 6, 6), new THREE.MeshBasicMaterial({ color: 0xff4500, transparent: true, opacity: 0.8 }));
            bMesh.position.copy(muzzleWorldPos);
            let spreadDir = bulletDirection.clone(); spreadDir.x += (Math.random() - 0.5) * 0.2; spreadDir.z += (Math.random() - 0.5) * 0.2; spreadDir.normalize();
            scene.add(bMesh); playerBullets.push({ mesh: bMesh, direction: spreadDir, dmg: currentW.dmg, speed: currentW.speed, life: 25, isFlame: true, shooterId: socket.id });
          }
        } else if (saveData.equipped === 'shotgun') {
          [-0.12, 0, 0.12].forEach(angle => {
            let spreadDir = bulletDirection.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), angle).normalize();
            let bMesh = new THREE.Mesh(new THREE.CylinderGeometry(currentW.size, currentW.size, 1.2, 4), new THREE.MeshBasicMaterial({ color: currentW.color }));
            bMesh.position.copy(muzzleWorldPos); 
            bMesh.lookAt(muzzleWorldPos.clone().add(spreadDir)); 
            bMesh.rotateX(Math.PI / 2);
            scene.add(bMesh); 
            playerBullets.push({ mesh: bMesh, direction: spreadDir, dmg: currentW.dmg, speed: currentW.speed, life: 40, shooterId: socket.id });
          });
        } else {
          let bMesh = new THREE.Mesh(bGeo, new THREE.MeshBasicMaterial({ color: currentW.color }));
          bMesh.position.copy(muzzleWorldPos); bMesh.lookAt(targetPoint);
          if(!(saveData.equipped === 'plasma' || saveData.equipped === 'blizzard')) bMesh.rotateX(Math.PI / 2);
          scene.add(bMesh); playerBullets.push({ mesh: bMesh, direction: bulletDirection, dmg: currentW.dmg, speed: currentW.speed, life: 60, isPierce: currentW.isPierce, shooterId: socket.id });
        }

        if (currentRoomId) {
          if (selectedMode === 'ZOMBIE' && zombieSubMode === 'ONLINE') {
            socket.emit('zombie_player_shoot_sync', {
              roomId: currentRoomId, pos: muzzleWorldPos, dir: bulletDirection, rot: playerModel.rightArmGroup.rotation, dmg: currentW.dmg, speed: currentW.speed, color: currentW.color, shooterId: socket.id
            });
          } else {
            socket.emit('player_shoot', {
              roomId: currentRoomId, pos: muzzleWorldPos, dir: bulletDirection, rot: playerModel.rightArmGroup.rotation, dmg: currentW.dmg, speed: currentW.speed, color: currentW.color
            });
          }
        }

        if (player.ammo <= 0) triggerReload();
      }

      function triggerReload() { if(!player.isReloading && player.ammo < player.maxAmmo) { player.isReloading = true; player.reloadTimer = weaponStats[saveData.equipped].reloadTime; updateHUD(); } }

      let keys = {}; let baseSpeed = 0.23; let yaw = 0, pitch = -0.05;
      container.addEventListener('contextmenu', e => e.preventDefault());
      renderer.domElement.addEventListener('click', () => { if (gameState === 'PLAYING') renderer.domElement.requestPointerLock(); });

      document.addEventListener('mousemove', (e) => {
        if (gameState === 'PLAYING' && document.pointerLockElement === renderer.domElement) {
          let sens = isAiming ? 0.0012 : 0.0024;
          yaw -= e.movementX * sens; pitch -= e.movementY * sens * 0.8;
          pitch = Math.max(-Math.PI/4, Math.min(Math.PI/4, pitch));
        }
      });

      window.addEventListener('keydown', (e) => { 
        if (gameState === 'KEYCONFIG' || gameState === 'NAME_INPUT') return; 
        keys[e.code] = true; 
        if(gameState === 'PLAYING') {
          if (selectedMode !== '1V1') {
            if (e.code === 'Digit1') switchWeaponSlot(0);
            if (e.code === 'Digit2') switchWeaponSlot(1);
            if (e.code === 'Digit3') switchWeaponSlot(2);
            if (e.code === 'Digit4') switchWeaponSlot(3);
            if (e.code === 'Digit5') switchWeaponSlot(4);
          }

          if (e.code === saveData.keyMap.reload) triggerReload();

          if (e.code === saveData.keyMap.jump) {
            if (playerPhys.isSkyDiving && !playerPhys.isGliding) {
              playerPhys.isGliding = true;
              playerModel.gliderMesh.visible = true;
              showCentralMessage("🪂 グライダー展開！", "#00f5d4", 1500);
            } else if (playerPhys.isGrounded) {
              playerPhys.vy = 0.24; playerPhys.isGrounded = false;
            }
          }

          if (e.code === saveData.keyMap.switchView) { isFirstPerson = !isFirstPerson; playerModel.mesh.visible = !isFirstPerson; updateHUD(); }
          
          if (e.code === saveData.keyMap.interact && selectedMode === 'BR') {
            chests.forEach((c, idx) => {
              if (!c.opened && Math.hypot(c.x - playerPhys.x, c.y - playerPhys.y, c.z - playerPhys.z) < 3.8) {
                c.opened = true;
                c.mesh.material.color.setHex(0x444444);
                
                let randomWeapons = ['minigun', 'sniper', 'shotgun', 'revolver', 'plasma', 'voidray', 'flame'];
                let rewardWeapon = randomWeapons[Math.floor(Math.random() * randomWeapons.length)];
                
                addWeaponToInventory(rewardWeapon);

                player.hp = Math.min(100, player.hp + 40);
                player.shield = 100;
                
                showCentralMessage(`📦 ${weaponStats[rewardWeapon].name} 入手 & 回復!`, "#ffd700", 2000);

                if (currentRoomId) socket.emit('chest_open', { roomId: currentRoomId, index: idx });
              }
            });
          }
        }
      });

      window.addEventListener('keyup', (e) => { keys[e.code] = false; });
      window.addEventListener('mousedown', (e) => { if (gameState === 'PLAYING') { if (e.button === 0) isMouseDown = true; if (e.button === 2) isAiming = true; } });
      window.addEventListener('mouseup', (e) => { if (e.button === 0) isMouseDown = false; if (e.button === 2) isAiming = false; });

      let clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        let dt = clock.getDelta();

        if (gameState === 'PLAYING') {
          let gravity = playerPhys.isGliding ? 0.003 : 0.015;
          playerPhys.vy -= gravity;
          if (playerPhys.isGliding) playerPhys.vy = Math.max(playerPhys.vy, -0.12);

          let nextY = playerPhys.y + playerPhys.vy;
          let terrainY = getTerrainHeight(playerPhys.x, playerPhys.z);
          let highestSurfaceY = terrainY;

          // 建築物の上（屋根・床）に確実に登って歩ける完璧な足元物理処理
          walls.forEach(w => {
            let minX = w.x - w.w/2;
            let maxX = w.x + w.w/2;
            let minZ = w.z - w.d/2;
            let maxZ = w.z + w.d/2;
            let topY = w.y + w.h/2;
            let bottomY = w.y - w.h/2;

            if (playerPhys.x >= minX - playerPhys.radius * 0.4 && playerPhys.x <= maxX + playerPhys.radius * 0.4 &&
                playerPhys.z >= minZ - playerPhys.radius * 0.4 && playerPhys.z <= maxZ + playerPhys.radius * 0.4) {
              
              if (playerPhys.y >= topY - 1.2 && topY > highestSurfaceY) {
                highestSurfaceY = topY;
              }
              if (nextY + 2.4 > bottomY && playerPhys.y + 2.4 <= bottomY) {
                playerPhys.vy = 0;
                nextY = bottomY - 2.45;
              }
            }
          });

          playerPhys.y = nextY;

          if (playerPhys.y <= highestSurfaceY) {
            playerPhys.y = highestSurfaceY;
            playerPhys.vy = 0;
            playerPhys.isGrounded = true;

            if (playerPhys.isSkyDiving) {
              if (!playerPhys.isGliding) {
                player.hp = 0;
                updateHUD();
                showCentralMessage("💀 落下死！(グライダー不使用)", "#ff0000", 3000);
                setTimeout(() => { showGameOverMenu(); }, 1200);
              }
              playerPhys.isSkyDiving = false;
              playerPhys.isGliding = false;
              playerModel.gliderMesh.visible = false;
            }
          }

          if (player.reloadTimer > 0) { player.reloadTimer--; if (player.reloadTimer <= 0) { player.isReloading = false; player.ammo = player.maxAmmo; updateHUD(); } }
          if (player.shootCooldownTimer > 0) player.shootCooldownTimer--;
          if (meleeDamageTimer > 0) meleeDamageTimer--;

          handlePlayerShooting();

          let mSpeed = keys[saveData.keyMap.dash] ? baseSpeed * 1.5 : baseSpeed;
          if (playerPhys.isGliding) mSpeed *= 1.8;

          let forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw).normalize();
          let side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw).normalize();
          let nextX = playerPhys.x; let nextZ = playerPhys.z; let moving = false;
          
          if (keys[saveData.keyMap.forward]) { nextX += forward.x * mSpeed; nextZ += forward.z * mSpeed; moving = true; }
          if (keys[saveData.keyMap.backward]) { nextX -= forward.x * mSpeed; nextZ -= forward.z * mSpeed; moving = true; }
          if (keys[saveData.keyMap.left]) { nextX -= side.x * mSpeed; nextZ -= side.z * mSpeed; moving = true; }
          if (keys[saveData.keyMap.right]) { nextX += side.x * mSpeed; nextZ += side.z * mSpeed; moving = true; }
          
          let curGround = getTerrainHeight(playerPhys.x, playerPhys.z);
          let nextGround = getTerrainHeight(nextX, nextZ);
          let slopeDiff = nextGround - curGround;

          if (slopeDiff < 1.8) {
            if (!checkCollision(nextX, playerPhys.z, playerPhys.radius, playerPhys.y)) playerPhys.x = nextX;
            if (!checkCollision(playerPhys.x, nextZ, playerPhys.radius, playerPhys.y)) playerPhys.z = nextZ;
          }

          playerModel.mesh.position.set(playerPhys.x, playerPhys.y, playerPhys.z);
          playerModel.mesh.rotation.y = yaw;
          playerModel.rightArmGroup.rotation.x = pitch; 

          if (selectedMode === 'BR') {
            let nearChest = chests.some(c => !c.opened && Math.hypot(c.x - playerPhys.x, c.y - playerPhys.y, c.z - playerPhys.z) < 3.8);
            lootPrompt.style.display = nearChest ? 'block' : 'none';
            gliderPrompt.style.display = (playerPhys.isSkyDiving && !playerPhys.isGliding) ? 'block' : 'none';
          }

          // オンライン他プレイヤーの動的補間
          enemies.forEach(e => {
            if (e.isOnline) {
              e.mesh.position.lerp(e.targetPosition, 0.2);
              e.mesh.rotation.y += (e.targetYaw - e.mesh.rotation.y) * 0.2;
              e.model.rightArmGroup.rotation.x += (e.targetPitch - e.model.rightArmGroup.rotation.x) * 0.2;
            }
          });

          // ゾンビマルチの味方プレイヤー同期 & ネームタグ描画
          zombieMultiPlayers.forEach(p => {
            p.mesh.position.lerp(p.targetPosition, 0.25);
            p.mesh.rotation.y += (p.targetYaw - p.mesh.rotation.y) * 0.2;
            p.model.rightArmGroup.rotation.x += (p.targetPitch - p.model.rightArmGroup.rotation.x) * 0.2;

            let tagPos = p.mesh.position.clone(); tagPos.y += 3.2;
            let vector = tagPos.project(camera);
            if (vector.z < 1.0) {
              let x = (vector.x * .5 + .5) * window.innerWidth;
              let y = (-(vector.y * .5) + .5) * window.innerHeight;
              p.tagEl.style.left = `${x}px`; p.tagEl.style.top = `${y}px`;
              p.tagEl.style.display = 'block';
            } else {
              p.tagEl.style.display = 'none';
            }
          });

          let time = Date.now() * 0.012;
          if (moving) {
            playerModel.leftLeg.rotation.x = Math.sin(time) * 0.6; playerModel.rightLeg.rotation.x = -Math.sin(time) * 0.6; playerModel.leftArmGroup.rotation.x = -Math.sin(time) * 0.5;
          } else {
            playerModel.leftLeg.rotation.x = 0; playerModel.rightLeg.rotation.x = 0; playerModel.leftArmGroup.rotation.x = 0;
          }

          let sideOff = isAiming ? 0.9 : 1.4; let heightOff = isAiming ? 2.1 : 2.5; let actDist = isAiming ? cameraDist * 0.55 : cameraDist; 
          let camPosOff = new THREE.Vector3(sideOff, heightOff, actDist).applyAxisAngle(new THREE.Vector3(1, 0, 0), pitch).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
          if (isFirstPerson) camera.position.set(playerPhys.x, playerPhys.y + 2.4, playerPhys.z);
          else camera.position.copy(playerModel.mesh.position).add(camPosOff);
          camera.lookAt(new THREE.Vector3().copy(camera.position).addScaledVector(new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(1, 0, 0), pitch).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw), 20));

          updateDamageTexts(dt);

          // 弾の物理・ヒット判定
          for (let i = playerBullets.length - 1; i >= 0; i--) {
            let b = playerBullets[i];
            let oldPos = b.mesh.position.clone();
            let moveVec = b.direction.clone().multiplyScalar(b.speed);
            let newPos = oldPos.clone().add(moveVec);
            b.mesh.position.copy(newPos);
            b.life--;

            let steps = Math.max(1, Math.ceil(b.speed / 0.8));
            let hitSomething = false;

            for (let s = 1; s <= steps; s++) {
              if (hitSomething) break;
              let samplePos = oldPos.clone().lerp(newPos, s / steps);

              // 1. 壁・建物の破壊判定（BRモードのみ破壊可能）
              if (selectedMode === 'BR') {
                for (let wIdx = 0; wIdx < destructibles.length; wIdx++) {
                  let w = destructibles[wIdx];
                  if (w.isDestructible && Math.abs(samplePos.x - w.x) < w.w/2 + 0.2 &&
                      Math.abs(samplePos.z - w.z) < w.d/2 + 0.2 &&
                      Math.abs(samplePos.y - w.y) < w.h/2 + 0.2) {
                    
                    hitSomething = true;
                    b.life = 0;
                    w.hp -= b.dmg;
                    createFortniteDamageText(b.dmg * 0.5, samplePos, false);

                    if (w.hp <= 0) {
                      scene.remove(w.mesh);
                      walls = walls.filter(item => item !== w);
                      destructibles = destructibles.filter(item => item !== w);
                    }

                    if (currentRoomId) {
                      socket.emit('building_damage', { roomId: currentRoomId, index: wIdx, dmg: b.dmg });
                    }
                    break;
                  }
                }
              }

              if (hitSomething && !b.isPierce) break;

              // 2. 敵 / ゾンビへの正確な当たり判定
              for (let j = enemies.length - 1; j >= 0; j--) {
                let e = enemies[j];
                if (b.shooterId === e.id) continue;

                let ePos = e.mesh.position;
                let dx = samplePos.x - ePos.x;
                let dz = samplePos.z - ePos.z;
                let distXZ = Math.hypot(dx, dz);
                let dy = samplePos.y - ePos.y;

                if (distXZ < (e.radius || 1.1) && dy >= -0.2 && dy <= 2.8) {
                  hitSomething = true;
                  let isHead = !b.isFlame && (dy >= 2.0);
                  let damage = isHead ? b.dmg * 2 : b.dmg;
                  
                  if (!b.isFlame && !b.isPierce) b.life = 0;

                  if (selectedMode === 'ZOMBIE' && zombieSubMode === 'ONLINE') {
                    socket.emit('zombie_hit_server', { roomId: currentRoomId, zombieId: e.id, dmg: damage, hitPos: samplePos, isHeadshot: isHead });
                  } else if (e.isOnline && b.shooterId === socket.id) {
                    createFortniteDamageText(b.dmg, samplePos, isHead);
                    socket.emit('player_hit', { roomId: currentRoomId, dmg: damage });
                  } else {
                    createFortniteDamageText(b.dmg, samplePos, isHead);
                    if (!isRoundEnding) {
                      e.hp -= damage;
                      if (e.hp <= 0) {
                        scene.remove(e.mesh);
                        enemies.splice(j, 1);
                        if (selectedMode === 'BR') {
                          updateHUD();
                          if (enemies.length === 0 && player.hp > 0) showGameOverMenu();
                        } else if (e.isRival) {
                          if (!isRoundEnding) {
                            isRoundEnding = true; playerWins++;
                            if(playerWins >= 3 || rivalWins >= 3) showGameOverMenu(); else { duelRound++; setup1v1Round(); }
                          }
                        } else {
                          totalKills++; saveData.coins += 12; player.shield = Math.min(player.maxShield, player.shield + 4); updateHUD();
                          if(enemies.length === 0 && (zombieSubMode === 'SOLO' || isZombieHost)) startNextWave();
                        }
                      }
                    }
                  }
                  break;
                }
              }

              // 3. 自プレイヤー受弾判定
              if (b.shooterId !== socket.id && b.shooterId !== 'player' && !hitSomething) {
                let pPos = playerModel.mesh.position;
                let dx = samplePos.x - pPos.x;
                let dz = samplePos.z - pPos.z;
                let distXZ = Math.hypot(dx, dz);
                let dy = samplePos.y - pPos.y;

                if (distXZ < 1.1 && dy >= -0.2 && dy <= 2.8) {
                  hitSomething = true;
                  b.life = 0;
                  triggerDamageFlash();
                  let dAmount = b.dmg * 10;
                  if (player.shield > 0) { player.shield -= dAmount; if(player.shield < 0) { player.hp += player.shield; player.shield = 0; } }
                  else { player.hp -= dAmount; }
                  updateHUD();
                  if (player.hp <= 0 && !isRoundEnding) {
                    isRoundEnding = true;
                    showGameOverMenu();
                  }
                }
              }
            }

            if (!hitSomething && checkCollision(b.mesh.position.x, b.mesh.position.z, 0.2, b.mesh.position.y)) b.life = 0;
            if (b.life <= 0) { scene.remove(b.mesh); playerBullets.splice(i, 1); }
          }

          // CP (BOT) AI ロジック
          enemies.forEach(e => {
            if (e.isRival && !e.isOnline) {
              let botTerrainY = getTerrainHeight(e.mesh.position.x, e.mesh.position.z);
              let botSurfaceY = botTerrainY;

              walls.forEach(w => {
                if (e.mesh.position.x >= w.x - w.w/2 - 0.2 && e.mesh.position.x <= w.x + w.w/2 + 0.2 &&
                    e.mesh.position.z >= w.z - w.d/2 - 0.2 && e.mesh.position.z <= w.z + w.d/2 + 0.2) {
                  let topY = w.y + w.h/2;
                  if (e.mesh.position.y >= topY - 1.0 && topY > botSurfaceY) {
                    botSurfaceY = topY;
                  }
                }
              });

              if (e.mesh.position.y > botSurfaceY) {
                e.mesh.position.y -= 0.6;
                if (e.mesh.position.y < botSurfaceY) e.mesh.position.y = botSurfaceY;
              } else {
                e.mesh.position.y = botSurfaceY;
              }

              let targetObj = { pos: playerModel.mesh.position.clone(), isPlayer: true };
              let minDistance = e.mesh.position.distanceTo(targetObj.pos);

              if (selectedMode === 'BR') {
                enemies.forEach(other => {
                  if (other !== e) {
                    let dist = e.mesh.position.distanceTo(other.mesh.position);
                    if (dist < minDistance) {
                      minDistance = dist;
                      targetObj = { pos: other.mesh.position.clone(), isPlayer: false };
                    }
                  }
                });
              }

              let pPos = targetObj.pos;
              let rPos = e.mesh.position.clone();
              let pDir = new THREE.Vector3().subVectors(pPos, rPos); pDir.y = 0;
              let dist = pDir.length(); pDir.normalize();

              e.dirChangeTimer -= dt;
              if(e.dirChangeTimer <= 0) {
                e.dirChangeTimer = 0.8 + Math.random() * 1.2;
                let moveDir;
                if(dist > 30) moveDir = pDir.clone(); 
                else if(dist < 10) moveDir = pDir.clone().negate(); 
                else {
                  let rightVec = new THREE.Vector3(-pDir.z, 0, pDir.x);
                  moveDir = rightVec.multiplyScalar(Math.random() > 0.5 ? 1 : -1).addScaledVector(pDir, 0.2).normalize();
                }
                e.vx = moveDir.x * e.speed; e.vz = moveDir.z * e.speed;
              }

              let nX = e.mesh.position.x + e.vx; let nZ = e.mesh.position.z + e.vz;
              if (!checkCollision(nX, e.mesh.position.z, e.radius, e.mesh.position.y)) e.mesh.position.x = nX;
              if (!checkCollision(e.mesh.position.x, nZ, e.radius, e.mesh.position.y)) e.mesh.position.z = nZ;
              
              e.mesh.lookAt(pPos.x, e.mesh.position.y, pPos.z);
              e.model.leftLeg.rotation.x = Math.sin(time * 1.5) * 0.5; e.model.rightLeg.rotation.x = -Math.sin(time * 1.5) * 0.5;
              e.model.rightArmGroup.rotation.x = Math.atan2(pPos.y - 1.4, dist);

              e.shootTimer += dt;
              if (e.shootTimer >= 0.6) { 
                e.shootTimer = 0;
                let rMuzzle = new THREE.Vector3(); e.model.rightArmGroup.getWorldPosition(rMuzzle);
                let rbMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 1.2, 4), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
                rbMesh.position.copy(rMuzzle); rbMesh.lookAt(pPos.clone().add(new THREE.Vector3(0, 1.4, 0))); rbMesh.rotateX(Math.PI/2);
                scene.add(rbMesh);
                let bulletDir = new THREE.Vector3().subVectors(pPos.clone().add(new THREE.Vector3(0, 1.2, 0)), rMuzzle).normalize();
                bulletDir.x += (Math.random()-0.5)*0.06; bulletDir.z += (Math.random()-0.5)*0.06; bulletDir.normalize();
                playerBullets.push({ mesh: rbMesh, direction: bulletDir, dmg: 1.5, speed: 1.6, life: 65, shooterId: e.id });
              }
            } else if (!e.isRival) {
              // ゾンビAI：一番近いプレイヤー（自分またはマルチの味方）をターゲットにする
              let closestTargetPos = playerModel.mesh.position.clone();
              let minDist = e.mesh.position.distanceTo(closestTargetPos);

              zombieMultiPlayers.forEach(p => {
                let d = e.mesh.position.distanceTo(p.mesh.position);
                if (d < minDist) {
                  minDist = d;
                  closestTargetPos = p.mesh.position.clone();
                }
              });

              let dir = new THREE.Vector3().subVectors(closestTargetPos, e.mesh.position); dir.y = 0; let dist = dir.length(); dir.normalize();
              let nX = e.mesh.position.x + dir.x * e.speed; let nZ = e.mesh.position.z + dir.z * e.speed;
              if (!checkCollision(nX, e.mesh.position.z, e.radius, e.mesh.position.y)) e.mesh.position.x = nX;
              if (!checkCollision(e.mesh.position.x, nZ, e.radius, e.mesh.position.y)) e.mesh.position.z = nZ;
              
              e.mesh.lookAt(closestTargetPos.x, e.mesh.position.y, closestTargetPos.z);
              e.model.leftLeg.rotation.x = Math.sin(time * 1.2) * 0.6; e.model.rightLeg.rotation.x = -Math.sin(time * 1.2) * 0.6;
              e.model.leftArmGroup.rotation.set(0.8, 0, 0); e.model.rightArmGroup.rotation.set(0.8, 0, 0);

              if (dist < 1.3 && meleeDamageTimer <= 0 && closestTargetPos.distanceTo(playerModel.mesh.position) < 0.1) {
                triggerDamageFlash();
                let dAmount = e.damage;
                if (player.shield > 0) { player.shield -= dAmount; if (player.shield < 0) { player.hp += player.shield; player.shield = 0; } } 
                else { player.hp -= dAmount; }
                meleeDamageTimer = 25; updateHUD(); if (player.hp <= 0) showGameOverMenu();
              }
            }
          });
        }
        renderer.render(scene, camera);
      }

      if (saveData.playerName) showModeSelectMenu(); else showNameInputMenu();
      animate();
      window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    })();
  </script>
</body>
