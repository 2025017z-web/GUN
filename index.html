      function createNoiseCanvas(w, h, noiseFunc) {
        let cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        let ctx = cv.getContext('2d');
        let img = ctx.createImageData(w, h);
        for(let y=0; y<h; y++) {
          for(let x=0; x<w; x++) {
            let idx = (y*w + x)*4;
            let c = noiseFunc(x, y, w, h);
            img.data[idx] = c.r; img.data[idx+1] = c.g; img.data[idx+2] = c.b; img.data[idx+3] = c.a !== undefined ? c.a : 255;
          }
        }
        ctx.putImageData(img, 0, 0);
        return cv;
      }

      function generateUltraGrassTexture() {
        let cv = createNoiseCanvas(512, 512, (x, y, w, h) => {
          let noise = (Math.sin(x*0.1) + Math.cos(y*0.1)) * 20;
          let r = 30 + Math.random()*25 + noise;
          let g = 110 + Math.random()*50 + noise;
          let b = 35 + Math.random()*20;
          return { r: r, g: g, b: b };
        });
        let tex = new THREE.CanvasTexture(cv);
        tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(100, 100);
        return tex;
      }

      function generateUltraRockTexture() {
        let cv = createNoiseCanvas(512, 512, (x, y) => {
          let v = Math.floor(100 + Math.random()*60 + (Math.sin(x*0.05)*Math.cos(y*0.05)*40));
          return { r: v, g: v, b: v + 5 };
        });
        let tex = new THREE.CanvasTexture(cv);
        tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
        return tex;
      }

      function generateUltraBrickTexture() {
        let cv = document.createElement('canvas'); cv.width = 512; cv.height = 512;
        let ctx = cv.getContext('2d');
        ctx.fillStyle = '#4a1e17'; ctx.fillRect(0,0,512,512);
        ctx.fillStyle = '#22110e';
        for(let y=0; y<512; y+=32) {
          ctx.fillRect(0, y, 512, 4);
          let offset = (y/32)%2 === 0 ? 0 : 32;
          for(let x=offset; x<512; x+=64) {
            ctx.fillRect(x, y, 4, 32);
          }
        }
        // Add noise
        let img = ctx.getImageData(0,0,512,512);
        for(let i=0; i<img.data.length; i+=4) {
          let n = (Math.random() - 0.5) * 25;
          img.data[i] = Math.min(255, Math.max(0, img.data[i] + n));
          img.data[i+1] = Math.min(255, Math.max(0, img.data[i+1] + n));
          img.data[i+2] = Math.min(255, Math.max(0, img.data[i+2] + n));
        }
        ctx.putImageData(img, 0, 0);
        let tex = new THREE.CanvasTexture(cv);
        tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
        return tex;
      }

      function generateUltraWoodTexture() {
        let cv = createNoiseCanvas(512, 512, (x, y) => {
          let grain = Math.sin(y * 0.15 + Math.sin(x * 0.02) * 3) * 30;
          let r = 130 + grain + (Math.random()-0.5)*10;
          let g = 80 + grain*0.7 + (Math.random()-0.5)*10;
          let b = 45 + grain*0.4;
          return { r: r, g: g, b: b };
        });
        let tex = new THREE.CanvasTexture(cv);
        tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
        return tex;
      }

      function createGliderMesh() {
        let gliderGroup = new THREE.Group();
        let wingGeo = new THREE.ConeGeometry(1.6, 1.0, 5);
        let wingMat = new THREE.MeshStandardMaterial({ color: 0x00f5d4, roughness: 0.3, metalness: 0.7 });
        let wing = new THREE.Mesh(wingGeo, wingMat);
        wing.rotation.x = Math.PI / 2;
        wing.scale.set(1.4, 0.12, 0.9);
        gliderGroup.add(wing);

        let barGeo = new THREE.CylinderGeometry(0.05, 0.05, 1.4);
        let barMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9 });
        let bar = new THREE.Mesh(barGeo, barMat);
        bar.rotation.z = Math.PI / 2;
        bar.position.set(0, -0.4, 0.1);
        gliderGroup.add(bar);

        gliderGroup.position.set(0, 2.3, 0);
        gliderGroup.visible = false;
        return gliderGroup;
      }

      function buildGunMesh(weaponKey, colorHex) {
        let gunGroup = new THREE.Group();
        let mainMat = new THREE.MeshStandardMaterial({ color: 0x1a1a24, roughness: 0.2, metalness: 0.8 });
        let accentMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.3, metalness: 0.7 });
        let glowMat = new THREE.MeshBasicMaterial({ color: colorHex });

        let dBody = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.22, 0.7), mainMat); 
        dBody.position.set(0, 0.1, -0.2);
        
        let dBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.5), accentMat); 
        dBarrel.rotation.x = Math.PI/2; 
        dBarrel.position.set(0, 0.12, -0.6); 
        dBody.add(dBarrel);

        let scope = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.25), glowMat);
        scope.rotation.x = Math.PI/2;
        scope.position.set(0, 0.26, -0.2);
        dBody.add(scope);

        gunGroup.add(dBody);
        return gunGroup;
      }

      function createTacticalRobloxModel(colorHex, isEnemy = false) {
        let rootGroup = new THREE.Group();
        let bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.5, metalness: 0.3 });
        let armorMat = new THREE.MeshStandardMaterial({ color: isEnemy ? 0x221111 : 0x1a2536, roughness: 0.3, metalness: 0.6 });
        let visorMat = new THREE.MeshStandardMaterial({ color: isEnemy ? 0xff0022 : 0x00f5d4, roughness: 0.1, metalness: 0.9, emissive: isEnemy ? 0x440000 : 0x003333 });

        let head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), bodyMat); head.position.y = 2.4; head.castShadow = true; rootGroup.add(head);
        let visor = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.22, 0.15), visorMat); visor.position.set(0, 2.45, -0.4); rootGroup.add(visor);

        let torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.4, 0.6), armorMat); torso.position.y = 1.3; torso.castShadow = true; rootGroup.add(torso);
        
        let leftLegPivot = new THREE.Group(); leftLegPivot.position.set(-0.35, 0.7, 0);
        let leftLegMesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.2, 0.5), bodyMat); leftLegMesh.position.y = -0.6; leftLegMesh.castShadow = true; leftLegPivot.add(leftLegMesh); rootGroup.add(leftLegPivot);
        
        let rightLegPivot = new THREE.Group(); rightLegPivot.position.set(0.35, 0.7, 0);
        let rightLegMesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.2, 0.5), bodyMat); rightLegMesh.position.y = -0.6; rightLegMesh.castShadow = true; rightLegPivot.add(rightLegMesh); rootGroup.add(rightLegPivot);
        
        let leftArmGroup = new THREE.Group(); leftArmGroup.position.set(-0.8, 1.4, 0);
        let leftArmMesh = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.2, 0.4), bodyMat); leftArmMesh.position.y = -0.5; leftArmMesh.castShadow = true; leftArmGroup.add(leftArmMesh); rootGroup.add(leftArmGroup);
        
        let rightArmGroup = new THREE.Group(); rightArmGroup.position.set(0.8, 1.4, 0);
        let rightArmMesh = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 1.0), armorMat); rightArmMesh.position.set(0, 0, -0.5); rightArmMesh.castShadow = true; rightArmGroup.add(rightArmMesh); 
        rootGroup.add(rightArmGroup);

        let gliderMesh = createGliderMesh();

        return {

          gliderMesh: gliderMesh, equipWeaponVisual: equipWeaponVisual, getGun: () => currentGun, animTime: Math.random() * 10
        };
      }

      function createFortniteDamageText(amount, worldPos, isHeadshot) {
        let vector = worldPos.clone().project(camera);
        let x = (vector.x * .5 + .5) * window.innerWidth;
        let y = (-(vector.y * .5) + .5) * window.innerHeight;
        let el = document.createElement('div');
        let color = isHeadshot ? '#ffd700' : '#ff5533'; 
        el.style.cssText = `position: absolute; left: ${x}px; top: ${y}px; color: ${color}; font-family: 'Orbitron', sans-serif; font-size: ${isHeadshot ? '42px' : '28px'}; font-weight: 900; text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000; pointer-events: none; z-index: 99999; transform: translate(-50%, -50%);`;
        el.innerText = Math.ceil(amount * (isHeadshot ? 20 : 10));
        container.appendChild(el);
        damageTexts.push({ element: el, pos: worldPos.clone(), vx: (Math.random() - 0.5) * 60, vy: -120, age: 0, maxAge: 30 });
      }

      function updateDamageTexts(dt) {
        for (let i = damageTexts.length - 1; i >= 0; i--) {
          let t = damageTexts[i]; t.age++; t.vy += 350 * dt; t.pos.y -= (t.vy * 0.0002);
          let vector = t.pos.clone().project(camera);
          t.element.style.left = `${(vector.x * .5 + .5) * window.innerWidth}px`;
          t.element.style.top = `${(-(vector.y * .5) + .5) * window.innerHeight}px`;
          if (t.age > 15) t.element.style.opacity = (30 - t.age) / 15;
          if (t.age >= 30) { t.element.remove(); damageTexts.splice(i, 1); }
        }
      }

      let floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({ color: 0x111522, roughness: 0.8 }));
      floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

      function getTerrainHeight(x, z) {
        if (selectedMode !== 'BR') return 0;
        if (Math.abs(x) > MAP_SIZE / 2 || Math.abs(z) > MAP_SIZE / 2) return 0;
        
        let townCenters = [
          { x: 0, z: 0, r: 100 },
          { x: -220, z: -220, r: 90 },
          { x: 220, z: 220, r: 90 },
          { x: -220, z: 220, r: 90 },
          { x: 220, z: -220, r: 90 },
          { x: 0, z: -280, r: 90 },
          { x: 0, z: 280, r: 90 }
        ];

        for (let t of townCenters) {
          let dist = Math.hypot(x - t.x, z - t.z);
          if (dist < t.r) {
            return 0;
          } else if (dist < t.r + 35) {
            let rawY = Math.sin(x * 0.015) * Math.cos(z * 0.015) * 18.0 + Math.sin(x * 0.05) * 6.0;
            let factor = (dist - t.r) / 35;
            return rawY * factor;
          }
        }

        return Math.sin(x * 0.015) * Math.cos(z * 0.015) * 18.0 + Math.sin(x * 0.05) * 6.0;
      }

      function createWall(w, h, d, x, z, yPos = null, isDestructible = false, tex = null) {
        let gY = yPos !== null ? yPos : (getTerrainHeight(x, z) + h/2);
        let mat = tex ? new THREE.MeshStandardMaterial({ map: tex, roughness: 0.7, metalness: 0.2 }) : new THREE.MeshStandardMaterial({ color: 0x151d2a, roughness: 0.5, metalness: 0.5 });
        let mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
        mesh.position.set(x, gY, z); mesh.castShadow = true; mesh.receiveShadow = true;
        scene.add(mesh); stageProps.push(mesh);
        
        let wallData = { mesh: mesh, x: x, y: gY, z: z, w: w, h: h, d: d, hp: 8.0, maxHp: 8.0, isDestructible: isDestructible };
        walls.push(wallData);
        if (isDestructible) destructibles.push(wallData);
        return mesh;
      }

      function createTree(x, z) {
        let y = getTerrainHeight(x, z);
        let treeGroup = new THREE.Group();
        
        let trunkGeo = new THREE.CylinderGeometry(0.5, 0.7, 5, 8);
        let trunkMat = new THREE.MeshStandardMaterial({ color: 0x3d2314, roughness: 0.9 });
        let trunk = new THREE.Mesh(trunkGeo, trunkMat);
        trunk.position.y = 2.5;
        trunk.castShadow = true;
        treeGroup.add(trunk);

        let leavesGeo = new THREE.ConeGeometry(3.5, 7, 8);
        let leavesMat = new THREE.MeshStandardMaterial({ color: 0x1e4d2b, roughness: 0.6 });
        let leaves = new THREE.Mesh(leavesGeo, leavesMat);
        leaves.position.y = 6.5;
        leaves.castShadow = true;
        treeGroup.add(leaves);

        treeGroup.position.set(x, y, z);
        scene.add(treeGroup);
        stageProps.push(treeGroup);
      }

      function createTallBuilding(cx, cz) {
        let baseFloorY = getTerrainHeight(cx, cz);
        let floorHeight = 6.0;
        let totalFloors = 4;

        for (let f = 0; f < totalFloors; f++) {
          let currentY = baseFloorY + f * floorHeight;
          createWall(16, 0.4, 16, cx, cz, currentY, false, texWood);

          createWall(16, floorHeight, 1, cx, cz - 8, currentY + floorHeight/2, true, texBrick);
          createWall(16, floorHeight, 1, cx, cz + 8, currentY + floorHeight/2, true, texBrick);
          createWall(1, floorHeight, 16, cx - 8, cz, currentY + floorHeight/2, true, texBrick);
          createWall(1, floorHeight, 16, cx + 8, cz, currentY + floorHeight/2, true, texBrick);

          if (f > 0) spawnChest(cx + (Math.random()*6-3), currentY + 0.2, cz + (Math.random()*6-3));
        }
        let roofY = baseFloorY + totalFloors * floorHeight;
        createWall(18, 0.5, 18, cx, cz, roofY, false, texWood);
        spawnChest(cx, roofY + 0.25, cz);
      }

      function createWideHouse(cx, cz) {
        let baseFloorY = getTerrainHeight(cx, cz);
        let floorHeight = 5.5;

        createWall(26, 0.4, 20, cx, cz, baseFloorY, false, texWood);
        createWall(26, floorHeight, 1, cx, cz - 10, baseFloorY + floorHeight/2, true, texBrick);
        createWall(26, floorHeight, 1, cx, cz + 10, baseFloorY + floorHeight/2, true, texBrick);
        createWall(1, floorHeight, 20, cx - 13, cz, baseFloorY + floorHeight/2, true, texBrick);
        createWall(1, floorHeight, 20, cx + 13, cz, baseFloorY + floorHeight/2, true, texBrick);
        spawnChest(cx - 8, baseFloorY + 0.2, cz - 5);

        let floor2Y = baseFloorY + floorHeight;
        createWall(26, 0.4, 20, cx, cz, floor2Y, false, texWood);
        createWall(26, floorHeight, 1, cx, cz - 10, floor2Y + floorHeight/2, true, texBrick);
        createWall(26, floorHeight, 1, cx, cz + 10, floor2Y + floorHeight/2, true, texBrick);
        createWall(1, floorHeight, 20, cx - 13, cz, floor2Y + floorHeight/2, true, texBrick);
        createWall(1, floorHeight, 20, cx + 13, cz, floor2Y + floorHeight/2, true, texBrick);

        createWall(1, floorHeight, 10, cx, cz - 5, floor2Y + floorHeight/2, true, texWood);
        spawnChest(cx + 6, floor2Y + 0.2, cz + 4);

        let roofY = floor2Y + floorHeight;
        createWall(28, 0.5, 22, cx, cz, roofY, false, texWood);
        spawnChest(cx, roofY + 0.25, cz);
      }

      function createBRTerrainAndTowns() {
        let geo = new THREE.PlaneGeometry(MAP_SIZE, MAP_SIZE, 120, 120);
        geo.rotateX(-Math.PI / 2);
        let pos = geo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          let x = pos.getX(i);
          let z = pos.getZ(i);
          pos.setY(i, getTerrainHeight(x, z));
        }
        geo.computeVertexNormals();

        let mat = new THREE.MeshStandardMaterial({ map: texGrass, roughness: 0.85, metalness: 0.1 });
        terrainMesh = new THREE.Mesh(geo, mat);
        terrainMesh.receiveShadow = true;
        scene.add(terrainMesh);
        stageProps.push(terrainMesh);

        let b = MAP_SIZE / 2;
        walls.push(
          { x: 0, y: 50, z: b, w: MAP_SIZE, h: 200, d: 4 },
          { x: 0, y: 50, z: -b, w: MAP_SIZE, h: 200, d: 4 },
          { x: b, y: 50, z: 0, w: 4, h: 200, d: MAP_SIZE },
          { x: -b, y: 50, z: 0, w: 4, h: 200, d: MAP_SIZE }
        );

        let towns = [
          { cx: 0, cz: 0, type: 'CAPITAL' },
          { cx: -220, cz: -220, type: 'TOWERS' },
          { cx: 220, cz: 220, type: 'HOUSES' },
          { cx: -220, cz: 220, type: 'TOWERS' },
          { cx: 220, cz: -220, type: 'HOUSES' }
        ];

        towns.forEach(t => {
          if (t.type === 'CAPITAL') {
            createTallBuilding(t.cx - 20, t.cz - 20);
            createTallBuilding(t.cx + 20, t.cz + 20);
            createWideHouse(t.cx + 25, t.cz - 25);
          } else if (t.type === 'TOWERS') {
            createTallBuilding(t.cx, t.cz);
            createWideHouse(t.cx + 30, t.cz);
          } else {
            createWideHouse(t.cx, t.cz);
          }
        });

        for (let i = 0; i < 40; i++) {
          let rx = (Math.random() - 0.5) * (MAP_SIZE - 120);
          let rz = (Math.random() - 0.5) * (MAP_SIZE - 120);
          createTree(rx, rz);
        }

        for (let i = 0; i < 25; i++) {
          let rx = (Math.random() - 0.5) * (MAP_SIZE - 100);
          let rz = (Math.random() - 0.5) * (MAP_SIZE - 100);
          spawnChest(rx, getTerrainHeight(rx, rz) + 0.2, rz);
        }
      }

      function spawnChest(x, y, z) {
        let boxGeo = new THREE.BoxGeometry(2, 1.4, 1.4);
        let boxMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 });
        let mesh = new THREE.Mesh(boxGeo, boxMat);
        mesh.position.set(x, y + 0.7, z);
        mesh.castShadow = true;
        scene.add(mesh);
        stageProps.push(mesh);
        chests.push({ mesh: mesh, x: x, y: y, z: z, opened: false });
      }

      function rebuildStage(mode) {
        stageProps.forEach(p => scene.remove(p)); stageProps = []; walls = []; destructibles = []; chests = [];
        if (currentGrid) scene.remove(currentGrid);
        if (terrainMesh) { scene.remove(terrainMesh); terrainMesh = null; }

        if (mode === 'BR') {
          createBRTerrainAndTowns();
          scene.fog = new THREE.FogExp2(0x87ceeb, 0.0012);
          renderer.setClearColor(0x87ceeb);
        } else if (mode === 'ZOMBIE') {
          floor.material.color.setHex(0x0a0505); currentGrid = new THREE.GridHelper(100, 40, 0xff0000, 0x330000); scene.fog = new THREE.FogExp2(0x1a0a0a, 0.025); renderer.setClearColor(0x1a0a0a);
          [{x: -18, z: -18}, {x: 18, z: 18}, {x: -18, z: 18}, {x: 18, z: -18}].forEach(p => { createWall(6, 6, 6, p.x, p.z); });
          currentGrid.position.y = 0.01; scene.add(currentGrid);
        } else {
          floor.material.color.setHex(0x050a15); currentGrid = new THREE.GridHelper(100, 40, 0x00a8ff, 0x002b47); scene.fog = new THREE.FogExp2(0x050812, 0.015); renderer.setClearColor(0x050812);
          createWall(4, 10, 4, 0, 0); createWall(10, 5, 2, -15, 5); createWall(10, 5, 2, 15, -5);
          currentGrid.position.y = 0.01; scene.add(currentGrid);
        }
      }

      function checkCollision(px, pz, radius, py = 0) {
        for (let i = 0; i < walls.length; i++) {
          let w = walls[i];
          if (py >= w.y - w.h/2 - 0.2 && py < w.y + w.h/2 - 0.4) {
            if (px > w.x - w.w/2 - radius && px < w.x + w.w/2 + radius && pz > w.z - w.d/2 - radius && pz < w.z + w.d/2 + radius) {
              return true;
            }
          }
        }
        return false;
      }

      socket.on('zombie_online_start', (data) => { startZombieGameOnline(data); });

      function startZombieGameOnline(data) {
        rebuildStage('ZOMBIE');
        isRoundEnding = false;
        let currentW = weaponStats[saveData.equipped];
        player.hp = 100; player.shield = 100; player.maxAmmo = currentW.maxAmmo; player.ammo = player.maxAmmo; player.isReloading = false; player.shootCooldownTimer = 0;

      function showGameOverMenu() {
        gameState = 'GAMEOVER'; document.exitPointerLock(); hud.style.display = 'none'; crosshair.style.display = 'none'; viewIndicator.style.display='none'; opponentNametag.style.display = 'none'; lootPrompt.style.display = 'none'; gliderPrompt.style.display = 'none'; backpackContainer.style.display = 'none'; menuOverlay.style.display = 'flex'; playerModel.mesh.visible = false;

        } else {

          let titleColor = isWin ? '#00a8ff' : '#ff3b30';

          menuOverlay.innerHTML = `<h1 style="font-size:50px;color:${titleColor};margin-bottom:10px;font-family:'Orbitron', sans-serif;">${text}</h1><p style="font-size:24px;margin-bottom:10px;">スコア: Player ${playerWins} - ${rivalWins} Enemy</p><p style="font-size:22px;margin-bottom:40px;color:#ffd700;">💰 +${reward} Coins</p><button id="retry-btn" style="padding:15px 40px;font-size:22px;background:#00a8ff;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:bold;font-family:'Orbitron', sans-serif;">Return</button>`;
        }
        document.getElementById('retry-btn').addEventListener('click', () => { showModeSelectMenu(); });

      function updateHUD() {
        let hpPercent = Math.max(0, (player.hp / player.maxHp) * 100);
        let shieldPercent = Math.max(0, (player.shield / player.maxShield) * 100);
        let ammoText = player.isReloading ? 'RELOADING' : `${player.ammo}/${player.maxAmmo}`;

        if (selectedMode === 'BR') {
          updateBackpackUI();
          hud.innerHTML = `

              <span style="color:#ffd700; font-family:'Orbitron', sans-serif; font-size:15px;">🏆 ALIVE: ${enemies.length + 1}</span>
              <span style="color:#00f5d4;">${weaponStats[saveData.equipped].name}</span>
              <span style="background:rgba(255,255,255,0.2); padding:2px 8px; border-radius:10px;">${ammoText}</span>
            </div>
            <div style="margin-bottom:5px; width:100%; height:8px; background:rgba(0,191,255,0.1); border-radius:4px; overflow:hidden; border:1px solid rgba(0,191,255,0.25);"><div style="width:${shieldPercent}%; height:100%; background:#00bfff; box-shadow:0 0 8px #00bfff;"></div></div>
            <div style="width:100%; height:8px; background:rgba(57,255,20,0.1); border-radius:4px; overflow:hidden; border:1px solid rgba(57,255,20,0.25);"><div style="width:${hpPercent}%; height:100%; background:#39ff14; box-shadow:0 0 8px #39ff14;"></div></div>
          `;
        } else if (selectedMode === 'ZOMBIE') {
          backpackContainer.style.display = 'none';
          let zombieCount = enemies.filter(e => !e.isOnline).length;
          hud.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; font-size:14px; font-weight:bold;">
              <span style="color:#ff3b30; font-family:'Orbitron', sans-serif; font-size:15px;">🧟 WAVE ${currentWave}</span>
              <span style="color:rgba(255,255,255,0.7); font-size:12px;">Remaining: <span style="color:#fff;">${zombieCount}</span></span>
              <span style="color:#00f5d4;">${weaponStats[saveData.equipped].name}</span>
              <span style="background:rgba(255,255,255,0.2); padding:2px 8px; border-radius:10px;">${ammoText}</span>
            </div>
            <div style="margin-bottom:5px; width:100%; height:8px; background:rgba(0,191,255,0.1); border-radius:4px; overflow:hidden; border:1px solid rgba(0,191,255,0.25);"><div style="width:${shieldPercent}%; height:100%; background:#00bfff;"></div></div>
            <div style="width:100%; height:8px; background:rgba(57,255,20,0.1); border-radius:4px; overflow:hidden; border:1px solid rgba(57,255,20,0.25);"><div style="width:${hpPercent}%; height:100%; background:#39ff14;"></div></div>
          `;
        } else {
          backpackContainer.style.display = 'none';
          let rivalHpPercent = rival ? Math.max(0, (rival.hp / rival.maxHp) * 100) : 0;
          let rivalName = rival ? (rival.name || 'RIVAL') : 'RIVAL';
          hud.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; font-size:14px; font-weight:bold;">
              <span style="color:#00a8ff; font-family:'Orbitron', sans-serif; font-size:15px;">⚔️ 1v1 ROUND ${duelRound}</span>
              <span style="color:#ffd700;">👑 ${playerWins} - ${rivalWins}</span>
              <span style="background:rgba(255,255,255,0.2); padding:2px 8px; border-radius:10px;">${ammoText}</span>
            </div>
            <div style="color:#39ff14; font-size:11px; font-weight:bold; margin-bottom:2px;">${saveData.playerName || 'YOU'}</div>
            <div style="margin-bottom:8px; width:100%; height:8px; background:rgba(57,255,20,0.1); border-radius:4px; overflow:hidden; border:1px solid rgba(57,255,20,0.25);"><div style="width:${hpPercent}%; height:100%; background:#39ff14;"></div></div>
            <div style="color:#ff3b30; font-size:11px; font-weight:bold; margin-bottom:2px;">${rivalName}</div>
            <div style="width:100%; height:8px; background:rgba(255,59,48,0.1); border-radius:4px; overflow:hidden; border:1px solid rgba(255,59,48,0.25);"><div style="width:${rivalHpPercent}%; height:100%; background:#ff3b30;"></div></div>
          `;
        }
        viewIndicator.innerText = isFirstPerson ? "👁️ First Person" : "🎥 Third Person";
      }

      function startZombieGame() {
        isRoundEnding = false;
        let currentW = weaponStats[saveData.equipped];
        player.hp = 100; player.shield = 100; player.maxAmmo = currentW.maxAmmo; player.ammo = player.maxAmmo; player.isReloading = false; player.shootCooldownTimer = 0;
        currentWave = 0; totalKills = 0; meleeDamageTimer = 0;
        playerPhys.x = 0; playerPhys.y = 0; playerPhys.z = 20; playerPhys.vy = 0; playerPhys.isSkyDiving = false; playerPhys.isGliding = false;
        playerModel.gliderMesh.visible = false;
        playerModel.mesh.position.set(playerPhys.x, playerPhys.y, playerPhys.z);
        playerModel.mesh.visible = !isFirstPerson; 
        playerModel.equipWeaponVisual(saveData.equipped, currentW.color);
        playerBullets.forEach(b => scene.remove(b.mesh)); enemies.forEach(e => scene.remove(e.mesh));
        playerBullets = []; enemies = [];
        menuOverlay.style.display = 'none'; hud.style.display = 'block'; crosshair.style.display = 'block'; viewIndicator.style.display='block';
        gameState = 'PLAYING'; renderer.domElement.requestPointerLock();
        startNextWave();
      }

      function startNextWave() {
        if (gameState !== 'PLAYING') return;
        currentWave++;
        showCentralMessage(`WAVE ${currentWave} START!`, "#ff3b30", 2000);
        let count = Math.round(4 + currentWave * 2);
        for(let i = 0; i < count; i++) { spawnZombie(); }
        updateHUD();
      }

      function spawnZombie() {
        let ex = 0, ez = -20;
        for (let i = 0; i < 50; i++) {
          let candX = (Math.random() - 0.5) * 70;
          let candZ = (Math.random() - 0.5) * 70;
          if (Math.hypot(candX - playerPhys.x, candZ - playerPhys.z) > 15 && !checkCollision(candX, candZ, 1.2, 0)) {
            ex = candX; ez = candZ; break;
          }
        }
        let modelData = createTacticalRobloxModel(0x2d6a4f, true); 
        modelData.mesh.position.set(ex, 0, ez); scene.add(modelData.mesh);
        enemies.push({ 
          id: 'zombie_' + Math.random(),
          model: modelData, mesh: modelData.mesh, radius: 1.0, hp: 4 + currentWave * 1.5, 
          speed: 0.07 + Math.random() * 0.04, damage: 10, isRival: false
        });
      }

      function start1v1Game() { playerWins = 0; rivalWins = 0; duelRound = 1; setup1v1Round(); }

      function setup1v1Round() {
        isRoundEnding = false; player.hp = 100; player.shield = 100;
        let currentW = weaponStats[saveData.equipped];
        player.maxAmmo = currentW.maxAmmo; player.ammo = player.maxAmmo; player.isReloading = false;
        playerPhys.x = 0; playerPhys.y = 0; playerPhys.z = 30; playerPhys.vy = 0; playerPhys.isSkyDiving = false; playerPhys.isGliding = false;
        playerModel.gliderMesh.visible = false;
        playerModel.mesh.position.set(playerPhys.x, playerPhys.y, playerPhys.z);
        playerModel.mesh.visible = !isFirstPerson;
        playerModel.equipWeaponVisual(saveData.equipped, currentW.color);

        if (rival) { scene.remove(rival.mesh); }
        playerBullets.forEach(b => scene.remove(b.mesh)); playerBullets = [];
        enemies.forEach(e => scene.remove(e.mesh)); enemies = [];

        let rivalModel = createTacticalRobloxModel(0xd62828, true); rivalModel.mesh.position.set(0, 0, -30); scene.add(rivalModel.mesh);
        rival = { name: 'BOT Rival', model: rivalModel, mesh: rivalModel.mesh, radius: 1.0, hp: 40, maxHp: 40, speed: 0.16, isRival: true, shootTimer: 0, vx: 0, vz: 0, dirChangeTimer: 0 };
        enemies.push(rival);

        menuOverlay.style.display = 'none'; hud.style.display = 'block'; crosshair.style.display = 'block'; viewIndicator.style.display='block';
        gameState = 'PLAYING'; renderer.domElement.requestPointerLock();
        showCentralMessage(`ROUND ${duelRound}`, "#00a8ff", 2000);
        updateHUD();
      }

      function startOnlineMatchmaking() {
        menuOverlay.innerHTML = `
          <h2 style="font-size:32px; color:#39ff14; font-family:'Orbitron', sans-serif; margin-top:80px;">🌐 SEARCHING FOR OPPONENT...</h2>
          <button id="cancel-online-btn" style="margin-top:40px; padding:12px 30px; background:#ff3b30; color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">Cancel</button>
        `;
        document.getElementById('cancel-online-btn').addEventListener('click', () => { socket.emit('cancel_matchmaking'); show1v1SubMenu(); });
        socket.emit('join_matchmaking', { name: saveData.playerName, weapon: saveData.equipped });
      }

      socket.on('match_found', (data) => {
        currentRoomId = data.roomId; onlineRole = data.role; playerWins = 0; rivalWins = 0; duelRound = 1;
        setupOnlineRound(data);
      });

      function setupOnlineRound(data) {
        isRoundEnding = false; player.hp = 100; player.shield = 100;
        let currentW = weaponStats[saveData.equipped]; player.maxAmmo = currentW.maxAmmo; player.ammo = player.maxAmmo; player.isReloading = false;
        let startPos = data ? data.startPos : (onlineRole === 'player1' ? {x:0, y:0, z:30} : {x:0, y:0, z:-30});
        playerPhys.x = startPos.x; playerPhys.y = startPos.y; playerPhys.z = startPos.z; playerPhys.vy = 0; playerPhys.isSkyDiving = false; playerPhys.isGliding = false;
        playerModel.gliderMesh.visible = false;
        playerModel.mesh.position.set(playerPhys.x, playerPhys.y, playerPhys.z);
        playerModel.mesh.visible = !isFirstPerson;
        playerModel.equipWeaponVisual(saveData.equipped, currentW.color);

        if (rival) scene.remove(rival.mesh);
        playerBullets.forEach(b => scene.remove(b.mesh)); playerBullets = [];
        enemies.forEach(e => scene.remove(e.mesh)); enemies = [];

        let rivalModel = createTacticalRobloxModel(0x00a8ff, true); 
        let rivalStartPos = onlineRole === 'player1' ? {x:0, y:0, z:-30} : {x:0, y:0, z:30};
        rivalModel.mesh.position.set(rivalStartPos.x, rivalStartPos.y, rivalStartPos.z);
        scene.add(rivalModel.mesh);

        let oppWeapon = data ? data.opponentWeapon : 'laser';
        rivalModel.equipWeaponVisual(oppWeapon, weaponStats[oppWeapon] ? weaponStats[oppWeapon].color : 0xff0000);

        rival = {
          name: data ? data.opponentName : 'Online Player', model: rivalModel, mesh: rivalModel.mesh, radius: 1.0,
          hp: 100, maxHp: 100, isRival: true, isOnline: true, targetPosition: rivalModel.mesh.position.clone(), targetYaw: 0, targetPitch: 0
        };
        enemies.push(rival);

        opponentNametag.innerText = rival.name; opponentNametag.style.display = 'block';
        menuOverlay.style.display = 'none'; hud.style.display = 'block'; crosshair.style.display = 'block'; viewIndicator.style.display='block';
        gameState = 'PLAYING'; renderer.domElement.requestPointerLock();
        showCentralMessage(`ROUND ${duelRound}`, "#39ff14", 2000);
        updateHUD();
      }

      socket.on('opponent_update', (data) => {
        let targetEnemy = enemies.find(e => e.id === data.id) || rival;
        if (targetEnemy && targetEnemy.isOnline) {
          targetEnemy.targetPosition.set(data.x, data.y, data.z);
          targetEnemy.targetYaw = data.yaw; targetEnemy.targetPitch = data.pitch;
        }
      });

      setInterval(() => {
        if (gameState === 'PLAYING' && currentRoomId) {
          let moving = keys[saveData.keyMap.forward] || keys[saveData.keyMap.backward] || keys[saveData.keyMap.left] || keys[saveData.keyMap.right];
          socket.emit('player_update', {
            id: socket.id, roomId: currentRoomId, x: playerPhys.x, y: playerPhys.y, z: playerPhys.z, yaw: yaw, pitch: pitch, moving: moving
          });
        }
      }, 33);

      socket.on('opponent_shoot', (data) => {
        let bGeo = new THREE.CylinderGeometry(0.06, 0.06, 1.2, 4);
        let rbMesh = new THREE.Mesh(bGeo, new THREE.MeshBasicMaterial({ color: data.color || 0xff0000 }));
        rbMesh.position.set(data.pos.x, data.pos.y, data.pos.z);
        rbMesh.rotation.set(data.rot.x, data.rot.y, data.rot.z);
        scene.add(rbMesh);
        playerBullets.push({ mesh: rbMesh, direction: new THREE.Vector3(data.dir.x, data.dir.y, data.dir.z), dmg: data.dmg, speed: data.speed, life: 60, fromPlayer: false });
      });

      socket.on('take_damage', (data) => {
        if (isRoundEnding) return;
        triggerDamageFlash();
        let dAmount = data.dmg * 10;
        if (player.shield > 0) { player.shield -= dAmount; if (player.shield < 0) { player.hp += player.shield; player.shield = 0; } } 
        else { player.hp -= dAmount; }
        updateHUD();

        if (player.hp <= 0 && !isRoundEnding) {
          isRoundEnding = true;
          if (selectedMode === 'BR' || selectedMode === 'ZOMBIE') showGameOverMenu();
          else socket.emit('round_win', { roomId: currentRoomId });
        }
      });

      socket.on('building_damaged', (data) => {
        let w = destructibles[data.index];
        if (w) {
          w.hp -= data.dmg;
          if (w.hp <= 0) {
            scene.remove(w.mesh);
            walls = walls.filter(item => item !== w);
            destructibles = destructibles.filter(item => item !== w);
          }
        }
      });

      socket.on('chest_opened', (data) => {
        let c = chests[data.index];
        if (c && !c.opened) {
          c.opened = true;
          c.mesh.material.color.setHex(0x333333);
        }
      });

      socket.on('round_complete', (data) => {
        if (data.winnerId === socket.id) playerWins++; else rivalWins++;
        if (playerWins >= 3 || rivalWins >= 3) showGameOverMenu();
        else { duelRound = data.nextRound; setupOnlineRound(null); }
      });

      socket.on('opponent_disconnected', () => {
        if (gameState === 'PLAYING' && selectedMode !== 'BR') { alert('対戦相手が切断しました。'); showModeSelectMenu(); }
      });

      function handlePlayerShooting() {
        if (!isMouseDown || player.isReloading || player.ammo <= 0 || player.shootCooldownTimer > 0) return;
        let currentW = weaponStats[saveData.equipped];
        player.ammo--; player.shootCooldownTimer = currentW.shootInterval; updateHUD();
        
        let camDir = new THREE.Vector3(); camera.getWorldDirection(camDir);
        let targetPoint = new THREE.Vector3().copy(camera.position).addScaledVector(camDir, 60);
        let muzzleWorldPos = new THREE.Vector3(); playerModel.rightArmGroup.getWorldPosition(muzzleWorldPos);

        let bGeo = (saveData.equipped === 'plasma' || saveData.equipped === 'blizzard') ? new THREE.SphereGeometry(currentW.size, 8, 8) : new THREE.CylinderGeometry(currentW.size, currentW.size, 1.5, 4);
        let bulletDirection = new THREE.Vector3().subVectors(targetPoint, muzzleWorldPos).normalize();

        if (saveData.equipped === 'flame') {
          for(let k=0; k<2; k++) {
            let bMesh = new THREE.Mesh(new THREE.SphereGeometry(currentW.size, 6, 6), new THREE.MeshBasicMaterial({ color: 0xff4500, transparent: true, opacity: 0.85 }));
            bMesh.position.copy(muzzleWorldPos);
            let spreadDir = new THREE.Vector3().copy(camDir); spreadDir.x += (Math.random() - 0.5) * 0.2; spreadDir.z += (Math.random() - 0.5) * 0.2; spreadDir.normalize();
            scene.add(bMesh); playerBullets.push({ mesh: bMesh, direction: spreadDir, dmg: currentW.dmg, speed: currentW.speed, life: 25, isFlame: true, fromPlayer: true });
          }
        } else if (saveData.equipped === 'shotgun') {
          [-0.1, 0, 0.1].forEach(angle => {
            let bMesh = new THREE.Mesh(new THREE.CylinderGeometry(currentW.size, currentW.size, 1.2, 4), new THREE.MeshBasicMaterial({ color: currentW.color }));
            bMesh.position.copy(muzzleWorldPos); bMesh.lookAt(targetPoint); bMesh.rotateX(Math.PI / 2); bMesh.rotateY(angle);
            scene.add(bMesh); playerBullets.push({ mesh: bMesh, direction: new THREE.Vector3(0, 0, -1).applyQuaternion(bMesh.quaternion).normalize(), dmg: currentW.dmg, speed: currentW.speed, life: 40, fromPlayer: true });
          });
        } else {
          let bMesh = new THREE.Mesh(bGeo, new THREE.MeshBasicMaterial({ color: currentW.color }));
          bMesh.position.copy(muzzleWorldPos); bMesh.lookAt(targetPoint);
          if(!(saveData.equipped === 'plasma' || saveData.equipped === 'blizzard')) bMesh.rotateX(Math.PI / 2);
          scene.add(bMesh); playerBullets.push({ mesh: bMesh, direction: bulletDirection, dmg: currentW.dmg, speed: currentW.speed, life: 60, isPierce: currentW.isPierce, fromPlayer: true });
        }

        if (currentRoomId) {
          socket.emit('player_shoot', {
            roomId: currentRoomId, pos: muzzleWorldPos, dir: bulletDirection, rot: playerModel.rightArmGroup.rotation, dmg: currentW.dmg, speed: currentW.speed, color: currentW.color
          });
        }

        if (player.ammo <= 0) triggerReload();
      }

      function triggerReload() { if(!player.isReloading && player.ammo < player.maxAmmo) { player.isReloading = true; player.reloadTimer = weaponStats[saveData.equipped].reloadTime; updateHUD(); } }

      let keys = {}; let baseSpeed = 0.25; let yaw = 0, pitch = -0.05;
      container.addEventListener('contextmenu', e => e.preventDefault());
      renderer.domElement.addEventListener('click', () => { if (gameState === 'PLAYING') renderer.domElement.requestPointerLock(); });

      document.addEventListener('mousemove', (e) => {
        if (gameState === 'PLAYING' && document.pointerLockElement === renderer.domElement) {
          let sens = isAiming ? 0.0012 : 0.0024;
          yaw -= e.movementX * sens; pitch -= e.movementY * sens * 0.8;
          pitch = Math.max(-Math.PI/4, Math.min(Math.PI/4, pitch));
        }
      });

      window.addEventListener('keydown', (e) => { 
        if (gameState === 'KEYCONFIG' || gameState === 'NAME_INPUT') return; 
        keys[e.code] = true; 
        if(gameState === 'PLAYING') {
          if (e.code === 'Digit1') switchInventorySlot(0);
          if (e.code === 'Digit2') switchInventorySlot(1);

          if (e.code === saveData.keyMap.reload) triggerReload();

          if (e.code === saveData.keyMap.jump) {
            if (playerPhys.isSkyDiving && !playerPhys.isGliding) {
              playerPhys.isGliding = true;
              playerModel.gliderMesh.visible = true;
              showCentralMessage("🪂 グライダー展開！", "#00f5d4", 1500);
            } else if (playerPhys.isGrounded) {
              playerPhys.vy = 0.26; playerPhys.isGrounded = false;
            }
          }

          if (e.code === saveData.keyMap.switchView) { isFirstPerson = !isFirstPerson; playerModel.mesh.visible = !isFirstPerson; updateHUD(); }
          
          if (e.code === saveData.keyMap.interact && selectedMode === 'BR') {
            chests.forEach((c, idx) => {
              if (!c.opened && Math.hypot(c.x - playerPhys.x, c.y - playerPhys.y, c.z - playerPhys.z) < 3.8) {
                c.opened = true;
                c.mesh.material.color.setHex(0x333333);
                
                let randomWeapons = ['minigun', 'sniper', 'shotgun', 'revolver', 'plasma', 'voidray', 'flame'];
                let rewardWeapon = randomWeapons[Math.floor(Math.random() * randomWeapons.length)];
                
                if (inventory[0] === null) {
                  inventory[0] = rewardWeapon;
                  switchInventorySlot(0);
                } else if (inventory[1] === null) {
                  inventory[1] = rewardWeapon;
                  switchInventorySlot(1);
                } else {
                  inventory[activeSlot] = rewardWeapon;
                  switchInventorySlot(activeSlot);
                }

                showCentralMessage(`📦 GET: ${weaponStats[rewardWeapon].name}!`, "#ffd700", 2000);
                if (currentRoomId) socket.emit('chest_open', { roomId: currentRoomId, index: idx });
              }
            });
          }
        }
      });

      window.addEventListener('keyup', (e) => { keys[e.code] = false; });
      window.addEventListener('mousedown', (e) => { if (e.button === 0 && gameState === 'PLAYING') isMouseDown = true; if (e.button === 2 && gameState === 'PLAYING') isAiming = true; });
      window.addEventListener('mouseup', (e) => { if (e.button === 0) isMouseDown = false; if (e.button === 2) isAiming = false; });

      let clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        let dt = clock.getDelta();

        if (gameState === 'PLAYING') {
          if (player.shootCooldownTimer > 0) player.shootCooldownTimer--;
          if (player.isReloading) {
            player.reloadTimer--;
            if (player.reloadTimer <= 0) {
              player.isReloading = false; player.ammo = player.maxAmmo; updateHUD();
            }
          }

          handlePlayerShooting();

          // Player movement
          let moveSpeed = keys[saveData.keyMap.dash] ? baseSpeed * 1.5 : baseSpeed;
          let dx = 0, dz = 0;
          if (keys[saveData.keyMap.forward]) dz -= 1;
          if (keys[saveData.keyMap.backward]) dz += 1;
          if (keys[saveData.keyMap.left]) dx -= 1;
          if (keys[saveData.keyMap.right]) dx += 1;

          let moveDir = new THREE.Vector3(dx, 0, dz).normalize();
          moveDir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

          let nextX = playerPhys.x + moveDir.x * moveSpeed;
          let nextZ = playerPhys.z + moveDir.z * moveSpeed;

          let targetTerrainY = getTerrainHeight(nextX, nextZ);

          if (playerPhys.isSkyDiving) {
            let fallSpeed = playerPhys.isGliding ? -0.15 : -0.7;
            playerPhys.y += fallSpeed;
            if (playerPhys.y <= targetTerrainY) {
              playerPhys.y = targetTerrainY;
              playerPhys.isSkyDiving = false;
              playerPhys.isGliding = false;
              playerModel.gliderMesh.visible = false;
              playerPhys.isGrounded = true;
              gliderPrompt.style.display = 'none';
            } else {
              if (!playerPhys.isGliding) gliderPrompt.style.display = 'block';
              else gliderPrompt.style.display = 'none';
            }
          } else {
            gliderPrompt.style.display = 'none';
            if (!checkCollision(nextX, playerPhys.z, playerPhys.radius, playerPhys.y)) playerPhys.x = nextX;
            if (!checkCollision(playerPhys.x, nextZ, playerPhys.radius, playerPhys.y)) playerPhys.z = nextZ;

            playerPhys.vy -= 0.012; // Gravity
            playerPhys.y += playerPhys.vy;

            if (playerPhys.y <= targetTerrainY) {
              playerPhys.y = targetTerrainY;
              playerPhys.vy = 0;
              playerPhys.isGrounded = true;
            }
          }

          playerModel.mesh.position.set(playerPhys.x, playerPhys.y, playerPhys.z);
          playerModel.mesh.rotation.y = yaw;

          // Character walk animation
          let isMoving = dx !== 0 || dz !== 0;
          if (isMoving && playerPhys.isGrounded) {
            playerModel.animTime += 0.15;
            playerModel.leftLeg.rotation.x = Math.sin(playerModel.animTime) * 0.6;
            playerModel.rightLeg.rotation.x = -Math.sin(playerModel.animTime) * 0.6;
          } else {
            playerModel.leftLeg.rotation.x = 0;
            playerModel.rightLeg.rotation.x = 0;
          }

          // Camera setup
          let targetCamDist = isAiming ? 3.0 : cameraDist;
          let camOffset = new THREE.Vector3(0, isFirstPerson ? 1.6 : 2.2, isFirstPerson ? 0 : targetCamDist);
          camOffset.applyAxisAngle(new THREE.Vector3(1, 0, 0), pitch);
          camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

          camera.position.copy(playerModel.mesh.position).add(camOffset);
          let lookTarget = playerModel.mesh.position.clone().add(new THREE.Vector3(0, 1.6, 0));
          camera.lookAt(lookTarget);

          // Update chests interaction prompt
          let nearChest = false;
          chests.forEach(c => {
            if (!c.opened && Math.hypot(c.x - playerPhys.x, c.y - playerPhys.y, c.z - playerPhys.z) < 3.8) {
              nearChest = true;
            }
          });
          lootPrompt.style.display = (nearChest && selectedMode === 'BR') ? 'block' : 'none';

          // Enemy logic and sync
          enemies.forEach((enemy, idx) => {
            if (enemy.isOnline) {
              enemy.mesh.position.lerp(enemy.targetPosition, 0.2);
              enemy.mesh.rotation.y = enemy.targetYaw;
            } else if (enemy.isRival) {
              // Bot movement
              enemy.dirChangeTimer++;
              if (enemy.dirChangeTimer > 80) {
                enemy.dirChangeTimer = 0;
                enemy.vx = (Math.random() - 0.5) * enemy.speed;
                enemy.vz = (Math.random() - 0.5) * enemy.speed;
              }
              let bx = enemy.mesh.position.x + enemy.vx;
              let bz = enemy.mesh.position.z + enemy.vz;
              let by = getTerrainHeight(bx, bz);
              if (!checkCollision(bx, bz, enemy.radius, by)) {
                enemy.mesh.position.set(bx, by, bz);
              }
              enemy.mesh.lookAt(playerPhys.x, by + 1.2, playerPhys.z);
            } else {
              // Zombie logic
              let zDir = new THREE.Vector3(playerPhys.x - enemy.mesh.position.x, 0, playerPhys.z - enemy.mesh.position.z).normalize();
              let zX = enemy.mesh.position.x + zDir.x * enemy.speed;
              let zZ = enemy.mesh.position.z + zDir.z * enemy.speed;
              let zY = getTerrainHeight(zX, zZ);
              if (!checkCollision(zX, zZ, enemy.radius, zY)) {
                enemy.mesh.position.set(zX, zY, zZ);
              }
              enemy.mesh.lookAt(playerPhys.x, zY, playerPhys.z);

              // Zombie melee attack
              let distToPlayer = Math.hypot(enemy.mesh.position.x - playerPhys.x, enemy.mesh.position.z - playerPhys.z);
              if (distToPlayer < 1.8 && Math.abs(enemy.mesh.position.y - playerPhys.y) < 2.0) {
                meleeDamageTimer++;
                if (meleeDamageTimer > 25) {
                  meleeDamageTimer = 0;
                  triggerDamageFlash();
                  player.hp -= enemy.damage;
                  updateHUD();
                  if (player.hp <= 0) showGameOverMenu();
                }
              }
            }
          });

          // Bullet updates
          for (let i = playerBullets.length - 1; i >= 0; i--) {
            let b = playerBullets[i];
            b.life--;
            b.mesh.position.addScaledVector(b.direction, b.speed);

            let hit = false;
            if (b.fromPlayer) {
              enemies.forEach((enemy, eIdx) => {
                if (hit) return;
                let enemyPos = enemy.mesh.position.clone().add(new THREE.Vector3(0, 1.2, 0));
                if (b.mesh.position.distanceTo(enemyPos) < enemy.radius + 0.6) {
                  hit = true;
                  let isHeadshot = b.mesh.position.y > enemy.mesh.position.y + 1.8;
                  let finalDmg = isHeadshot ? b.dmg * 1.8 : b.dmg;
                  enemy.hp -= finalDmg * 10;
                  createFortniteDamageText(finalDmg, b.mesh.position, isHeadshot);

                  if (enemy.isOnline) {
                    socket.emit('player_hit', { roomId: currentRoomId, dmg: finalDmg });
                  } else if (enemy.hp <= 0) {
                    scene.remove(enemy.mesh);
                    enemies.splice(eIdx, 1);
                    totalKills++;
                    if (selectedMode === 'ZOMBIE' && enemies.filter(e => !e.isOnline).length === 0) {
                      setTimeout(startNextWave, 1500);
                    }
                  }
                }
              });

              // Building destructions
              destructibles.forEach((w, wIdx) => {
                if (hit) return;
                if (Math.abs(b.mesh.position.x - w.x) < w.w/2 && Math.abs(b.mesh.position.z - w.z) < w.d/2 && Math.abs(b.mesh.position.y - w.y) < w.h/2) {
                  hit = true;
                  w.hp -= b.dmg;
                  if (w.hp <= 0) {
                    scene.remove(w.mesh);
                    walls = walls.filter(item => item !== w);
                    destructibles.splice(wIdx, 1);
                  }
                  if (currentRoomId) socket.emit('building_damage', { roomId: currentRoomId, index: wIdx, dmg: b.dmg });
                }
              });
            }

            if (b.life <= 0 || hit) {
              scene.remove(b.mesh);
              playerBullets.splice(i, 1);
            }
          }

          updateDamageTexts(dt);
        }

        renderer.render(scene, camera);
      }

      if (saveData.playerName && saveData.playerName.trim() !== '') {
        showModeSelectMenu();
      } else {
        showNameInputMenu();
      }

      animate();
    })();
  </script>
</body>
</html>
